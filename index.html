<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface2:#f0f2ee; --line:#e1e4dd; --text:#1d2420; --muted:#68736c;
  --accent:#1f6f5c; --accent-soft:#dcefe8; --accent-text:#ffffff;
  --good:#1e7a46; --good-soft:#e1f3e8; --bad:#b9382f; --bad-soft:#fbe6e3; --warn:#a86a00; --warn-soft:#fff1d6;
  --p1:#2f6db5; --p2:#c2577f; --p3:#7a8a80;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --surface:#1b201d; --surface2:#232a26; --line:#2e3631; --text:#e7ece8; --muted:#97a39b;
    --accent:#4fb596; --accent-soft:#1f3a31; --accent-text:#0d1512;
    --good:#5cc98a; --good-soft:#1b3326; --bad:#f07a6f; --bad-soft:#3a201d; --warn:#f0b54a; --warn-soft:#3a2e15;
    --p1:#6ea4ea; --p2:#ea8db1; --p3:#9aa89f; --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-text);font-weight:800}
.who{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}

.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.err i{background:var(--bad)} .sync.wait i{background:var(--warn)}
nav.tabs{width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 100px}
h2{font-size:20px;margin:0}
h3{font-size:15px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.bar .grow{flex:1}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.month b{min-width:140px;text-align:center;text-transform:capitalize}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}

.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.icon{border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:16px;color:var(--muted)}
.icon:hover{background:var(--surface2);color:var(--text)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr} .g4{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px}

@media (max-width:640px){.kpi .val{font-size:19px}.card{padding:12px} th,td{padding:6px 3px;font-size:12.5px} th{font-size:10.5px} main{padding:12px 10px 100px}}

table{width:100%;border-collapse:collapse}

input.inl:focus{outline:2px solid var(--accent);border-color:transparent}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}

.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}

.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:3px;border-radius:10px;margin-bottom:12px}

.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.actions .left{margin-right:auto}

.big-amount input{font-size:22px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin:8px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-size:14px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .n{font-weight:600}
svg text{fill:var(--muted);font-size:11px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:2px}

.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:12px}
.choice b{display:block;font-size:15px} .choice span{font-size:13px;color:var(--muted);font-weight:400}
.btn.pri.choice span{color:inherit;opacity:.85}
/* ---- Version simplifiée ---- */
.top-in{padding:10px 16px}
main{padding-bottom:150px;max-width:720px}
main.large{max-width:1180px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;max-width:150px;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.bottom button .i{font-size:21px;line-height:1;filter:grayscale(1);opacity:.65}
nav.bottom button.on{color:var(--accent)} nav.bottom button.on .i{filter:none;opacity:1}
.fab{bottom:calc(78px + env(safe-area-inset-bottom))}
.hero-big{text-align:center;padding:22px 18px 18px;border:0;color:var(--accent-text);background:var(--accent)}

.hero-big .lbl{font-size:15px;font-weight:600;opacity:.9}

.gauge{height:12px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin:16px 0 6px}
.gauge i{display:block;height:100%;background:currentColor;border-radius:6px}
.gauge-txt{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.gbar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.gbar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.gbar i.warn{background:var(--warn)} .gbar i.bad{background:var(--bad)}
.lines .l{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lines .l:last-child{border-bottom:0} .lines .l.t{font-weight:800}
.stack>*+*{margin-top:14px}
.quick-amt{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.quick-amt input{flex:1;min-width:0;font-size:34px;font-weight:800;text-align:center;padding:8px;border:2px solid var(--accent);border-radius:14px;background:var(--surface)}
.quick-amt input:focus{outline:none}
.quick-amt button{font-size:17px;font-weight:700;width:66px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.field-simple{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 6px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis}
.cats button span{font-size:26px;line-height:1}
.cats button:hover,.cats button:active{border-color:var(--accent);background:var(--accent-soft)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}

.mline .mid{flex:1;min-width:0} .mline .t{font-weight:600} .mline .s{font-size:12px;color:var(--muted)}

details.more summary{cursor:pointer;color:var(--muted);font-size:13px;margin:2px 0 8px}

<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">€</div>Comptes du foyer</div>
    <button class="btn sm" id="btn-sync" data-act="sync">⇄ Synchroniser <span class="badge" id="badge" hidden></span></button>
  </div>
</header>
<main id="main"><div class="empty">Chargement…</div></main>
<button class="fab" id="fab" title="Ajouter une dépense ou une rentrée d'argent" aria-label="Ajouter une dépense ou une rentrée d'argent">+</button>
<nav class="bottom" id="tabs"></nav>
<div id="modal-root"></div>

<script>
"use strict";
/* ============================================================
   Données : enregistrées UNIQUEMENT sur cet appareil (téléphone / navigateur).
   Synchronisation : par fichier échangé entre les appareils, fusionné sans doublon.
   ============================================================ */
let D = null;
const CLE = "cdf_donnees";
const COLL = ["categories","comptes","reserves","recurrentes","operations"];
const TABS = [["accueil","🏠","Accueil"],["ops","🧾","Historique"],["monbudget","📋","Mon budget"],["plus","☰","Plus"]];
const SOUS_PLUS = {convert:"Convertisseur", bord:"Analyse détaillée", budget:"Budget par catégorie", comptes:"Comptes & épargne", reglages:"Réglages"};
let tab = "accueil";
let mois = moisCourant();
let filtres = {mois: moisCourant(), type:"", cat:"", pers:"", compte:"", q:""};

function lsGet(k){ try{ return localStorage.getItem("cdf_"+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem("cdf_"+k,v); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function moisCourant(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function aujourdhui(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function decaleMois(m,n){ let [y,mo]=m.split("-").map(Number); mo+=n; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return y+"-"+String(mo).padStart(2,"0"); }
function nomMois(m){ const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); }
function nomMoisCourt(m){ const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("fr-FR",{month:"short"}).replace(".",""); }
function joursDansMois(m){ const [y,mo]=m.split("-").map(Number); return new Date(y,mo,0).getDate(); }
const fmtE = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const fmtC = new Intl.NumberFormat("fr-CH",{style:"currency",currency:"CHF"});
function eur(v){ return fmtE.format(Math.round((v||0)*100)/100); }
function chf(v){ return fmtC.format(Math.round((v||0)*100)/100); }
function r2(v){ return Math.round((+v||0)*100)/100; }
function h(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(s){ if(typeof s==="number") return s; s=String(s||"").replace(/\s/g,"").replace(",","."); const v=parseFloat(s); return isNaN(v)?0:v; }

// Les deux personnes du foyer, fixées une fois pour toutes.
const PRENOMS=["Mathias","Melina"];
// Si les données portent d'autres prénoms (ex. « Jacob » du fichier de départ, ou « Personne 1 »),
// on les remplace partout : opérations, Mon budget, comptes, libellés (« Téléphone Jacob » → « Téléphone Mathias »).
const ANCIENS_NOMS={"Jacob":PRENOMS[0],"Personne 1":PRENOMS[0],"Personne 2":PRENOMS[1]};
function fixerPrenoms(){
  const corr={...ANCIENS_NOMS};
  PRENOMS.forEach((p,i)=>{ const a=D.reglages.personnes[i]; if(a&&a!==p&&a!==PERS_COMMUN) corr[a]=p; });
  const res=Object.keys(corr).map(a=>[new RegExp("(^|[^\\p{L}])"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\p{L}\\d])","gu"),corr[a]]);
  const tx=s=>{ let v=s; for(const [re,nv] of res) v=v.replace(re,"$1"+nv); return v; };
  const besoin = PRENOMS.some((p,i)=>D.reglages.personnes[i]!==p)
    || [...D.operations,...D.recurrentes].some(o=>corr[o.personne]||(o.libelle&&tx(o.libelle)!==o.libelle))
    || D.comptes.some(c=>corr[c.proprietaire]||tx(c.nom)!==c.nom);
  if(!besoin) return;
  modifier(d=>{
    d.reglages.personnes=[...PRENOMS];
    for(const o of [...d.operations,...d.recurrentes]){ if(corr[o.personne]) o.personne=corr[o.personne]; if(o.libelle) o.libelle=tx(o.libelle); }
    for(const c of d.comptes){ if(corr[c.proprietaire]) c.proprietaire=corr[c.proprietaire]; c.nom=tx(c.nom); }
  });
  if(corr[lsGet("moi")]) lsSet("moi",corr[lsGet("moi")]);
}
// Catégories par défaut, dans l'ordre d'affichage. Ajouter ici = ajouté aussi sur les téléphones déjà installés.
const CATS_DEFAUT=[
  // Charges fixes
  ["logement","Logement","fixe","🏠"], ["electricite","Électricité","fixe","⚡"], ["eau","Eau","fixe","💧"],
  ["chauffage","Gaz & chauffage","fixe","🔥"], ["internet","Internet & téléphone","fixe","🌐"], ["audiovisuel","Audiovisuel & streaming","fixe","📺"],
  ["assurances","Assurances","fixe","🛡️"], ["abonnements","Autres abonnements","fixe","📱"], ["credit","Crédit","fixe","🏦"],
  ["impots","Impôts & taxes","fixe","🧾"],
  // Dépenses du quotidien
  ["alimentation","Courses","variable","🛒"], ["restaurants","Restaurants","variable","🍽️"], ["carburant","Carburant","variable","⛽"],
  ["transport","Transport & voiture","variable","🚗"], ["sante","Santé","variable","💊"], ["enfants","Enfants","variable","🧸"],
  ["vetements","Vêtements","variable","👕"], ["maison","Maison & bricolage","variable","🛠️"], ["loisirs","Loisirs","variable","🎉"],
  ["sport","Sport","variable","🏋️"], ["voyages","Voyages & vacances","variable","✈️"], ["cadeaux","Cadeaux","variable","🎁"],
  ["beaute","Beauté & coiffure","variable","💇"], ["animaux","Animaux","variable","🐾"], ["autres","Autres","variable","📦"],
  // Revenus
  ["salaire","Salaire","revenu","💼"], ["pension","Pension","revenu","🎖️"], ["prestations","Prestations familiales","revenu","👪"],
  ["chomage","Chômage","revenu","📄"], ["remboursements","Remboursements","revenu","↩️"], ["autres_rev","Autres revenus","revenu","💶"]
];
function catDefaut([id,nom,type,icone]){ return {id,nom,type,icone,maj:1}; }
// Ajoute les catégories par défaut manquantes (sauf si supprimées exprès) et range tout dans l'ordre ci-dessus.
// Pas de date de modification : c'est identique sur les deux téléphones, donc pas de conflit.
function completerCategories(){
  const parId=new Map(D.categories.map(c=>[c.id,c])), rang=new Map(CATS_DEFAUT.map((c,i)=>[c[0],i]));
  for(const c of CATS_DEFAUT){
    const x=parId.get(c[0]);
    if(!x){ if(!D.supprimes[c[0]]) D.categories.push(catDefaut(c)); }
    else if(x.maj===1 && (x.nom!==c[1]||x.icone!==c[3])){ x.nom=c[1]; x.icone=c[3]; } // jamais modifiée à la main : prend le nouveau nom
  }
  D.categories.sort((a,b)=>(rang.get(a.id)??999)-(rang.get(b.id)??999));
}
// Une seule fois par téléphone : range dans les nouvelles catégories ce qui était dans Logement / Abonnements.
function reclasserAnciennesCategories(){
  if(D.local.reclasse1 || !D.recurrentes.length) return;
  const regles=[[/eau/i,"logement","eau"],[/spotify|netflix|disney|canal|deezer|prime video/i,"abonnements","audiovisuel"],
                [/box internet|internet|t[ée]l[ée]phone|mobile|forfait/i,"abonnements","internet"],
                [/[ée]lectricit|edf|engie/i,"logement","electricite"]];
  const a_changer=D.recurrentes.filter(r=>regles.some(([re,de])=>r.categorieId===de&&re.test(r.libelle)));
  D.local.reclasse1=true;
  if(!a_changer.length){ enregistrer(); return; }
  modifier(d=>{
    for(const r of d.recurrentes){ const g=regles.find(([re,de])=>r.categorieId===de&&re.test(r.libelle)); if(g) r.categorieId=g[2]; }
    // Budget de départ repris de l'Excel : on répartit aussi les montants prévus, s'ils n'ont pas été modifiés.
    const b=d.budgets["2026-11"];
    if(b && b.logement===1650 && b.abonnements===116.1 && b.eau==null && b.internet==null){
      Object.assign(b,{logement:1590,eau:60,abonnements:23,internet:71.97,audiovisuel:21.13});
    }
  });
}
function donneesInitiales(){
  const categories=CATS_DEFAUT.map(catDefaut);
  const comptes=[
    {id:"commun",nom:"Compte commun",proprietaire:"Commun",soldeInitial:0},
    {id:"perso1",nom:"Compte de "+PRENOMS[0],proprietaire:PRENOMS[0],soldeInitial:0},
    {id:"perso2",nom:"Compte de "+PRENOMS[1],proprietaire:PRENOMS[1],soldeInitial:0}
  ];
  const reserves=[
    {id:"urgence",nom:"Fonds d'urgence",objectif:0,soldeInitial:0},
    {id:"vacances",nom:"Vacances",objectif:0,soldeInitial:0},
    {id:"gros",nom:"Gros achats",objectif:0,soldeInitial:0},
    {id:"autres_res",nom:"Autres réserves",objectif:0,soldeInitial:0}
  ];
  // Données par défaut, identiques sur tous les appareils (maj:1 = "plus ancien que tout").
  for(const arr of [comptes,reserves]) arr.forEach(r=>r.maj=1);
  return {

    local:{accueil:true, dernierEnvoi:0, modifs:0}
  };
}

function normaliser(x){
  x.reglages ||= {personnes:[...PRENOMS],tauxCHF:1};
  for(const k of COLL) x[k] ||= [];
  x.budgets ||= {}; x.budgetsMaj ||= {}; x.supprimes ||= {}; x.reglagesMaj ||= 0;
  return x;
}
function charger(){
  let s=null; try{ s=localStorage.getItem(CLE); }catch(e){}
  D = s ? JSON.parse(s) : donneesInitiales();

  completerCategories();
  enregistrer();
}
function enregistrer(){
  try{ localStorage.setItem(CLE, JSON.stringify(D)); }
  catch(e){ alert("Impossible d'enregistrer sur cet appareil (mémoire pleine ou navigation privée)."); }

}
function majBadge(){ const b=document.getElementById("badge"); if(!b||!D) return; const n=D.local.modifs||0; b.hidden=!n; b.textContent=n; b.title=n+" modification(s) pas encore envoyée(s)"; }

/* Toute modification passe par modifier(fn). On compare avant/après pour dater
   précisément ce qui a changé (nécessaire pour fusionner deux appareils). */
function sansMaj(r){ const {maj,...x}=r; return JSON.stringify(x); }
function empreinte(){
  const e={budgets:new Map(), reglages:JSON.stringify(D.reglages)};
  for(const k of COLL) e[k]=new Map(D[k].map(r=>[r.id,sansMaj(r)]));
  for(const m in D.budgets) for(const k in D.budgets[m]) e.budgets.set(m+"|"+k, JSON.stringify(D.budgets[m][k]));
  return e;
}
function horodater(av){
  const t=Date.now(); let n=0;
  for(const k of COLL){
    const vus=new Set();
    for(const r of D[k]){ vus.add(r.id); if(av[k].get(r.id)!==sansMaj(r)){ r.maj=t; n++; } }
    av[k].forEach((_,id)=>{ if(!vus.has(id)){ D.supprimes[id]=t; n++; } });
  }
  for(const m in D.budgets) for(const k in D.budgets[m]){ const c=m+"|"+k; if(av.budgets.get(c)!==JSON.stringify(D.budgets[m][k])){ D.budgetsMaj[c]=t; n++; } }
  if(av.reglages!==JSON.stringify(D.reglages)){ D.reglagesMaj=t; n++; }
  return n;
}
function modifier(fn, msg){
  const avant=new Set(D.comptes.filter(c=>etatDecouvert(c)?.niv==="bad").map(c=>c.id));
  const av=empreinte(); fn(D);
  D.local.modifs=(D.local.modifs||0)+horodater(av);
  enregistrer(); rendu(); if(msg) toast(msg);
  const dep=D.comptes.filter(c=>!avant.has(c.id)&&etatDecouvert(c)?.niv==="bad");
  if(dep.length) setTimeout(()=>toast("🚨 "+dep.map(c=>c.nom).join(", ")+" : découvert autorisé dépassé"),msg?2300:0);
}

/* Fusion d'un fichier reçu : pour chaque élément, la version la plus récente gagne.
   Une suppression faite sur un appareil s'applique partout. */
function fusionner(x){
  normaliser(x); let n=0;
  for(const id in x.supprimes) if(!(D.supprimes[id]>=x.supprimes[id])){ if(!D.supprimes[id]) n++; D.supprimes[id]=x.supprimes[id]; }
  for(const k of COLL){
    const m=new Map(D[k].map(r=>[r.id,r]));
    for(const r of x[k]){ const a=m.get(r.id); if(!a || (r.maj||0)>(a.maj||0)){ if(!a||sansMaj(a)!==sansMaj(r)) n++; m.set(r.id,r); } }
    D[k]=[...m.values()].filter(r=>!D.supprimes[r.id]);
  }
  for(const c in x.budgetsMaj){
    if((x.budgetsMaj[c]||0)>(D.budgetsMaj[c]||0)){
      const i=c.indexOf("|"), m=c.slice(0,i), k=c.slice(i+1);
      (D.budgets[m] ||= {})[k]=x.budgets?.[m]?.[k] ?? ""; D.budgetsMaj[c]=x.budgetsMaj[c]; n++;
    }
  }
  if((x.reglagesMaj||0)>(D.reglagesMaj||0)){ D.reglages=x.reglages; D.reglagesMaj=x.reglagesMaj; n++; }
  D.local.accueil=false;
  completerCategories();
  enregistrer(); return n;
}
// Le fichier est préparé dès l'ouverture de la fenêtre « Synchroniser » : sur iPhone, le partage
// doit démarrer immédiatement au toucher du bouton, sans attente.
// Photos jointes : celles prises sur ce téléphone depuis le dernier envoi (ou toutes, si demandé).
let PREP=null;
async function preparerEnvoi(toutesLesPhotos){
  PREP=null;
  const photos=(await photoToutes().catch(()=>[])).filter(p=>toutesLesPhotos||(p.local&&p.cree>(D.local.dernierEnvoi||0))).map(({id,data,cree})=>({id,data,cree}));
  const {local,...donnees}=D;
  const contenu=JSON.stringify({app:"comptes-du-foyer",format:2,de:moi(),le:new Date().toISOString(),donnees,photos});
  const nom=`comptes_${aujourdhui()}_${moi().replace(/[^\w-]/g,"")}.txt`; // .txt : accepté partout (WhatsApp, SMS, mail…)
  PREP={f:new File([contenu],nom,{type:"text/plain"}),contenu,nom,nbPhotos:photos.length,taille:contenu.length};
  return PREP;
}
async function envoyer(){
  if(!PREP) return;
  const {f,contenu,nom}=PREP;
  let ok=false;
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:"Comptes du foyer"}); ok=true; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  if(!ok){ telecharger(nom,contenu,"text/plain"); ok=true; }
  D.local.dernierEnvoi=Date.now(); D.local.modifs=0; enregistrer(); fermerModal(); toast("Fichier prêt à être reçu par l'autre téléphone");
}
function recevoirFichier(fichier){
  const fr=new FileReader();
  fr.onload=async()=>{
    let x; try{ x=JSON.parse(fr.result); }catch(e){ alert("Ce fichier n'est pas un fichier « Comptes du foyer »."); return; }
    const donnees = x.app==="comptes-du-foyer" ? x.donnees : (x.operations&&x.categories ? x : null);
    if(!donnees){ alert("Ce fichier n'est pas un fichier « Comptes du foyer »."); return; }
    const n=fusionner(donnees); fermerModal(); fixerPrenoms(); rendu(); reclasserAnciennesCategories();
    let np=0;
    for(const p of (Array.isArray(x.photos)?x.photos:[])){
      try{ if(p?.id && typeof p.data==="string" && p.data.startsWith("data:image/") && !(await photoGet(p.id))){ await photoPut({id:p.id,data:p.data,cree:p.cree||Date.now(),local:false}); np++; } }catch(e){}
    }
    const txt=[n?`${n} nouveauté(s)`:"", np?`${np} photo(s) de ticket`:""].filter(Boolean).join(" et ");
    toast(txt ? `Synchronisé : ${txt} reçue(s)${x.de?" de "+x.de:""}` : "Déjà à jour, rien de nouveau");
  };
  fr.readAsText(fichier);
}
function renommerPersonne(d,i,nv){
  const ancien=d.reglages.personnes[i]; d.reglages.personnes[i]=nv;
  for(const arr of [d.operations,d.recurrentes]) arr.forEach(o=>{ if(o.personne===ancien) o.personne=nv; });
  d.comptes.forEach(c=>{ if(c.proprietaire===ancien) c.proprietaire=nv; if(c.nom==="Compte de "+ancien) c.nom="Compte de "+nv; });
  if(lsGet("moi")===ancien) lsSet("moi",nv);
}

/* ============================================================
   Calculs
   ============================================================ */
const PERS_COMMUN="Commun";
function personnes(){ return D.reglages.personnes; }
function persOptions(){ return [...personnes(), PERS_COMMUN]; }
function moi(){ const m=lsGet("moi"); return persOptions().includes(m)?m:personnes()[0]; }
function cat(id){ return D.categories.find(c=>c.id===id); }
function compte(id){ return D.comptes.find(c=>c.id===id); }
function reserve(id){ return D.reserves.find(c=>c.id===id); }
function catsDe(type){ return D.categories.filter(c=>type==="depense"?(c.type==="fixe"||c.type==="variable"):c.type===type); }
function versEur(montant,devise){ return devise==="CHF" ? r2(montant*(D.reglages.tauxCHF||1)) : r2(montant); }
function opsDuMois(m){ return D.operations.filter(o=>o.date.slice(0,7)===m); }
function persClasse(p){ const i=personnes().indexOf(p); return i===0?"p0":i===1?"p1":""; }

function budgetDu(m){
  if(D.budgets[m]) return {b:D.budgets[m], herite:null};
  const anterieurs=Object.keys(D.budgets).filter(k=>k<m).sort();
  if(anterieurs.length){ const k=anterieurs[anterieurs.length-1]; return {b:D.budgets[k], herite:k}; }
  const posterieurs=Object.keys(D.budgets).sort();
  if(posterieurs.length) return {b:D.budgets[posterieurs[0]], herite:posterieurs[0]};
  return {b:{}, herite:null};
}
function impactNet(o){ // effet sur le "reste à vivre"
  if(o.type==="revenu") return o.montant;
  if(o.type==="depense") return -o.montant;
  if(o.type==="epargne") return -o.montant;
  if(o.type==="retrait") return o.montant;
  return 0;
}
function report(m){ let s=0; for(const o of D.operations) if(o.date.slice(0,7)<m) s+=impactNet(o); return r2(s); }
function statsMois(m){
  const ops=opsDuMois(m), parCat={}, parRes={}, parPers={};
  let rev=0, dep=0, epa=0;
  for(const o of ops){
    if(o.type==="revenu"){ rev+=o.montant; parCat[o.categorieId]=(parCat[o.categorieId]||0)+o.montant; }
    else if(o.type==="depense"){ dep+=o.montant; parCat[o.categorieId]=(parCat[o.categorieId]||0)+o.montant; parPers[o.personne||PERS_COMMUN]=(parPers[o.personne||PERS_COMMUN]||0)+o.montant; }
    else if(o.type==="epargne"){ epa+=o.montant; parRes[o.reserveId]=(parRes[o.reserveId]||0)+o.montant; }
    else if(o.type==="retrait"){ epa-=o.montant; parRes[o.reserveId]=(parRes[o.reserveId]||0)-o.montant; }
  }
  return {rev:r2(rev),dep:r2(dep),epa:r2(epa),parCat,parRes,parPers,nb:ops.length};
}
function soldeCompte(id){
  const c=compte(id); let s=num(c?.soldeInitial);
  for(const o of D.operations){
    if(o.compteId===id){ if(o.type==="revenu"||o.type==="retrait") s+=o.montant; else s-=o.montant; }
    if(o.type==="virement" && o.compteDestId===id) s+=o.montant;
  }
  return r2(s);
}
function soldeReserve(id){
  const r=reserve(id); let s=num(r?.soldeInitial);
  for(const o of D.operations){ if(o.reserveId===id){ if(o.type==="epargne") s+=o.montant; if(o.type==="retrait") s-=o.montant; } }
  return r2(s);
}

function vueBord(){

  const revP=prevu("revenu"), depP=prevu("fixe")+prevu("variable"), resP=D.reserves.reduce((a,r)=>a+num(b["res:"+r.id]),0);
  const rvP=r2(rep+revP-depP-resP), rvR=r2(rep+s.rev-s.dep-s.epa);

  const tableDep=(titre,t)=>{

function iconeOp(o){

}
function libelleOp(o){
  if(o.libelle) return o.libelle;

}
function detailOp(o){
  const parts=[];
  if(o.type==="virement") parts.push((compte(o.compteId)?.nom||"?")+" → "+(compte(o.compteDestId)?.nom||"?"));
  else { if(cat(o.categorieId)&&o.libelle) parts.push(cat(o.categorieId).nom); if(o.type==="epargne"&&o.libelle) parts.push(reserve(o.reserveId)?.nom||""); parts.push(compte(o.compteId)?.nom||""); }

/* ---------- Revenus et charges fixes : comptés automatiquement chaque mois ---------- */
function opDeRec(r,m,id){
  const jour=String(Math.min(r.jour||1,joursDansMois(m))).padStart(2,"0");
  return {id,cree:m+"-01",recId:r.id,type:r.type,date:m+"-"+jour,libelle:r.libelle,devise:r.devise,
    montant:versEur(r.montant,r.devise),montantOrigine:r.devise==="CHF"?r.montant:null,
    categorieId:r.type==="epargne"?"":r.categorieId,compteId:r.compteId,compteDestId:"",
    reserveId:r.type==="epargne"?r.reserveId:"",personne:r.personne,note:"",pointe:false,maj:1};
}
// Crée (ou met à jour) les opérations du mois en cours à partir de « Mon budget ».
// Identifiant fixe => les deux téléphones créent la même opération, jamais de doublon.
// maj:1 => une modification faite à la main gagne toujours.
function autoRecurrentes(){
  const m=moisCourant(), recs=new Map(D.recurrentes.map(r=>[r.id,r])); let ch=false;
  D.operations=D.operations.filter(o=>{
    if(!String(o.id).startsWith("auto_")||o.maj!==1||o.date.slice(0,7)!==m) return true;
    const r=recs.get(o.recId); if(!r||!r.actif){ ch=true; return false; }
    const x=opDeRec(r,m,o.id); if(sansMaj(x)!==sansMaj(o)){ Object.keys(o).forEach(k=>delete o[k]); Object.assign(o,x); ch=true; }
    return true;
  });
  const presents=new Set(D.operations.filter(o=>o.recId&&o.date.slice(0,7)===m).map(o=>o.recId));
  for(const r of D.recurrentes){
    const id=`auto_${r.id}_${m}`;
    if(!r.actif||presents.has(r.id)||D.supprimes[id]) continue;
    D.operations.push(opDeRec(r,m,id)); ch=true;
  }
  if(ch) enregistrer();
}
// Le calcul « façon Pilote » : revenus − charges fixes − épargne = pour vivre ; moins les dépenses du quotidien = reste.
function planMois(m){
  const ops=opsDuMois(m), aRec=ops.some(o=>o.recId);
  let rev=0, fixes=0, epa=0, quot=0; const parCat={}, parPers={}, quotOps=[];
  for(const o of ops){
    if(o.type==="revenu") rev+=o.montant;
    else if(o.type==="depense"){
      if(o.recId) fixes+=o.montant;
      else { quot+=o.montant; parCat[o.categorieId]=(parCat[o.categorieId]||0)+o.montant; const p=o.personne||PERS_COMMUN; parPers[p]=(parPers[p]||0)+o.montant; quotOps.push(o); }
    }
    else if(o.type==="epargne") epa+=o.montant;
    else if(o.type==="retrait") epa-=o.montant;
  }
  if(!aRec) for(const r of D.recurrentes.filter(r=>r.actif)){ const e=versEur(r.montant,r.devise); if(r.type==="revenu") rev+=e; else if(r.type==="depense") fixes+=e; else if(r.type==="epargne") epa+=e; }
  const dispo=r2(rev-fixes-epa);
  return {rev:r2(rev),fixes:r2(fixes),epa:r2(epa),quot:r2(quot),dispo,reste:r2(dispo-quot),parCat,parPers,quotOps};
}
function etat(depense,budget){ if(budget<=0) return depense>0?"bad":""; const p=depense/budget; return p>=1?"bad":p>=.8?"warn":""; }

function vueReste(){
  const p=planMois(mois), courant=mois===moisCourant(), nj=joursDansMois(mois);
  const pct=p.dispo>0?Math.min(100,p.quot/p.dispo*100):(p.quot?100:0), st=etat(p.quot,p.dispo);
  let sous="", semaine="";
  if(courant){
    const auj=new Date(), j=auj.getDate(), restants=nj-j+1;
    sous = p.reste>0 ? `jusqu'au ${nj} ${h(nomMois(mois).split(" ")[0])} · soit environ <b>${eur(p.reste/restants)}</b> par jour` : `Le budget du mois est dépassé`;
    // semaine du lundi au dimanche (limitée au mois)
    const lun=new Date(auj); lun.setDate(j-((auj.getDay()+6)%7)); const dim=new Date(lun); dim.setDate(lun.getDate()+6);
    const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const deb=iso(lun)<mois+"-01"?mois+"-01":iso(lun), fin=iso(dim)>mois+"-"+nj?mois+"-"+nj:iso(dim);
    const joursSem=(new Date(fin+"T12:00")-new Date(deb+"T12:00"))/864e5+1;
    const budSem=r2(p.dispo*joursSem/nj), depSem=r2(p.quotOps.filter(o=>o.date>=deb&&o.date<=fin).reduce((a,o)=>a+o.montant,0));
    const s2=etat(depSem,budSem), resteSem=r2(budSem-depSem);
    semaine=`<div class="card"><h3>📅 Cette semaine</h3>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="num ${resteSem<0?"neg":""}" style="font-size:24px;font-weight:800">${eur(resteSem)}</span><span class="note">restants sur ${eur(budSem)}</span></div>

/* ---------- Convertisseur € / CHF au taux du jour ----------
   Taux officiel de la Banque centrale européenne via api.frankfurter.dev (gratuit, sans compte).
   Seul le taux est demandé : aucune donnée personnelle n'est envoyée. Hors ligne : dernier taux connu. */
let TAUX = (()=>{ try{ return JSON.parse(lsGet("taux")||"null"); }catch(e){ return null; } })(); // {eurchf, date, le}
let CONV = {eur:"100", chf:"", dernier:"eur"}, majTauxEnCours=false, derniereTentative=0;
function tauxEurChf(){ return TAUX?.eurchf || r4(1/(D.reglages.tauxCHF||1)); }
function r4(v){ return Math.round(v*10000)/10000; }
function fr(v,d=2){ return Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
async function majTaux(force){
  if(majTauxEnCours) return;
  if(!force && TAUX && Date.now()-TAUX.le < 3*3600e3) return;
  if(!force && Date.now()-derniereTentative < 60e3) return; // hors ligne : on ne réessaie pas en boucle
  majTauxEnCours=true; derniereTentative=Date.now(); let ok=false;
  try{
    const r=await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CHF",{cache:"no-store"});
    const j=await r.json(), v=j?.rates?.CHF;
    if(!(v>0)) throw new Error("taux absent");
    TAUX={eurchf:v,date:j.date,le:Date.now()}; lsSet("taux",JSON.stringify(TAUX));
    ok=true; if(force) toast("Taux mis à jour : 1 € = "+fr(v,4)+" CHF");
  }catch(e){ if(force) toast("Pas de connexion : on garde le dernier taux connu"); }
  finally{ majTauxEnCours=false; if(ok && (tab==="convert"||tab==="plus") && !document.activeElement?.dataset?.conv) rendu(); }
}
function vueConvert(){
  setTimeout(()=>majTaux(false),0);
  const t=tauxEurChf();
  { const k=CONV.dernier, autre=k==="eur"?"chf":"eur", v=num(CONV[k]); CONV[autre]= String(CONV[k]).trim()==="" ? "" : fr(k==="eur"?v*t:v/t); }
  const source = TAUX ? `Taux officiel BCE du ${new Date(TAUX.date+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}${Date.now()-TAUX.le>36e5*24?" (pas de réseau depuis, dernier taux connu)":""}`
                       : "Pas encore de taux en ligne : taux de vos réglages en attendant";
  return `<div class="stack">
    <div class="card hero-big"><div class="lbl">Taux du jour</div><div class="val num" style="font-size:34px">1 € = ${fr(t,4)} CHF</div><div class="sub">1 CHF = ${fr(1/t,4)} €</div></div>
    <div class="card">
      <div class="fld"><label>Euros (€)</label><input class="field-simple num" style="font-size:24px;font-weight:700" inputmode="decimal" data-conv="eur" value="${h(CONV.eur)}" placeholder="0,00"></div>
      <div style="text-align:center;font-size:22px;color:var(--muted);margin:-4px 0 6px">⇅</div>
      <div class="fld"><label>Francs suisses (CHF)</label><input class="field-simple num" style="font-size:24px;font-weight:700" inputmode="decimal" data-conv="chf" value="${h(CONV.chf)}" placeholder="0,00"></div>
      <p class="note" style="margin:4px 0 0">Tapez dans l'une ou l'autre case, la conversion se fait toute seule.</p>
    </div>
    <div class="card"><p class="note" style="margin-top:0">${h(source)}. Les banques et bureaux de change prennent souvent 1 à 2 % de plus.</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" data-act="taux-maj">🔄 Actualiser le taux</button>
      </div>
      <p class="hint" style="margin:8px 0 0">À titre indicatif uniquement : ce convertisseur ne modifie rien dans vos comptes.</p>
    </div></div>`;
}
document.addEventListener("input",e=>{

  CONV[k]=e.target.value; CONV.dernier=k; CONV[autre]= e.target.value.trim()==="" ? "" : fr(k==="eur"?v*t:v/t);

/* ---------- Photos des tickets ----------
   Rangées dans IndexedDB (stockage du téléphone, bien plus grand que celui des comptes). */
let _db=null;
function idb(){ return _db ||= new Promise((ok,ko)=>{ const r=indexedDB.open("cdf_photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"}); r.onsuccess=()=>ok(r.result); r.onerror=()=>{ _db=null; ko(r.error); }; }); }
async function idbReq(mode,fn){ const db=await idb(); return new Promise((ok,ko)=>{ const tx=db.transaction("photos",mode); const r=fn(tx.objectStore("photos")); tx.oncomplete=()=>ok(r?.result); tx.onerror=()=>ko(tx.error); }); }
const photoPut=p=>idbReq("readwrite",s=>s.put(p));
const photoGet=id=>idbReq("readonly",s=>s.get(id));
const photoDel=id=>id?idbReq("readwrite",s=>s.delete(id)).catch(()=>{}):Promise.resolve();
const photoToutes=()=>idbReq("readonly",s=>s.getAll());

// Prépare la photo : une version nette pour la lecture, une version légère (~150 Ko) à garder.
function preparerPhoto(file){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const dessiner=max=>{ const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; };
      const lecture=dessiner(2000), garde=dessiner(1200).toDataURL("image/jpeg",0.6);
      URL.revokeObjectURL(url); ok({lecture,data:garde});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error("image illisible")); };
    img.src=url;
  });
}
function voirPhoto(data){

}

/* ---------- Lecture du ticket (dans le téléphone, rien n'est envoyé) ----------
   Tesseract.js (logiciel libre de reconnaissance de texte) est téléchargé la première fois,
   puis gardé dans le téléphone pour marcher sans réseau. */
let _tess=null, _worker=null;
function chargerTesseract(){
  return _tess ||= new Promise((ok,ko)=>{
    if(window.Tesseract) return ok(window.Tesseract);
    const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=()=>ok(window.Tesseract); s.onerror=()=>{ _tess=null; s.remove(); ko(new Error("hors ligne")); };
    document.head.appendChild(s);
  });
}
async function lireTicket(canvas){
  const T=await chargerTesseract();
  try{ _worker ||= T.createWorker("fra"); const w=await _worker; const {data}=await w.recognize(canvas); return analyserTicket(data.text||""); }
  catch(e){ _worker=null; throw e; }
}
// Trouve le montant à payer dans le texte du ticket.
function analyserTicket(txt){
  const lignes=txt.split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const montants=l=>[...l.matchAll(/(\d{1,5})\s?[.,]\s?(\d{2})(?!\d)/g)].map(m=>+(m[1]+"."+m[2])).filter(v=>v>0&&v<10000);
  const exclu=/sous[- ]?total|t\.?v\.?a|\bh\.?t\b|rendu|monnaie|remise|[ée]conomi|points?\b|fid[ée]lit|cagnotte|avantage/i;
  const motsCles=[/net\s*[àa]\s*payer/i,/total\s*t\.?t\.?c/i,/[àa]\s*payer/i,/montant\s*(d[ûu]|total|ttc|cb|carte|r[ée]gl)/i,/\btota[l1]\b/i,/\b(cb|carte|visa|master ?card|esp[èe]ces|twint|maestro|paiement)\b/i];
  let montant=null;
  for(const re of motsCles){
    const trouves=[];
    lignes.forEach((l,i)=>{ if(re.test(l)&&!exclu.test(l)){ let v=montants(l); if(!v.length&&lignes[i+1]) v=montants(lignes[i+1]); trouves.push(...v); } });
    if(trouves.length){ montant=Math.max(...trouves); break; }
  }
  if(montant==null){ const tous=lignes.filter(l=>!exclu.test(l)).flatMap(montants); if(tous.length) montant=Math.max(...tous); }
  const devise=/\bCHF\b|\bS?Fr\.|\bFRS?\b/i.test(txt)?"CHF":/€|\bEUR\b/i.test(txt)?"EUR":null;
  let date=null; const dm=txt.match(/\b(\d{2})[\/.-](\d{2})[\/.-](\d{2}|\d{4})\b/);
  if(dm){ const y=dm[3].length===2?"20"+dm[3]:dm[3], d=`${y}-${dm[2]}-${dm[1]}`, t=new Date(d+"T12:00"); if(!isNaN(t) && t<=new Date() && (Date.now()-t)/864e5<62) date=d; }
  const magasin=(lignes.slice(0,4).find(l=>/^[A-Za-zÀ-ÿ'&.\- ]{3,28}$/.test(l)&&/[A-Za-zÀ-ÿ]{3}/.test(l))||"").trim();
  return {montant,devise,date,magasin:magasin?magasin.charAt(0).toUpperCase()+magasin.slice(1).toLowerCase():""};
}
// Bloc « 📷 Ticket » réutilisé dans les deux formulaires.
function blocPhoto(conteneur,{photoId,onLu}){
  const etat={photoId:photoId||"", nouvelle:null, retiree:false};
  const afficher=async()=>{
    let img="", info="";
    if(etat.nouvelle) img=etat.nouvelle;
    else if(etat.photoId && !etat.retiree){ const p=await photoGet(etat.photoId).catch(()=>null); if(p) img=p.data; else info=`<span class="hint">📷 Photo prise sur l'autre téléphone (pas encore reçue ici)</span>`; }
    conteneur.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${img?`<img src="${img}" alt="Ticket" data-voir style="width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in">`:""}
      <label class="btn sm">📷 ${img?"Reprendre":"Photo du ticket"}<input type="file" accept="image/*" capture="environment" hidden></label>
      ${img?`<button type="button" class="btn sm ghost" data-retirer>✕ Retirer</button>`:""}${info}
      <span class="hint" data-statut style="flex-basis:100%"></span></div>`;
    const st=conteneur.querySelector("[data-statut]");
    conteneur.querySelector("[data-voir]")?.addEventListener("click",()=>voirPhoto(img));
    conteneur.querySelector("[data-retirer]")?.addEventListener("click",()=>{ etat.nouvelle=null; etat.retiree=true; afficher(); });
    conteneur.querySelector("input[type=file]").onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      st.textContent="Préparation de la photo…";
      try{
        const p=await preparerPhoto(f); etat.nouvelle=p.data; etat.retiree=false; await afficher();
        const st2=conteneur.querySelector("[data-statut]"); st2.textContent="🔎 Lecture du ticket… (la 1re fois, quelques secondes de plus)";
        try{ const r=await lireTicket(p.lecture); onLu&&onLu(r);
          st2.innerHTML = r.montant ? `✓ Montant lu sur le ticket : <b>${fr(r.montant)} ${r.devise==="CHF"?"CHF":"€"}</b>, vérifiez-le` : "Montant non trouvé sur le ticket : tapez-le";
        }catch(err){ st2.textContent = "Lecture impossible (pas de réseau la 1re fois ?) : la photo est gardée, tapez le montant."; }
      }catch(err){ st.textContent="Impossible d'utiliser cette photo."; }
    };
  };
  afficher();
  // À appeler à l'enregistrement : range la photo et renvoie l'identifiant à mettre sur l'opération.
  etat.finaliser=async()=>{
    if(etat.nouvelle){ const id=uid(); await photoPut({id,data:etat.nouvelle,cree:Date.now(),local:true}); if(etat.photoId) photoDel(etat.photoId); return id; }
    if(etat.retiree){ photoDel(etat.photoId); return ""; }
    return etat.photoId;
  };
  return etat;
}

/* Ajout rapide : montant + une touche sur la catégorie = enregistré. */
function formRapide(typeInitial){
  let type = typeInitial==="revenu" ? "revenu" : "depense";
  let devise="EUR";
  const catsPour=t=> t==="revenu" ? D.categories.filter(c=>c.type==="revenu") : [...D.categories.filter(c=>c.type==="variable"), ...D.categories.filter(c=>c.type==="fixe")];
  const libsPour=t=>[...new Set(D.operations.filter(o=>o.type===t&&!o.recId).map(x=>x.libelle).filter(Boolean))].slice(-100).map(l=>`<option value="${h(l)}">`).join("");
  ouvrirModal(`<div class="seg" id="q-type"><button type="button" data-v="depense">➖ Dépense</button><button type="button" data-v="revenu">➕ Rentrée d'argent</button></div>
    <div class="quick-amt"><input id="q-m" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Montant"><button type="button" id="q-dev" aria-label="Devise">€</button></div>
    <div class="hint" id="q-conv" style="text-align:center;min-height:16px"></div>
    <input id="q-lib" class="field-simple" autocomplete="off" list="libs-r">
    <div id="q-photo" style="margin-top:10px"></div>
    <datalist id="libs-r"></datalist>
    <div class="hint" style="margin-top:12px">Touchez la catégorie pour enregistrer :</div>
    <div class="cats" id="q-cats"></div>
    <div class="actions"><button type="button" class="btn ghost sm left" id="q-plus">Date, compte, virement… ›</button><button type="button" class="btn" id="q-cancel">Annuler</button></div>`, m=>{
      const inp=m.querySelector("#q-m"), conv=m.querySelector("#q-conv"), dev=m.querySelector("#q-dev");
      let datePhoto=null;
      // Photo du ticket : le montant lu remplit la case (à vérifier), ainsi que la devise, le magasin et la date si trouvés.
      const ph=blocPhoto(m.querySelector("#q-photo"),{onLu:r=>{
        if(r.montant) inp.value=fr(r.montant);
        if(r.devise && r.devise!==devise){ devise=r.devise; dev.textContent=devise==="EUR"?"€":"CHF"; }
        majConv();
        const lib=m.querySelector("#q-lib"); if(!lib.value && r.magasin) lib.value=r.magasin;
        datePhoto = r.date && r.date!==aujourdhui() ? r.date : null;
        if(datePhoto) conv.textContent=(conv.textContent?conv.textContent+" · ":"")+"ticket du "+new Date(datePhoto+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
      }});
      const majType=()=>{
        m.querySelectorAll("#q-type button").forEach(b=>b.classList.toggle("on",b.dataset.v===type));
        inp.style.borderColor = type==="revenu" ? "var(--good)" : "var(--accent)";
        m.querySelector("#q-photo").style.display = type==="revenu" ? "none" : "";
        m.querySelector("#q-lib").placeholder = type==="revenu" ? "Note (facultatif) : salaire novembre, remboursement…" : "Note (facultatif) : Leclerc, boulangerie…";
        m.querySelector("#libs-r").innerHTML = libsPour(type);
        const tuile=c=>`<button type="button" data-qcat="${c.id}"><span>${c.icone||"•"}</span>${h(c.nom)}</button>`;
        m.querySelector("#q-cats").innerHTML = type==="revenu" ? catsPour(type).map(tuile).join("")
          : D.categories.filter(c=>c.type==="variable").map(tuile).join("")
            + `<div class="hint" style="grid-column:1/-1;margin-top:6px">Factures et charges :</div>`
            + D.categories.filter(c=>c.type==="fixe").map(tuile).join("");
        m.querySelectorAll("[data-qcat]").forEach(b=>b.onclick=()=>enregistrerRapide(b.dataset.qcat));
      };
      m.querySelectorAll("#q-type button").forEach(b=>b.onclick=()=>{ type=b.dataset.v; majType(); inp.focus(); });
      const majConv=()=>{ const v=num(inp.value); conv.textContent = devise==="CHF"&&v ? "≈ "+eur(versEur(v,"CHF")) : ""; };
      inp.oninput=majConv;
      dev.onclick=()=>{ devise=devise==="EUR"?"CHF":"EUR"; dev.textContent=devise==="EUR"?"€":"CHF"; majConv(); inp.focus(); };
      m.querySelector("#q-cancel").onclick=fermerModal;
      m.querySelector("#q-plus").onclick=()=>{ const v=num(inp.value), lib=m.querySelector("#q-lib").value.trim(); fermerModal(); formOperation(null,{type,montant:v||"",montantOrigine:v||"",devise,libelle:lib,categorieId:catsPour(type)[0]?.id||""}); };
      async function enregistrerRapide(catId){
        const v=Math.abs(num(inp.value));
        if(!v){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus(); return; }
        let photoId=""; try{ photoId=await ph.finaliser(); }catch(e){ alert("La photo n'a pas pu être enregistrée (mémoire du téléphone pleine ?). La dépense est quand même ajoutée."); }
        // Une rentrée va par défaut sur le compte de la personne (salaire…), une dépense sur le compte commun.
        // Rentrée déjà prévue dans « Mon budget » ce mois-ci (ex. salaire) : on remplace le montant prévu par le montant reçu, pour ne pas compter deux fois.
        if(type==="revenu"){
          const prevue=opsDuMois(moisCourant()).find(o=>o.recId&&o.type==="revenu"&&o.categorieId===catId);
          if(prevue && confirm(`« ${prevue.libelle} » est déjà prévu ce mois-ci dans Mon budget (${eur(prevue.montant)}).\n\nOK : remplacer par le montant reçu (${eur(versEur(v,devise))})\nAnnuler : l'ajouter en plus`)){
            const id=prevue.id, mt=versEur(v,devise), lib=m.querySelector("#q-lib").value.trim();
            fermerModal();
            modifier(d=>{ const z=d.operations.find(o=>o.id===id); if(!z) return; Object.assign(z,{montant:mt,devise,montantOrigine:devise==="CHF"?r2(v):null,date:aujourdhui(),personne:moi()}); if(lib) z.note=lib; if(photoId) z.photoId=photoId; },
              `${prevue.libelle} mis à jour : ${eur(mt)} reçus`);
            return;
          }
        }
        const compteId = type==="revenu" ? (D.comptes.find(c=>c.proprietaire===moi())||D.comptes[0])?.id||"" : D.comptes[0]?.id||"";
        const x={id:uid(),cree:new Date().toISOString(),type,date:datePhoto||aujourdhui(),libelle:m.querySelector("#q-lib").value.trim(),devise,photoId,
          montant:versEur(v,devise),montantOrigine:devise==="CHF"?r2(v):null,categorieId:catId,compteId,
          compteDestId:"",reserveId:"",personne:moi(),note:"",pointe:false};
        fermerModal(); modifier(d=>d.operations.push(x), `${type==="revenu"?"+ ":""}${eur(x.montant)} ajouté en ${cat(x.categorieId)?.nom||""}`);
      }
      majType();
  });
}

// Situation de découvert d'un compte : null si tout va bien.
function etatDecouvert(c){
  const s=soldeCompte(c.id), lim=num(c.decouvert);
  if(s>=0) return null;
  const neg=-s;
  if(lim>0 && neg>lim+0.004) return {niv:"bad", s, txt:`dépasse le découvert autorisé de ${eur(neg-lim)}`};
  return {niv:"warn", s, txt: lim>0 ? `à découvert · encore ${eur(lim-neg)} autorisés` : `à découvert`};
}
function alertesDecouvert(){
  const l=D.comptes.map(c=>[c,etatDecouvert(c)]).filter(x=>x[1]);
  if(!l.length) return "";
  const pire=l.some(x=>x[1].niv==="bad")?"bad":"warn";
  return `<div class="card" style="background:var(--${pire}-soft);border-color:var(--${pire})"><h3 style="color:var(--${pire});margin-bottom:6px">${pire==="bad"?"🚨 Découvert dépassé":"⚠️ Compte à découvert"}</h3>
    ${l.map(([c,e])=>`<div style="display:flex;justify-content:space-between;gap:8px;margin:4px 0" data-compte="${c.id}"><span>${h(c.nom)}<br><span class="note" style="color:var(--${e.niv})">${e.txt}</span></span><b class="num neg">${eur(e.s)}</b></div>`).join("")}</div>`;
}

function formRecurrente(r,preset){
  const o=r?{...r}:{type:preset||"depense",libelle:"",montant:"",devise:"EUR",categorieId:"",reserveId:D.reserves[0]?.id||"",jour:1,actif:true,personne:PERS_COMMUN,compteId:D.comptes[0]?.id||""};
  let type=o.type;
  const TYPES=[["revenu","💶 Revenu"],["depense","🏠 Charge fixe"],["epargne","🐷 Épargne"]];
  const titre=t=>(r?"Modifier ":"")+({revenu:r?"le revenu":"Nouveau revenu",depense:r?"la charge fixe":"Nouvelle charge fixe",epargne:r?"l'épargne":"Nouvelle épargne mensuelle"})[t];
  ouvrirModal(`<h2 id="r-titre"></h2>
    <div class="seg" id="r-type">${TYPES.map(([v,l])=>`<button type="button" data-v="${v}">${l}</button>`).join("")}</div>
    <form id="f-rec" autocomplete="off">
      <div class="fld"><label>Nom</label><input name="libelle" required value="${h(o.libelle)}"></div>
      <div class="row2"><div class="fld"><label>Montant chaque mois</label><input name="montant" inputmode="decimal" required value="${o.montant!==""?String(o.montant).replace(".",","):""}" placeholder="0,00"></div>
        <div class="fld"><label>Devise</label><select name="devise">${options([["EUR","€ Euro"],["CHF","CHF Franc suisse"]],o.devise)}</select></div></div>
      <div class="fld" data-pour="revenu,depense"><label>Catégorie</label><select name="categorieId"></select></div>
      <div class="fld" data-pour="epargne"><label>Mettre de côté dans</label><select name="reserveId">${options(D.reserves.map(x=>[x.id,x.nom]),o.reserveId)}</select>
        <span class="hint">Vos réserves se gèrent dans Plus → Comptes & épargne.</span></div>
      <div class="row2"><div class="fld"><label>Qui ?</label><select name="personne">${options(optPers(),o.personne)}</select></div>
        <div class="fld"><label id="r-lbl-compte">Compte</label><select name="compteId">${options(D.comptes.map(x=>[x.id,x.nom]),o.compteId)}</select></div></div>
      <div class="fld"><label>Jour du mois</label><input name="jour" inputmode="numeric" value="${o.jour||1}"></div>
      <label class="note" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" name="actif" ${o.actif?"checked":""} style="width:auto"> Compter chaque mois (décochez pour mettre en pause)</label>
      <div class="actions">${r?`<button type="button" class="btn danger left" id="r-del">Supprimer</button>`:""}<button type="button" class="btn" id="r-cancel">Annuler</button><button class="btn pri">Enregistrer</button></div>
    </form>`, m=>{
      const f=m.querySelector("#f-rec");
      const maj=()=>{
        m.querySelector("#r-titre").textContent=titre(type);
        m.querySelectorAll("#r-type button").forEach(b=>b.classList.toggle("on",b.dataset.v===type));
        m.querySelectorAll("[data-pour]").forEach(el=>el.style.display=el.dataset.pour.split(",").includes(type)?"":"none");
        const cs = type==="revenu" ? D.categories.filter(c=>c.type==="revenu") : [...D.categories.filter(c=>c.type==="fixe"),...D.categories.filter(c=>c.type==="variable")];
        const cur = cs.some(c=>c.id===f.categorieId.value) ? f.categorieId.value : cs.some(c=>c.id===o.categorieId) ? o.categorieId : cs[0]?.id;
        f.categorieId.innerHTML=cs.map(c=>`<option value="${c.id}" ${c.id===cur?"selected":""}>${c.icone||""} ${h(c.nom)}</option>`).join("");
        m.querySelector("#r-lbl-compte").textContent = type==="revenu"?"Arrive sur le compte":type==="epargne"?"Pris sur le compte":"Payé avec le compte";
        f.libelle.placeholder = type==="revenu"?"Ex : Salaire, pension…":type==="epargne"?"Ex : Épargne vacances":"Ex : Loyer, électricité…";
      };
      m.querySelectorAll("#r-type button").forEach(b=>b.onclick=()=>{
        type=b.dataset.v;
        // Un revenu arrive en général sur le compte de la personne
        if(type==="revenu" && !r){ const c=D.comptes.find(c=>c.proprietaire===f.personne.value); if(c) f.compteId.value=c.id; }
        maj();
      });
      maj();
      m.querySelector("#r-cancel").onclick=fermerModal;
      f.onsubmit=e=>{ e.preventDefault();
        const montant=Math.abs(num(f.montant.value)); if(!montant){ f.montant.focus(); return; }
        if(type==="epargne" && !D.reserves.length){ alert("Créez d'abord une réserve dans Plus → Comptes & épargne."); return; }
        const x={libelle:f.libelle.value.trim(),type,montant,devise:f.devise.value,
          categorieId:type==="epargne"?"":f.categorieId.value, reserveId:type==="epargne"?f.reserveId.value:"",
          compteId:f.compteId.value, personne:f.personne.value, jour:Math.min(31,Math.max(1,Math.round(num(f.jour.value)||1))), actif:f.actif.checked};
        fermerModal();
        if(r) modifier(d=>Object.assign(d.recurrentes.find(z=>z.id===r.id),x),"Enregistré");
        else { const id=uid(); modifier(d=>d.recurrentes.push({id,...x}),"Ajouté à Mon budget"); }
      };
      if(r) m.querySelector("#r-del").onclick=()=>{ if(confirm(`Supprimer « ${r.libelle} » de Mon budget ?\n(Les mois passés ne sont pas modifiés.)`)){ fermerModal(); modifier(d=>{d.recurrentes=d.recurrentes.filter(z=>z.id!==r.id)},"Supprimé de Mon budget"); } };
  });
}

/* ============================================================
   Actions
   ============================================================ */
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
function telecharger(nom,contenu,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([contenu],{type})); a.download=nom; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
const TYPE_NOM={depense:"Dépense",revenu:"Revenu",virement:"Virement",epargne:"Épargne",retrait:"Retrait réserve"};

function action(a){
  if(a==="mois-"){ mois=decaleMois(mois,-1); rendu(); }
  else if(a==="mois+"){ mois=decaleMois(mois,1); rendu(); }
  else if(a==="mois="){ mois=moisCourant(); rendu(); }
  else if(a==="nouvelle") formRapide("depense");
  else if(a==="nouvelle-rentree") formRapide("revenu");
  else if(a.startsWith("recur-new:")) formRecurrente(null,a.split(":")[1]);
  else if(a==="compte-new") formCompte();
  else if(a==="reserve-new") formReserve();
  else if(a==="cat-new") formCategorie();
  else if(a==="recur-new") formRecurrente();
  else if(a==="recur-gen"){
    const m=mois, ids=D.recurrentes.filter(r=>r.actif).map(r=>r.id);
    modifier(d=>{ const deja=new Set(d.operations.filter(o=>o.recId&&o.date.slice(0,7)===m).map(o=>o.recId));
      for(const r of d.recurrentes){ if(!r.actif||deja.has(r.id)||!ids.includes(r.id)) continue;
        const jour=String(Math.min(r.jour||1,joursDansMois(m))).padStart(2,"0");
        d.operations.push({id:uid(),cree:new Date().toISOString(),recId:r.id,type:r.type,date:m+"-"+jour,libelle:r.libelle,devise:r.devise,
          montant:versEur(r.montant,r.devise),montantOrigine:r.devise==="CHF"?r.montant:undefined,categorieId:r.type==="epargne"?"":r.categorieId,
          compteId:r.compteId,compteDestId:"",reserveId:r.type==="epargne"?r.reserveId:"",personne:r.personne,note:"",pointe:false}); } },"Opérations du mois ajoutées");
  }
  else if(a==="budget-prec"){
    const src=budgetDu(decaleMois(mois,-1)).b, m=mois;
    if(confirm(`Remplacer le budget de ${nomMois(m)} par celui du mois précédent ?`)) modifier(d=>{ d.budgets[m]={...src}; },"Budget repris");
  }
  else if(a==="budget-recur"){
    const m=mois, tot={};
    D.recurrentes.filter(r=>r.actif).forEach(r=>{ const k=r.type==="epargne"?"res:"+r.reserveId:r.categorieId; tot[k]=r2((tot[k]||0)+versEur(r.montant,r.devise)); });
    if(confirm(`Mettre dans le budget de ${nomMois(m)} les totaux des récurrentes actives ?\n(Seules les catégories qui ont des récurrentes sont modifiées.)`))
      modifier(d=>{ d.budgets[m]={...budgetDu(m).b,...tot}; },"Budget rempli");
  }
  else if(a==="export-csv"){
    const lignes=[["Date","Type","Libellé","Catégorie","Montant (€)","Montant CHF","Compte","Vers compte","Réserve","Qui","Note","Pointé"]];
    [...D.operations].sort((x,y)=>x.date.localeCompare(y.date)).forEach(o=>lignes.push([o.date,TYPE_NOM[o.type],o.libelle,cat(o.categorieId)?.nom||"",String(signeOp(o)*o.montant).replace(".",","),o.devise==="CHF"?String(o.montantOrigine).replace(".",","):"",compte(o.compteId)?.nom||"",compte(o.compteDestId)?.nom||"",reserve(o.reserveId)?.nom||"",o.personne||"",o.note||"",o.pointe?"oui":""]));
    telecharger(`operations_${aujourdhui()}.csv`,"﻿"+lignes.map(l=>l.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n"),"text/csv;charset=utf-8");
  }
  else if(a==="sync") vueSync();
  else if(a==="envoyer") envoyer();
  else if(a==="taux-maj") majTaux(true);
  else if(a.startsWith("moi:")){ const p=a.slice(4); lsSet("moi",p); fermerModal(); rendu(); if(p) toast("Bonjour "+p+" !"); }
  else if(a==="commencer"){ D.local.accueil=false; enregistrer(); rendu(); toast("C'est parti, "+moi()+" !"); }}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-edit],[data-compte],[data-reserve],[data-cat],[data-recur],[data-pointe]");
  if(!t) return;
  if(t.dataset.pointe!==undefined){ e.stopPropagation(); const id=t.dataset.pointe, v=t.checked; modifier(d=>{ const o=d.operations.find(z=>z.id===id); if(o) o.pointe=v; }); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; lsSet("tab",tab); window.scrollTo(0,0); rendu(); }
  else if(t.dataset.act) action(t.dataset.act);
  else if(t.dataset.edit) formOperation(D.operations.find(o=>o.id===t.dataset.edit));
  else if(t.dataset.compte) formCompte(compte(t.dataset.compte));
  else if(t.dataset.reserve) formReserve(reserve(t.dataset.reserve));
  else if(t.dataset.cat) formCategorie(cat(t.dataset.cat));
  else if(t.dataset.recur) formRecurrente(D.recurrentes.find(r=>r.id===t.dataset.recur));
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="moi"){ lsSet("moi",t.value); toast("Bonjour "+t.value+" !"); }
  else if(t.dataset.filtre && t.dataset.filtre!=="q"){ filtres[t.dataset.filtre]=t.value; rendu(); }
  else if(t.dataset.budget!==undefined){ const k=t.dataset.budget, v=t.value.trim()===""?"":r2(num(t.value)), m=mois;
    modifier(d=>{ if(!d.budgets[m]) d.budgets[m]={...budgetDu(m).b}; d.budgets[m][k]=v; }); }
  else if(t.dataset.taux!==undefined){ const v=num(t.value); if(v>0) modifier(d=>{ d.reglages.tauxCHF=v; },"Taux enregistré"); }
  else if(t.dataset.recevoir!==undefined && t.files[0]) recevoirFichier(t.files[0]);
});
let tq; document.addEventListener("input",e=>{ if(e.target.dataset.filtre==="q"){ filtres.q=e.target.value; clearTimeout(tq); tq=setTimeout(()=>{ const pos=e.target.selectionStart; rendu(); const s=document.querySelector('[data-filtre="q"]'); s.focus(); s.setSelectionRange(pos,pos); },250); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fermerModal(); if(e.key==="Enter"&&e.target.classList?.contains("inl")){ e.target.blur(); } });
document.getElementById("fab").onclick=()=>formRapide();

try{ charger(); fixerPrenoms(); rendu(); reclasserAnciennesCategories();
  if(!D.local.accueil && !PRENOMS.includes(lsGet("moi"))) demanderQui(); }
catch(e){ console.error(e); document.getElementById("main").innerHTML=`<div class="card empty"><h2>Erreur de lecture des données</h2><p>${h(e.message)}</p></div>`; }
// Fonctionnement hors connexion + demande de conservation durable des données
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(console.error);
if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
