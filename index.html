let CONV = {eur:"100", chf:"", dernier:"eur"}, majTauxEnCours=false, derniereTentative=0;
function tauxEurChf(){ return TAUX?.eurchf || r4(1/(D.reglages.tauxCHF||1)); }
function r4(v){ return Math.round(v*10000)/10000; }
function fr(v,d=2){ return Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
async function majTaux(force){
  if(majTauxEnCours) return;
  if(!force && TAUX && Date.now()-TAUX.le < 3*3600e3) return;
  if(!force && Date.now()-derniereTentative < 60e3) return; // hors ligne : on ne réessaie pas en boucle
  majTauxEnCours=true; derniereTentative=Date.now(); let ok=false;
  try{
    const r=await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CHF",{cache:"no-store"});
    const j=await r.json(), v=j?.rates?.CHF;
    if(!(v>0)) throw new Error("taux absent");
    TAUX={eurchf:v,date:j.date,le:Date.now()}; lsSet("taux",JSON.stringify(TAUX));
    ok=true; if(force) toast("Taux mis à jour : 1 € = "+fr(v,4)+" CHF");
  }catch(e){ if(force) toast("Pas de connexion : on garde le dernier taux connu"); }
  finally{ majTauxEnCours=false; if(ok && (tab==="convert"||tab==="plus") && !document.activeElement?.dataset?.conv) rendu(); }
}
// Taux de l'application : mis à jour seulement quand on le demande (bouton), jamais en cachette.
async function majTauxApp(){
  try{
    const r=await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CHF,USD,GBP",{cache:"no-store"});
    const j=await r.json(), q=j?.rates||{};
    if(!(q.CHF>0&&q.USD>0&&q.GBP>0)) throw new Error("taux absents");
    const t={CHF:Math.round(1e6/q.CHF)/1e6, USD:Math.round(1e6/q.USD)/1e6, GBP:Math.round(1e6/q.GBP)/1e6};
    modifier(d=>{ d.reglages.taux=t; d.reglages.tauxCHF=t.CHF; d.reglages.tauxLe=j.date; d.reglages.tauxSource="internet"; },"Taux mis à jour ("+new Date(j.date+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+")");
  }catch(e){ toast("Pas de connexion : les derniers taux connus sont gardés"); }
}
function vueConvert(){
  setTimeout(()=>majTaux(false),0);
  const t=tauxEurChf();
  { const k=CONV.dernier, autre=k==="eur"?"chf":"eur", v=num(CONV[k]); CONV[autre]= String(CONV[k]).trim()==="" ? "" : fr(k==="eur"?v*t:v/t); }
  const source = TAUX ? `Taux officiel BCE du ${new Date(TAUX.date+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}${Date.now()-TAUX.le>36e5*24?" (pas de réseau depuis, dernier taux connu)":""}`
                       : "Pas encore de taux en ligne : taux de vos réglages en attendant";
  return `<div class="stack">
    <div class="card hero-big"><div class="lbl">Taux du jour</div><div class="val num" style="font-size:34px">1 € = ${fr(t,4)} CHF</div><div class="sub">1 CHF = ${fr(1/t,4)} €</div></div>
    <div class="card">
      <div class="fld"><label>Euros (€)</label><input class="field-simple num" style="font-size:24px;font-weight:700" inputmode="decimal" data-conv="eur" value="${h(CONV.eur)}" placeholder="0,00"></div>
      <div style="text-align:center;font-size:22px;color:var(--muted);margin:-4px 0 6px">⇅</div>
      <div class="fld"><label>Francs suisses (CHF)</label><input class="field-simple num" style="font-size:24px;font-weight:700" inputmode="decimal" data-conv="chf" value="${h(CONV.chf)}" placeholder="0,00"></div>
      <p class="note" style="margin:4px 0 0">Tapez dans l'une ou l'autre case, la conversion se fait toute seule.</p>
    </div>
    <div class="card"><p class="note" style="margin-top:0">${h(source)}. Les banques et bureaux de change prennent souvent 1 à 2 % de plus.</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" data-act="taux-maj">🔄 Actualiser le taux</button>
      </div>
      <p class="hint" style="margin:8px 0 0">À titre indicatif uniquement : ce convertisseur ne modifie rien dans vos comptes.</p>
    </div></div>`;
}
document.addEventListener("input",e=>{
  const k=e.target.dataset?.conv; if(!k) return;
  const t=tauxEurChf(), v=num(e.target.value), autre=k==="eur"?"chf":"eur";
  CONV[k]=e.target.value; CONV.dernier=k; CONV[autre]= e.target.value.trim()==="" ? "" : fr(k==="eur"?v*t:v/t);
  const el=document.querySelector(`[data-conv="${autre}"]`); if(el) el.value=CONV[autre];
});

/* ---------- Photos des tickets ----------
   Rangées dans IndexedDB (stockage du téléphone, bien plus grand que celui des comptes). */
let _db=null;
function idb(){ return _db ||= new Promise((ok,ko)=>{ const r=indexedDB.open("cdf_photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"}); r.onsuccess=()=>ok(r.result); r.onerror=()=>{ _db=null; ko(r.error); }; }); }
async function idbReq(mode,fn){ const db=await idb(); return new Promise((ok,ko)=>{ const tx=db.transaction("photos",mode); const r=fn(tx.objectStore("photos")); tx.oncomplete=()=>ok(r?.result); tx.onerror=()=>ko(tx.error); }); }
const photoPut=p=>idbReq("readwrite",s=>s.put(p));
const photoGet=id=>idbReq("readonly",s=>s.get(id));
const photoDel=id=>id?idbReq("readwrite",s=>s.delete(id)).catch(()=>{}):Promise.resolve();
const photoToutes=()=>idbReq("readonly",s=>s.getAll());

// Prépare la photo : une version nette pour la lecture, une version légère (~150 Ko) à garder.
function preparerPhoto(file){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const dessiner=max=>{ const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; };
      const lecture=dessiner(2000), garde=dessiner(1200).toDataURL("image/jpeg",0.6);
      URL.revokeObjectURL(url); ok({lecture,data:garde});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error("image illisible")); };
    img.src=url;
  });
}
function voirPhoto(data){
  const ov=document.createElement("div"); ov.className="ov"; ov.style.cssText="z-index:70;align-items:center;padding:12px;background:rgba(0,0,0,.85)";
  ov.innerHTML=`<img src="${data}" alt="Ticket" style="max-width:100%;max-height:92vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)">`;
  ov.onclick=()=>ov.remove(); document.body.appendChild(ov);
}

/* ---------- Lecture du ticket (dans le téléphone, rien n'est envoyé) ----------
   Tesseract.js (logiciel libre de reconnaissance de texte) est téléchargé la première fois,
   puis gardé dans le téléphone pour marcher sans réseau. */
let _tess=null, _worker=null;
function chargerTesseract(){
  return _tess ||= new Promise((ok,ko)=>{
    if(window.Tesseract) return ok(window.Tesseract);
    const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=()=>ok(window.Tesseract); s.onerror=()=>{ _tess=null; s.remove(); ko(new Error("hors ligne")); };
    document.head.appendChild(s);
  });
}
async function lireTicket(canvas){
  const T=await chargerTesseract();
  try{ _worker ||= T.createWorker("fra"); const w=await _worker; const {data}=await w.recognize(canvas); return analyserTicket(data.text||""); }
  catch(e){ _worker=null; throw e; }
}
// Trouve le montant à payer dans le texte du ticket.
function analyserTicket(txt){
  const lignes=txt.split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const montants=l=>[...l.matchAll(/(\d{1,5})\s?[.,]\s?(\d{2})(?!\d)/g)].map(m=>+(m[1]+"."+m[2])).filter(v=>v>0&&v<10000);
  const exclu=/sous[- ]?total|t\.?v\.?a|\bh\.?t\b|rendu|monnaie|remise|[ée]conomi|points?\b|fid[ée]lit|cagnotte|avantage/i;
  const motsCles=[/net\s*[àa]\s*payer/i,/total\s*t\.?t\.?c/i,/[àa]\s*payer/i,/montant\s*(d[ûu]|total|ttc|cb|carte|r[ée]gl)/i,/\btota[l1]\b/i,/\b(cb|carte|visa|master ?card|esp[èe]ces|twint|maestro|paiement)\b/i];
  let montant=null;
  for(const re of motsCles){
    const trouves=[];
    lignes.forEach((l,i)=>{ if(re.test(l)&&!exclu.test(l)){ let v=montants(l); if(!v.length&&lignes[i+1]) v=montants(lignes[i+1]); trouves.push(...v); } });
    if(trouves.length){ montant=Math.max(...trouves); break; }
  }
  if(montant==null){ const tous=lignes.filter(l=>!exclu.test(l)).flatMap(montants); if(tous.length) montant=Math.max(...tous); }
  const devise=/\bCHF\b|\bS?Fr\.|\bFRS?\b/i.test(txt)?"CHF":/€|\bEUR\b/i.test(txt)?"EUR":null;
  let date=null; const dm=txt.match(/\b(\d{2})[\/.-](\d{2})[\/.-](\d{2}|\d{4})\b/);
  if(dm){ const y=dm[3].length===2?"20"+dm[3]:dm[3], d=`${y}-${dm[2]}-${dm[1]}`, t=new Date(d+"T12:00"); if(!isNaN(t) && t<=new Date() && (Date.now()-t)/864e5<62) date=d; }
  const magasin=(lignes.slice(0,4).find(l=>/^[A-Za-zÀ-ÿ'&.\- ]{3,28}$/.test(l)&&/[A-Za-zÀ-ÿ]{3}/.test(l))||"").trim();
  return {montant,devise,date,magasin:magasin?magasin.charAt(0).toUpperCase()+magasin.slice(1).toLowerCase():""};
}
// Bloc « 📷 Ticket » réutilisé dans les deux formulaires.
function blocPhoto(conteneur,{photoId,onLu}){
  const etat={photoId:photoId||"", nouvelle:null, retiree:false};
  const afficher=async()=>{
    let img="", info="";
    if(etat.nouvelle) img=etat.nouvelle;
    else if(etat.photoId && !etat.retiree){ const p=await photoGet(etat.photoId).catch(()=>null); if(p) img=p.data; else info=`<span class="hint">📷 Photo prise sur l'autre téléphone (pas encore reçue ici)</span>`; }
    conteneur.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${img?`<img src="${img}" alt="Ticket" data-voir style="width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in">`:""}
      <label class="btn sm">📷 ${img?"Reprendre":"Photo du ticket"}<input type="file" accept="image/*" capture="environment" hidden></label>
      ${img?`<button type="button" class="btn sm ghost" data-retirer>✕ Retirer</button>`:""}${info}
      <span class="hint" data-statut style="flex-basis:100%"></span></div>`;
    const st=conteneur.querySelector("[data-statut]");
    conteneur.querySelector("[data-voir]")?.addEventListener("click",()=>voirPhoto(img));
    conteneur.querySelector("[data-retirer]")?.addEventListener("click",()=>{ etat.nouvelle=null; etat.retiree=true; afficher(); });
    conteneur.querySelector("input[type=file]").onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      st.textContent="Préparation de la photo…";
      try{
        const p=await preparerPhoto(f); etat.nouvelle=p.data; etat.retiree=false; await afficher();
        const st2=conteneur.querySelector("[data-statut]"); st2.textContent="🔎 Lecture du ticket… (la 1re fois, quelques secondes de plus)";
        try{ const r=await lireTicket(p.lecture); onLu&&onLu(r);
          st2.innerHTML = r.montant ? `✓ Montant lu sur le ticket : <b>${fr(r.montant)} ${symbole(r.devise||"EUR")}</b>, vérifiez-le` : "Montant non trouvé sur le ticket : tapez-le";
        }catch(err){ st2.textContent = "Lecture impossible (pas de réseau la 1re fois ?) : la photo est gardée, tapez le montant."; }
      }catch(err){ st.textContent="Impossible d'utiliser cette photo."; }
    };
  };
  afficher();
  // À appeler à l'enregistrement : range la photo et renvoie l'identifiant à mettre sur l'opération.
  etat.finaliser=async()=>{
    if(etat.nouvelle){ const id=uid(); await photoPut({id,data:etat.nouvelle,cree:Date.now(),local:true}); if(etat.photoId) photoDel(etat.photoId); return id; }
    if(etat.retiree){ photoDel(etat.photoId); return ""; }
    return etat.photoId;
  };
  return etat;
}

/* Ajout rapide : montant + une touche sur la catégorie = enregistré. */
function formRapide(typeInitial){
  let type = typeInitial==="revenu" ? "revenu" : "depense";
  let devise="EUR";
  const catsPour=t=> t==="revenu" ? D.categories.filter(c=>c.type==="revenu") : [...D.categories.filter(c=>c.type==="variable"), ...D.categories.filter(c=>c.type==="fixe")];
  const libsPour=t=>[...new Set(D.operations.filter(o=>o.type===t&&!o.recId).map(x=>x.libelle).filter(Boolean))].slice(-100).map(l=>`<option value="${h(l)}">`).join("");
  ouvrirModal(`<div class="seg" id="q-type"><button type="button" data-v="depense">➖ Dépense</button><button type="button" data-v="revenu">➕ Rentrée d'argent</button></div>
    <div class="quick-amt"><input id="q-m" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Montant"><button type="button" id="q-dev" aria-label="Devise">€</button></div>
    <div class="hint" id="q-conv" style="text-align:center;min-height:16px"></div>
    <input id="q-lib" class="field-simple" autocomplete="off" list="libs-r">
    <div id="q-photo" style="margin-top:10px"></div>
    <datalist id="libs-r"></datalist>
    <div id="q-cpt-bloc" style="margin-top:12px"><div class="hint" id="q-cpt-lbl" style="margin-bottom:6px"></div><div class="chips" id="q-cpt"></div></div>
    <div class="hint" style="margin-top:12px">Touchez la catégorie pour enregistrer :</div>
    <div class="cats" id="q-cats"></div>
    <div class="actions"><button type="button" class="btn ghost sm left" id="q-plus">Date, compte, virement… ›</button><button type="button" class="btn" id="q-cancel">Annuler</button></div>`, m=>{
      const inp=m.querySelector("#q-m"), conv=m.querySelector("#q-conv"), dev=m.querySelector("#q-dev");
      let datePhoto=null;
      // Photo du ticket : le montant lu remplit la case (à vérifier), ainsi que la devise, le magasin et la date si trouvés.
      const ph=blocPhoto(m.querySelector("#q-photo"),{onLu:r=>{
        if(r.montant) inp.value=fr(r.montant);
        if(r.devise && r.devise!==devise){ devise=r.devise; dev.textContent=symbole(devise); }
        majConv();
        const lib=m.querySelector("#q-lib"); if(!lib.value && r.magasin) lib.value=r.magasin;
        datePhoto = r.date && r.date!==aujourdhui() ? r.date : null;
        if(datePhoto) conv.textContent=(conv.textContent?conv.textContent+" · ":"")+"ticket du "+new Date(datePhoto+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
      }});
      // Compte : le dernier utilisé sur ce téléphone pour ce type ; sinon compte commun (dépense) ou compte de la personne (rentrée).
      let compteId="";
      const compteParDefaut=t=>{ const vis=comptesVisibles(), der=lsGet("compte_"+t);
        if(vis.some(c=>c.id===der)) return der;
        return (t==="revenu" ? vis.find(c=>c.proprietaire===moi()) : vis.find(c=>typeCompte(c)==="commun")) ?.id || vis[0]?.id || ""; };
      const majComptes=()=>{ const vis=comptesVisibles();
        m.querySelector("#q-cpt-bloc").style.display = vis.length>1 ? "" : "none";
        m.querySelector("#q-cpt-lbl").textContent = type==="revenu" ? "Arrive sur le compte :" : "Payé avec :";
        m.querySelector("#q-cpt").innerHTML = vis.map(c=>`<button type="button" data-qcpt="${c.id}" class="${c.id===compteId?"on":""}">${iconeCompte(c)} ${h(c.nom)}</button>`).join("");
        m.querySelectorAll("[data-qcpt]").forEach(b=>b.onclick=()=>{ compteId=b.dataset.qcpt; devise=deviseCompte(compte(compteId)); dev.textContent=symbole(devise); majConv(); majComptes(); }); };
      const majType=()=>{
        compteId=compteParDefaut(type); devise=deviseCompte(compte(compteId)); dev.textContent=symbole(devise); majComptes(); if(typeof majConv==="function") majConv();
        m.querySelectorAll("#q-type button").forEach(b=>b.classList.toggle("on",b.dataset.v===type));
        inp.style.borderColor = type==="revenu" ? "var(--good)" : "var(--accent)";
        m.querySelector("#q-photo").style.display = type==="revenu" ? "none" : "";
        m.querySelector("#q-lib").placeholder = type==="revenu" ? "Note (facultatif) : salaire novembre, remboursement…" : "Note (facultatif) : Leclerc, boulangerie…";
        m.querySelector("#libs-r").innerHTML = libsPour(type);
        const tuile=c=>`<button type="button" data-qcat="${c.id}"><span>${c.icone||"•"}</span>${h(c.nom)}</button>`;
        m.querySelector("#q-cats").innerHTML = type==="revenu" ? catsPour(type).map(tuile).join("")
          : D.categories.filter(c=>c.type==="variable").map(tuile).join("")
            + `<div class="hint" style="grid-column:1/-1;margin-top:6px">Factures et charges :</div>`
            + D.categories.filter(c=>c.type==="fixe").map(tuile).join("");
        m.querySelectorAll("[data-qcat]").forEach(b=>b.onclick=()=>enregistrerRapide(b.dataset.qcat));
      };
      m.querySelectorAll("#q-type button").forEach(b=>b.onclick=()=>{ type=b.dataset.v; majType(); inp.focus(); });
      const majConv=()=>{ const v=num(inp.value); conv.textContent = devise!=="EUR"&&v ? "≈ "+eur(versEur(v,devise)) : ""; };
      inp.oninput=majConv;
      dev.onclick=()=>{ devise=deviseSuivante(devise); dev.textContent=symbole(devise); majConv(); inp.focus(); };
      m.querySelector("#q-cancel").onclick=fermerModal;
      m.querySelector("#q-plus").onclick=()=>{ const v=num(inp.value), lib=m.querySelector("#q-lib").value.trim(); fermerModal(); formOperation(null,{type,montant:v||"",montantOrigine:v||"",devise,libelle:lib,categorieId:catsPour(type)[0]?.id||"",compteId}); };
      async function enregistrerRapide(catId){
        const v=Math.abs(num(inp.value));
        if(!v){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus(); return; }
        let photoId=""; try{ photoId=await ph.finaliser(); }catch(e){ alert("La photo n'a pas pu être enregistrée (mémoire du téléphone pleine ?). La dépense est quand même ajoutée."); }
        // Une rentrée va par défaut sur le compte de la personne (salaire…), une dépense sur le compte commun.
        // Rentrée déjà prévue dans « Mon budget » ce mois-ci (ex. salaire) : on remplace le montant prévu par le montant reçu, pour ne pas compter deux fois.
        if(type==="revenu"){
          const prevue=opsDuMois(moisCourant()).find(o=>o.recId&&o.type==="revenu"&&o.categorieId===catId);
          if(prevue && confirm(`« ${prevue.libelle} » est déjà prévu ce mois-ci dans Mon budget (${eur(prevue.montant)}).\n\nOK : remplacer par le montant reçu (${eur(versEur(v,devise))})\nAnnuler : l'ajouter en plus`)){
            const id=prevue.id, mt=versEur(v,devise), lib=m.querySelector("#q-lib").value.trim();
            fermerModal();
            modifier(d=>{ const z=d.operations.find(o=>o.id===id); if(!z) return; Object.assign(z,{montant:mt,devise,montantOrigine:devise!=="EUR"?r2(v):null,date:aujourdhui(),personne:moi()}); if(lib) z.note=lib; if(photoId) z.photoId=photoId; },
              `${prevue.libelle} mis à jour : ${eur(mt)} reçus`);
            return;
          }
        }
        if(compteId) lsSet("compte_"+type,compteId);
        const x={id:uid(),cree:new Date().toISOString(),type,date:datePhoto||aujourdhui(),libelle:m.querySelector("#q-lib").value.trim(),devise,photoId,
          montant:versEur(v,devise),montantOrigine:devise!=="EUR"?r2(v):null,categorieId:catId,compteId,
          compteDestId:"",reserveId:"",personne:moi(),note:"",pointe:false};
        fermerModal(); modifier(d=>d.operations.push(x), `${type==="revenu"?"+ ":""}${eur(x.montant)} ajouté en ${cat(x.categorieId)?.nom||""}`);
      }
      majType();
  });
}
function formOperation(op,preset){
  const nouv=!op;
  const o=op?{...op}:{type:"depense",date:aujourdhui(),libelle:"",montant:"",devise:"EUR",categorieId:(D.categories.find(c=>c.type==="variable")||{}).id||"",compteId:comptesVisibles()[0]?.id||"",compteDestId:comptesVisibles()[1]?.id||"",reserveId:D.reserves[0]?.id||"",personne:moi(),note:"",pointe:false,...(preset||{})};
  const montantAffiche=o.devise&&o.devise!=="EUR"?o.montantOrigine:o.montant;
  const TYPES=[["depense","Dépense"],["revenu","Revenu"],["virement","Virement"],["epargne","Épargne"],["retrait","Retrait réserve"]];
  ouvrirModal(`
    <h2>${nouv?"Nouvelle opération":"Modifier l'opération"}</h2>
    <div class="seg" id="f-type">${TYPES.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===o.type?"on":""}">${l}</button>`).join("")}</div>
    <form id="f-op" autocomplete="off">
      <div class="row2 big-amount"><div class="fld"><label>Montant</label><input name="montant" inputmode="decimal" required value="${montantAffiche!==""&&montantAffiche!=null?String(montantAffiche).replace(".",","):""}" placeholder="0,00"></div>
        <div class="fld"><label>Devise</label><select name="devise">${options(DEVISES_OPT,o.devise||"EUR")}</select></div></div>
      <div class="hint" id="f-conv" style="margin:-6px 0 10px"></div>
      <div data-types="virement" style="margin:-4px 0 10px"><button type="button" class="btn sm" id="f-tout">Tout le solde du compte de départ</button></div>

      <div class="row2"><div class="fld"><label>Date</label><input type="date" name="date" required value="${h(o.date)}"></div>
        <div class="fld"><label>Qui ?</label><select name="personne">${options(persOptions().map(p=>[p,p]),o.personne)}</select></div></div>
      <div class="row2"><div class="fld"><label id="lbl-compte">Compte</label><select name="compteId">${options(optComptes(o.compteId),o.compteId)}</select></div>
        <div class="fld" data-types="virement"><label>Vers le compte</label><select name="compteDestId">${options(optComptes(o.compteDestId),o.compteDestId)}</select></div>
        <div class="fld" data-types="epargne,retrait"><label>Réserve</label><select name="reserveId">${options(D.reserves.map(c=>[c.id,c.nom]),o.reserveId)}</select></div></div>
      <div class="fld" id="f-recu-bloc" style="display:none"><label id="lbl-recu">Montant reçu</label><input name="montantDest" inputmode="decimal" value="${o.montantDest!=null?String(o.montantDest).replace(".",","):""}" placeholder="0,00"><span class="hint" id="f-recu-info"></span></div>
      <div class="fld"><label>Note (facultatif)</label><input name="note" value="${h(o.note)}"></div>
      <div class="fld" data-types="depense"><label>Ticket de caisse</label><div id="f-photo"></div></div>
      <div data-types="depense"><label class="note" style="display:flex;gap:8px;align-items:center;margin:-4px 0 10px"><input type="checkbox" name="exceptionnelle" ${o.exceptionnelle?"checked":""} style="width:20px;height:20px"> ⭐ Dépense exceptionnelle (bien visible dans le calendrier)</label></div>
      <div class="actions">
        ${nouv?"":`<button type="button" class="btn danger left" id="f-del">Supprimer</button><button type="button" class="btn" id="f-dup">Dupliquer</button>`}
        <button type="button" class="btn" id="f-cancel">Annuler</button>
        <button class="btn pri">${nouv?"Ajouter":"Enregistrer"}</button>
      </div>
    </form>`, m=>{
      let type=o.type; const f=m.querySelector("#f-op");
      const majType=()=>{
        m.querySelectorAll("#f-type button").forEach(b=>b.classList.toggle("on",b.dataset.v===type));
        m.querySelectorAll("[data-types]").forEach(el=>el.style.display=el.dataset.types.split(",").includes(type)?"":"none");
        const cs=catsDe(type==="revenu"?"revenu":"depense");
        const cur=f.categorieId.value||o.categorieId;
        f.categorieId.innerHTML=cs.map(c=>`<option value="${c.id}" ${c.id===cur?"selected":""}>${c.icone||""} ${h(c.nom)}</option>`).join("");
        m.querySelector("#lbl-compte").textContent = type==="virement"?"Depuis le compte":type==="retrait"?"Vers le compte":type==="epargne"?"Depuis le compte":type==="revenu"?"Sur le compte":"Payé avec le compte";
      };
      const majConv=()=>{ const v=num(f.montant.value); const dv=f.devise.value; m.querySelector("#f-conv").textContent = dv!=="EUR"&&v ? "≈ "+eur(versEur(v,dv))+" (1 "+dv+" = "+fr(tauxDe(dv),4)+" €)" : ""; };
      m.querySelectorAll("#f-type button").forEach(b=>b.onclick=()=>{type=b.dataset.v; majType();});
      f.montant.oninput=majConv; f.devise.onchange=majConv;
      if(nouv && !preset?.devise) f.devise.value=deviseCompte(compte(f.compteId.value));
      f.compteId.addEventListener("change",()=>{ if(nouv && !num(f.montant.value)) { f.devise.value=deviseCompte(compte(f.compteId.value)); majConv(); } });
      const majEnv=()=>{ const el=m.querySelector("#f-env"); if(!el) return; el.textContent = type==="depense" ? texteEnvCat(f.categorieId.value, f.date.value||aujourdhui()) : ""; };
      f.categorieId.addEventListener("change",majEnv); f.date.addEventListener("change",majEnv); m.querySelectorAll("#f-type button").forEach(b=>b.addEventListener("click",majEnv));
      // Change entre deux devises : le montant reçu est celui de la banque (on propose le taux de l'appli).
      let recuTouche = o.montantDest!=null;
      const majChange=()=>{ const bloc=m.querySelector("#f-recu-bloc"), src=compte(f.compteId.value), dst=compte(f.compteDestId.value);
        const ds=deviseCompte(src), dd=deviseCompte(dst), change = type==="virement" && dst && src && dd!==f.devise.value;
        bloc.style.display = change ? "" : "none"; if(!change) return;
        m.querySelector("#lbl-recu").textContent=`Montant reçu sur « ${dst.nom} » (${symbole(dd)})`;
        const v=Math.abs(num(f.montant.value)), estime=r2(convertir(v,f.devise.value,dd));
        if(!recuTouche) f.montantDest.value = v ? fr(estime) : "";
        const recu=num(f.montantDest.value), info=m.querySelector("#f-recu-info");
        info.innerHTML = v ? `Au taux de l'appli : ${fmt(estime,dd)}. Mettez le montant exact reçu (relevé bancaire) : la différence est le coût du change.${recu&&v?` <b>Taux obtenu : 1 ${f.devise.value} = ${fr(recu/v,4)} ${dd}</b>`:""}` : "";
      };
      f.montantDest.addEventListener("input",()=>{ recuTouche=true; majChange(); });
      f.montant.addEventListener("input",majChange); f.devise.addEventListener("change",majChange);
      f.compteId.addEventListener("change",()=>{ if(type==="virement") f.devise.value=deviseCompte(compte(f.compteId.value)); majConv(); majChange(); });
      f.compteDestId.addEventListener("change",()=>{ recuTouche=false; majChange(); });
      m.querySelectorAll("#f-type button").forEach(b=>b.addEventListener("click",majChange));
      m.querySelector("#f-tout").onclick=()=>{ const src=compte(f.compteId.value); if(!src) return; const sv=soldeCompte(src.id);
        if(sv<=0){ toast("Ce compte n'a rien à transférer aujourd'hui"); return; }
        f.devise.value=deviseCompte(src); f.montant.value=fr(sv); recuTouche=false; majConv(); majChange(); };
      majType(); majConv(); majEnv(); majChange();
      const ph=blocPhoto(m.querySelector("#f-photo"),{photoId:o.photoId,onLu:r=>{
        if(r.montant && (!num(f.montant.value) || confirm(`Remplacer le montant par celui lu sur le ticket (${fr(r.montant)}) ?`))) f.montant.value=fr(r.montant);
        if(r.devise) f.devise.value=r.devise;
        if(!f.libelle.value && r.magasin) f.libelle.value=r.magasin;
        if(r.date && nouv) f.date.value=r.date;
        majConv();
      }});
      m.querySelector("#f-cancel").onclick=fermerModal;
      const lire=()=>{ const v=num(f.montant.value), dev=f.devise.value;
        // Montant inchangé sur une opération existante : on garde la conversion faite le jour de la saisie.
        const inchange = !nouv && dev===(op.devise||"EUR") && r2(Math.abs(v))===r2(num(montantOp(op)));
        return {type, date:f.date.value, libelle:f.libelle.value.trim(), devise:dev, montant:inchange?op.montant:versEur(Math.abs(v),dev), montantOrigine:dev!=="EUR"?r2(Math.abs(v)):undefined,
          categorieId:(type==="depense"||type==="revenu")?f.categorieId.value:"", compteId:f.compteId.value,
          compteDestId:type==="virement"?f.compteDestId.value:"", reserveId:(type==="epargne"||type==="retrait")?f.reserveId.value:"",
          personne:f.personne.value, note:f.note.value.trim(), exceptionnelle:type==="depense"&&f.exceptionnelle.checked?true:undefined,
          montantDest: type==="virement" && m.querySelector("#f-recu-bloc").style.display!=="none" && num(f.montantDest.value)>0 ? r2(Math.abs(num(f.montantDest.value))) : undefined}; };
      f.onsubmit=async e=>{ e.preventDefault(); const x=lire();
        if(!x.montant){ f.montant.focus(); return; }
        if(x.type==="virement"&&x.compteId===x.compteDestId){ alert("Choisissez deux comptes différents."); return; }
        try{ const pid=await ph.finaliser(); if(pid!==(o.photoId||"")) x.photoId=pid; }catch(err){ alert("La photo n'a pas pu être enregistrée (mémoire du téléphone pleine ?)."); }
        fermerModal();
        if(nouv){ const id=uid(), cree=new Date().toISOString(); modifier(d=>{ if(!d.operations.some(z=>z.id===id)) d.operations.push({id,cree,pointe:false,...x}); },"Opération ajoutée"); }
        else modifier(d=>{ const z=d.operations.find(z=>z.id===op.id); if(z) Object.assign(z,x); },"Opération modifiée");
      };
      if(!nouv){
        m.querySelector("#f-del").onclick=()=>{ if(confirm("Supprimer cette opération ?")){ fermerModal(); photoDel(op.photoId); modifier(d=>{ d.operations=d.operations.filter(z=>z.id!==op.id); },"Opération supprimée"); } };
        m.querySelector("#f-dup").onclick=()=>{ const x=lire(); fermerModal(); const id=uid(), cree=new Date().toISOString(); x.date=aujourdhui(); modifier(d=>d.operations.push({id,cree,pointe:false,...x}),"Opération dupliquée à la date du jour"); };
      }
  });
}

function formSimple(titre, champs, valeurs, onSave, onDel){
  ouvrirModal(`<h2>${h(titre)}</h2><form id="f-s" autocomplete="off">${champs.map(c=>{

      if(c.check) return `<div class="fld"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${c.n}" ${v?"checked":""} style="width:auto"> ${c.l}</label></div>`;
      return `<div class="fld"><label>${c.l}</label><input name="${c.n}" ${c.num?'inputmode="decimal"':""} ${c.req?"required":""} value="${h(c.num&&v!==""?String(v).replace(".",","):v)}" placeholder="${h(c.ph||"")}">${c.hint?`<span class="hint">${c.hint}</span>`:""}</div>`;
    }).join("")}
    <div class="actions">${onDel?`<button type="button" class="btn danger left" id="f-del">Supprimer</button>`:""}<button type="button" class="btn" id="f-cancel">Annuler</button><button class="btn pri">Enregistrer</button></div></form>`, m=>{
      const f=m.querySelector("#f-s"); m.querySelector("#f-cancel").onclick=fermerModal;
      f.onsubmit=e=>{ e.preventDefault(); const x={}; champs.forEach(c=>{ const el=f.elements[c.n]; x[c.n]=c.check?el.checked:c.num?num(el.value):el.value.trim(); }); fermerModal(); onSave(x); };

  });

const optPers=()=>persOptions().map(p=>[p,p]);
function formCompte(c){

    <div class="fld"><label>Découvert autorisé par la banque <span id="c-dev-lbl"></span></label><input name="decouvert" inputmode="decimal" value="${mt(v.decouvert)}" placeholder="Ex : 500 — laisser vide si aucun"><span class="hint">L'appli vous prévient quand le compte passe à découvert, et en rouge si vous dépassez ce montant.</span></div>

    <div class="actions">${c?`<button type="button" class="btn danger left" id="f-del">Supprimer</button><button type="button" class="btn" id="c-arch">${v.archive?"Désarchiver":"Archiver"}</button>`:""}<button type="button" class="btn" id="f-cancel">Annuler</button><button class="btn pri">Enregistrer</button></div></form>`, m=>{

// Situation de découvert d'un compte : null si tout va bien.
function etatDecouvert(c){
  const s=soldeCompte(c.id), lim=num(c.decouvert);
  if(s>=0) return null;
  const neg=-s;
  if(lim>0 && neg>lim+0.004) return {niv:"bad", s, txt:`dépasse le découvert autorisé de ${fmtCompte(neg-lim,c)}`};
  return {niv:"warn", s, txt: lim>0 ? `à découvert · encore ${fmtCompte(lim-neg,c)} autorisés` : `à découvert`};
}
function alertesDecouvert(){
  const l=D.comptes.filter(c=>!c.archive).map(c=>[c,etatDecouvert(c)]).filter(x=>x[1]);
  if(!l.length) return "";
  const pire=l.some(x=>x[1].niv==="bad")?"bad":"warn";
  return `<div class="card" style="background:var(--${pire}-soft);border-color:var(--${pire})"><h3 style="color:var(--${pire});margin-bottom:6px">${pire==="bad"?"🚨 Découvert dépassé":"⚠️ Compte à découvert"}</h3>
    ${l.map(([c,e])=>`<div style="display:flex;justify-content:space-between;gap:8px;margin:4px 0" data-compte="${c.id}"><span>${h(c.nom)}<br><span class="note" style="color:var(--${e.niv})">${e.txt}</span></span><b class="num neg">${fmtCompte(e.s,c)}</b></div>`).join("")}</div>`;
}
// Prélèvements dont la date est passée et qu'il faut confirmer (charges avec « Me demander de confirmer »).
function carteAConfirmer(){
  const l=D.operations.filter(enAttente).sort((a,b)=>a.date.localeCompare(b.date)); if(!l.length) return "";
  return `<div class="card" style="border-color:var(--warn)"><h3 style="color:var(--warn);margin-bottom:4px">❓ Prélèvements à confirmer</h3>
    ${l.map(o=>{ const cle=o.id.slice(("auto_"+o.recId+"_").length); return `<div class="mline" style="cursor:default"><div class="mid"><div class="t">${h(libelleOp(o))} · ${fmtOp(o)}</div><div class="s">prévu le ${h(dateCourte(o.date))}</div></div>
      <button class="btn sm pri" data-act="confirmer:${o.recId}|${cle}">✅ Payé</button><button class="btn sm" data-echeance="${o.recId}|${cle}">Autre…</button></div>`; }).join("")}
    <p class="note" style="margin:6px 0 0">Tant qu'ils ne sont pas confirmés, ils ne sont pas déduits du solde réel (mais comptent dans le prévu).</p></div>`;
}
// Découvert PRÉVU d'ici la fin du mois (à cause d'un prélèvement à venir), pour les comptes qui ne sont pas déjà en alerte.
function decouvertsPrevus(){
  return comptesActifs().map(c=>{ const s=soldeCompte(c.id), lim=num(c.decouvert), p=projection(c.id);
    if(!p.dateMin) return null;
    const depasse = lim>0 && p.min < -lim-0.004, passeNeg = p.min<0 && s>=0;
    if(!(depasse && s>=-lim) && !passeNeg) return null;
    return {c, p, niv:depasse?"bad":"warn", txt:(depasse?`dépassera le découvert autorisé le ${dateCourte(p.dateMin)}`:`passera à découvert le ${dateCourte(p.dateMin)}`)+(p.cause?` (${libelleOp(p.cause)})`:"")};
  }).filter(Boolean);
}
function alertesPrevues(){
  const l=decouvertsPrevus(); if(!l.length) return "";
  const pire=l.some(x=>x.niv==="bad")?"bad":"warn";
  return `<div class="card" style="border-color:var(--${pire})"><h3 style="color:var(--${pire});margin-bottom:6px">📅 Découvert prévu ce mois-ci</h3>
    ${l.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;margin:4px 0" data-compte="${x.c.id}"><span>${h(x.c.nom)}<br><span class="note" style="color:var(--${x.niv})">${h(x.txt)}</span></span><b class="num neg">${fmtCompte(x.p.min,x.c)}</b></div>`).join("")}
    <p class="note" style="margin:6px 0 0">C'est une prévision d'après les prélèvements à venir : rien n'est encore déduit.</p></div>`;
}
function formReserve(r){
  formSimple(r?"Modifier la réserve":"Nouvelle réserve",[{n:"nom",l:"Nom",req:1,ph:"Ex : Vacances d'été"},{n:"objectif",l:"Objectif (€, facultatif)",num:1},{n:"soldeInitial",l:"Déjà mis de côté (€)",num:1}],

}
function formCategorie(c){

    c||{type:"variable",icone:""},
    x=>{ if(c) modifier(d=>Object.assign(d.categories.find(z=>z.id===c.id),x),"Catégorie enregistrée"); else { const id=uid(); modifier(d=>d.categories.push({id,...x}),"Catégorie ajoutée"); } },
    c && (()=>{ const n=D.operations.filter(o=>o.categorieId===c.id).length+D.recurrentes.filter(o=>o.categorieId===c.id).length; if(n){ alert(`Cette catégorie est utilisée ${n} fois. Changez d'abord la catégorie de ces opérations.`); return; } if(confirm("Supprimer cette catégorie ?")) modifier(d=>{d.categories=d.categories.filter(z=>z.id!==c.id)},"Catégorie supprimée"); }));
}
// Formulaire « Mon budget » : n'affiche que les champs utiles au type choisi.
function formRecurrente(r,preset){
  const o=r?{...r}:{type:preset||"depense",libelle:"",montant:"",devise:"EUR",categorieId:"",reserveId:D.reserves[0]?.id||"",jour:1,actif:true,personne:PERS_COMMUN,compteId:comptesVisibles()[0]?.id||""};
  let type=o.type;
  const TYPES=[["revenu","💶 Revenu"],["depense","🏠 Charge fixe"],["epargne","🐷 Épargne"]];
  const titre=t=>(r?"Modifier ":"")+({revenu:r?"le revenu":"Nouveau revenu",depense:r?"la charge fixe":"Nouvelle charge fixe",epargne:r?"l'épargne":"Nouvelle épargne mensuelle"})[t];
  ouvrirModal(`<h2 id="r-titre"></h2>
    <div class="seg" id="r-type">${TYPES.map(([v,l])=>`<button type="button" data-v="${v}">${l}</button>`).join("")}</div>
    <form id="f-rec" autocomplete="off">
      <div class="fld"><label>Nom</label><input name="libelle" required value="${h(o.libelle)}"></div>
      <div class="row2"><div class="fld"><label>Montant</label><input name="montant" inputmode="decimal" required value="${o.montant!==""?String(o.montant).replace(".",","):""}" placeholder="0,00"></div>
        <div class="fld"><label>Devise</label><select name="devise">${options(DEVISES_OPT,o.devise||"EUR")}</select></div></div>
      <div class="fld" data-pour="revenu,depense"><label>Catégorie</label><select name="categorieId"></select></div>
      <div class="fld" data-pour="epargne"><label>Mettre de côté dans</label><select name="reserveId">${options(D.reserves.map(x=>[x.id,x.nom]),o.reserveId)}</select>
        <span class="hint">Vos réserves se gèrent dans Plus → Comptes & épargne.</span></div>
      <div class="row2"><div class="fld"><label>Qui ?</label><select name="personne">${options(optPers(),o.personne)}</select></div>
        <div class="fld"><label id="r-lbl-compte">Compte</label><select name="compteId">${options(optComptes(o.compteId),o.compteId)}</select></div></div>
      <div class="row2"><div class="fld"><label>Fréquence</label><select name="frequence">${options(FREQ,o.frequence||"mensuel")}</select></div>
        <div class="fld" id="r-jour"><label>Jour du mois</label><input name="jour" inputmode="numeric" value="${o.jour||1}"></div></div>
      <div class="fld" id="r-tous"><label>Tous les combien de mois ?</label><input name="tousLes" inputmode="numeric" value="${o.tousLes||2}"></div>
      <div class="row2"><div class="fld"><label>Date de début <span id="r-deb-opt">(facultatif)</span></label><input type="date" name="debut" value="${h(o.debut||"")}"></div>
        <div class="fld"><label>Date de fin (facultatif)</label><input type="date" name="fin" value="${h(o.fin||"")}"></div></div>
      <span class="hint" id="r-deb-hint" style="display:block;margin:-6px 0 10px"></span>
      <label class="note" style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" name="confirmer" ${o.confirmer?"checked":""} style="width:auto"> Me demander de confirmer chaque prélèvement</label>
      <label class="note" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" name="actif" ${o.actif?"checked":""} style="width:auto"> Active (décochez pour tout mettre en pause)</label>
      <div class="actions">${r?`<button type="button" class="btn danger left" id="r-del">Supprimer</button>`:""}<button type="button" class="btn" id="r-cancel">Annuler</button><button class="btn pri">Enregistrer</button></div>
    </form>`, m=>{
      const f=m.querySelector("#f-rec");
      const maj=()=>{
        m.querySelector("#r-titre").textContent=titre(type);
        m.querySelectorAll("#r-type button").forEach(b=>b.classList.toggle("on",b.dataset.v===type));
        m.querySelectorAll("[data-pour]").forEach(el=>el.style.display=el.dataset.pour.split(",").includes(type)?"":"none");
        const cs = type==="revenu" ? D.categories.filter(c=>c.type==="revenu") : [...D.categories.filter(c=>c.type==="fixe"),...D.categories.filter(c=>c.type==="variable")];
        const cur = cs.some(c=>c.id===f.categorieId.value) ? f.categorieId.value : cs.some(c=>c.id===o.categorieId) ? o.categorieId : cs[0]?.id;
        f.categorieId.innerHTML=cs.map(c=>`<option value="${c.id}" ${c.id===cur?"selected":""}>${c.icone||""} ${h(c.nom)}</option>`).join("");
        m.querySelector("#r-lbl-compte").textContent = type==="revenu"?"Arrive sur le compte":type==="epargne"?"Pris sur le compte":"Payé avec le compte";
        const fq=f.frequence.value;
        m.querySelector("#r-jour").style.display = fq==="hebdo"?"none":"";
        m.querySelector("#r-tous").style.display = fq==="perso"?"":"none";
        m.querySelector("#r-deb-opt").textContent = fq==="mensuel"?"(facultatif)":"";
        m.querySelector("#r-deb-hint").textContent = fq==="hebdo" ? "La date de début donne le jour de la semaine." : fq==="mensuel" ? "" : "La date de début donne le mois de départ (ex : assurance payée chaque année en mars → début en mars).";
        f.libelle.placeholder = type==="revenu"?"Ex : Salaire, pension…":type==="epargne"?"Ex : Épargne vacances":"Ex : Loyer, électricité…";
      };
      m.querySelectorAll("#r-type button").forEach(b=>b.onclick=()=>{
        type=b.dataset.v;
        // Un revenu arrive en général sur le compte de la personne
        if(type==="revenu" && !r){ const c=comptesVisibles().find(c=>c.proprietaire===f.personne.value); if(c) f.compteId.value=c.id; }
        maj();
      });
      f.frequence.onchange=maj;
      maj();
      m.querySelector("#r-cancel").onclick=fermerModal;
      f.onsubmit=e=>{ e.preventDefault();
        const montant=Math.abs(num(f.montant.value)); if(!montant){ f.montant.focus(); return; }
        if(type==="epargne" && !D.reserves.length){ alert("Créez d'abord une réserve dans Plus → Comptes & épargne."); return; }
        const x={libelle:f.libelle.value.trim(),type,montant,devise:f.devise.value,
          categorieId:type==="epargne"?"":f.categorieId.value, reserveId:type==="epargne"?f.reserveId.value:"",
          compteId:f.compteId.value, personne:f.personne.value, jour:Math.min(31,Math.max(1,Math.round(num(f.jour.value)||1))), actif:f.actif.checked,
          frequence:f.frequence.value, tousLes:f.frequence.value==="perso"?Math.max(1,Math.round(num(f.tousLes.value)||1)):undefined,
          debut:f.debut.value||"", fin:f.fin.value||"", confirmer:f.confirmer.checked};
        // Une fréquence autre que mensuelle a besoin d'une date de départ.
        if(x.frequence!=="mensuel" && !x.debut){ const m0=moisCourant(); x.debut = x.frequence==="hebdo" ? aujourdhui() : m0+"-"+pad2(Math.min(x.jour,joursDansMois(m0))); }
        if(x.frequence==="hebdo" && x.debut) x.jour=new Date(x.debut+"T12:00").getDate();
        if(x.fin && x.debut && x.fin<x.debut){ alert("La date de fin est avant la date de début."); return; }
        if(x.tousLes===undefined) delete x.tousLes;
        // Historique : ce qui a changé
        if(r){ const ch=[], dt=v=>v?new Date(v+"T12:00").toLocaleDateString("fr-FR"):"aucune";
          if(r2(r.montant)!==r2(x.montant)||(r.devise||"EUR")!==x.devise) ch.push(`montant ${fmt(r.montant,r.devise)} → ${fmt(x.montant,x.devise)}`);
          if((r.frequence||"mensuel")!==x.frequence||(r.tousLes||"")!==(x.tousLes||"")) ch.push(`fréquence : ${texteFrequence({...r,...x})}`);
          else if((r.jour||1)!==x.jour) ch.push(`jour ${r.jour||1} → ${x.jour}`);
          if((r.debut||"")!==x.debut) ch.push(`début : ${dt(x.debut)}`);
          if((r.fin||"")!==x.fin) ch.push(`fin : ${dt(x.fin)}`);
          if(r.compteId!==x.compteId) ch.push(`compte : ${compte(x.compteId)?.nom||"?"}`);
          if(!!r.actif!==x.actif) ch.push(x.actif?"réactivée":"mise en pause");
          if(!!r.confirmer!==x.confirmer) ch.push(x.confirmer?"confirmation de chaque prélèvement demandée":"plus de confirmation demandée");
          if(r.libelle!==x.libelle) ch.push(`nom : ${x.libelle}`);
          if(ch.length) x.historique=[...(r.historique||[]), {le:new Date().toISOString(), txt:ch.join(" · ")}].slice(-40); }
        fermerModal();
        if(r) modifier(d=>{ const z=d.recurrentes.find(z=>z.id===r.id); Object.assign(z,x); if(x.tousLes===undefined) delete z.tousLes; },"Enregistré");
        else { const id=uid(); modifier(d=>d.recurrentes.push({id,...x}),"Ajouté à Mon budget"); }
      };
      if(r) m.querySelector("#r-del").onclick=()=>{ if(confirm(`Supprimer « ${r.libelle} » de Mon budget ?\n(Les mois passés ne sont pas modifiés.)`)){ fermerModal(); modifier(d=>{d.recurrentes=d.recurrentes.filter(z=>z.id!==r.id)},"Supprimé de Mon budget"); } };
  });
}

/* ============================================================
   Actions
   ============================================================ */
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
function toastLong(t){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","alert"); el.style.whiteSpace="pre-line"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),4500); }
function telecharger(nom,contenu,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([contenu],{type})); a.download=nom; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
const TYPE_NOM={depense:"Dépense",revenu:"Revenu",virement:"Virement",epargne:"Épargne",retrait:"Retrait réserve"};

function action(a){
  if(a==="mois-"){ mois=decaleMois(mois,-1); rendu(); }
  else if(a==="mois+"){ mois=decaleMois(mois,1); rendu(); }
  else if(a==="mois="){ mois=moisCourant(); rendu(); }
  else if(a==="nouvelle") formRapide("depense");
  else if(a==="nouvelle-rentree") formRapide("revenu");
  else if(a==="ticket"){ formRapide("depense"); document.querySelector("#q-photo input[type=file]")?.click(); }
  else if(a==="voix") saisieVocale();
  else if(a==="accueil-perso") personnaliserAccueil();
  else if(a==="tout-effacer") toutEffacer();
  else if(a==="prenoms"){ const v=[0,1].map(i=>(document.getElementById("pr-"+i)?.value||"").trim().replace(/\s+/g," ")), ps=personnes();
    if(!v[0]){ alert("Le premier prénom est obligatoire."); return; }
    if(v[0]===v[1]||v.includes(PERS_COMMUN)){ alert("Deux prénoms différents, et pas « "+PERS_COMMUN+" »."); return; }
    if(ps[1]&&!v[1]){ alert("Pour retirer la 2e personne, il faudrait d'abord changer le nom sur ses opérations. Laissez son prénom."); return; }
    modifier(d=>{ v.forEach((n,i)=>{ if(!n) return; if(d.reglages.personnes[i]==null){ d.reglages.personnes[i]=n; const id="perso"+(i+1); if(!d.comptes.some(c=>c.id===id)) d.comptes.push({id,nom:"Compte de "+n,proprietaire:n,soldeInitial:0}); }
      else if(d.reglages.personnes[i]!==n) renommerPersonne(d,i,n); }); },"Prénoms enregistrés"); verifierQui(); }
  else if(a.startsWith("recur-new:")) formRecurrente(null,a.split(":")[1]);
  else if(a==="compte-new") formCompte();
  else if(a==="change"){ const vis=comptesVisibles(), src=vis.find(c=>deviseCompte(c)==="CHF")||vis.find(c=>deviseCompte(c)!=="EUR");
    if(!src){ alert("Pour changer des CHF en euros, créez d'abord un compte en CHF :\nComptes & épargne → + Compte, devise « CHF » (par exemple « Salaire CHF »).\n\nVous pourrez ensuite y noter votre salaire, payer en CHF (une amende suisse…), puis changer le reste en euros."); return; }
    const dst=vis.find(c=>deviseCompte(c)===dp()&&c.proprietaire===moi()) || vis.find(c=>deviseCompte(c)===dp()&&typeCompte(c)==="commun") || vis.find(c=>deviseCompte(c)!==deviseCompte(src));
    formOperation(null,{type:"virement",compteId:src.id,compteDestId:dst?.id||"",devise:deviseCompte(src),libelle:`Change ${deviseCompte(src)} → ${symbole(deviseCompte(dst))}`}); }
  else if(a==="reserve-new") formReserve();
  else if(a==="cat-new") formCategorie();
  else if(a==="recur-new") formRecurrente();
  else if(a==="recur-gen"){
    // Échéances du mois affiché, avec les mêmes identifiants que la génération automatique (pas de doublon possible).
    const m=mois, ids=new Set(D.operations.map(o=>o.id)), faites=new Set(D.operations.filter(o=>o.recId&&!String(o.id).startsWith("auto_")&&o.date.slice(0,7)===m).map(o=>o.recId)); let n=0;
    for(const r of D.recurrentes){ if(!r.actif) continue; for(const oc of occurrencesMois(r,m)){ const id=`auto_${r.id}_${oc.cle}`;
      if(ids.has(id)||D.supprimes[id]||(r.frequence!=="hebdo"&&faites.has(r.id))) continue; D.operations.push(opDeRec(r,oc,id)); n++; } }
    enregistrer(); rendu(); toast(n?`${n} échéance(s) ajoutée(s)`:"Tout est déjà là");
  }
  else if(a==="budget-prec"){
    const src=budgetDu(decaleMois(mois,-1)).b, m=mois;
    if(confirm(`Remplacer le budget de ${nomMois(m)} par celui du mois précédent ?`)) modifier(d=>{ d.budgets[m]={...src}; },"Budget repris");
  }
  else if(a==="budget-recur"){
    const m=mois, tot={};
    D.recurrentes.filter(r=>r.actif).forEach(r=>{ const k=r.type==="epargne"?"res:"+r.reserveId:r.categorieId; tot[k]=r2((tot[k]||0)+occurrencesMois(r,m).reduce((a,oc)=>{ const e=r.exceptions?.[oc.cle]||{}; return STATUTS_EXCLUS.includes(e.statut)?a:a+versEur(e.montant!=null?e.montant:oc.montant!=null?oc.montant:r.montant,r.devise); },0)); });
    if(confirm(`Mettre dans le budget de ${nomMois(m)} les totaux des récurrentes actives ?\n(Seules les catégories qui ont des récurrentes sont modifiées.)`))
      modifier(d=>{ d.budgets[m]={...budgetDu(m).b,...tot}; },"Budget rempli");
  }
  else if(a==="export-csv"){
    const lignes=[["Date","Type","Libellé","Catégorie","Montant (€)","Montant d'origine","Compte","Vers compte","Réserve","Qui","Note","Pointé"]];
    [...D.operations].sort((x,y)=>x.date.localeCompare(y.date)).forEach(o=>lignes.push([o.date,TYPE_NOM[o.type],o.libelle,cat(o.categorieId)?.nom||"",String(signeOp(o)*o.montant).replace(".",","),o.devise&&o.devise!=="EUR"?String(o.montantOrigine).replace(".",",")+" "+o.devise:"",compte(o.compteId)?.nom||"",compte(o.compteDestId)?.nom||"",reserve(o.reserveId)?.nom||"",o.personne||"",o.note||"",o.pointe?"oui":""]));
    telecharger(`operations_${aujourdhui()}.csv`,"﻿"+lignes.map(l=>l.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n"),"text/csv;charset=utf-8");
  }
  else if(a==="sync") vueSync();
  else if(a==="envoyer") envoyer();
  else if(a==="taux-maj") majTaux(true);
  else if(a==="taux-app") majTauxApp();
  else if(a.startsWith("moi:")){ const p=a.slice(4); lsSet("moi",p); fermerModal(); rendu(); if(p) toast("Bonjour "+p+" !"); }
  else if(a.startsWith("cal-")){ const [k,v]=[a.slice(4,a.indexOf(":")),a.slice(a.indexOf(":")+1)];
    if(k==="vue"){ calVue=v; lsSet("calVue",v); } else if(k==="h"){ calHorizon=v; lsSet("calHorizon",v); }
    else if(k==="m"){ calMois=v==="0"?moisCourant():decaleMois(calMois,+v); calJour=calMois===moisCourant()?aujourdhui():calMois+"-01"; }
    else if(k==="jour"){ calJour=v; }
    rendu(); }
  else if(a==="credit-new") formCredit(null);
  else if(a==="env-new") formEnv(null);
  else if(a==="env-plan") enveloppesDepuisPlan();
  else if(a.startsWith("credit-suivre:")){ const r=rec(a.slice(14)); if(r) formCredit(null,r); }
  else if(a.startsWith("confirmer:")){ const [rid,cle]=a.slice(10).split("|"); const o=D.operations.find(z=>z.id===`auto_${rid}_${cle}`);
    definirEcheance(rid,cle,{statut:"payee"},`Échéance du ${o?dateCourte(o.date):cle} confirmée payée`,"Prélèvement confirmé"); }
  else if(a.startsWith("ops-compte:")){ filtres.compte=a.slice(11); if(filtres.compte) filtres.mois=""; tab="ops"; window.scrollTo(0,0); rendu(); }
  else if(a.startsWith("restaurer:")) restaurer(+a.slice(10));
  else if(a==="sauver"){ toast(sauvegarder("Sauvegarde faite à la main")?"Sauvegarde faite":"Mémoire pleine : sauvegarde impossible"); rendu(); }
  else if(a==="commencer"){ D.local.accueil=false; enregistrer(); rendu(); toast("C'est parti, "+moi()+" !"); }}

document.addEventListener("submit",e=>{ if(e.target.id!=="f-foyer") return; e.preventDefault(); creerFoyer(e.target.p1.value,e.target.p2.value); });
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-edit],[data-compte],[data-reserve],[data-cat],[data-recur],[data-pointe],[data-fiche],[data-echeance],[data-env]");
  if(!t) return;
  if(t.dataset.pointe!==undefined){ e.stopPropagation(); const id=t.dataset.pointe, v=t.checked; modifier(d=>{ const o=d.operations.find(z=>z.id===id); if(o) o.pointe=v; }); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; lsSet("tab",tab); window.scrollTo(0,0); rendu(); }
  else if(t.dataset.act) action(t.dataset.act);
  else if(t.dataset.edit) formOperation(D.operations.find(o=>o.id===t.dataset.edit));
  else if(t.dataset.compte) formCompte(compte(t.dataset.compte));
  else if(t.dataset.reserve) formReserve(reserve(t.dataset.reserve));
  else if(t.dataset.cat) formCategorie(cat(t.dataset.cat));
  else if(t.dataset.recur) formRecurrente(D.recurrentes.find(r=>r.id===t.dataset.recur));
  else if(t.dataset.fiche){ const r=rec(t.dataset.fiche); if(r) ficheRecurrente(r); }
  else if(t.dataset.echeance){ const [rid,cle]=t.dataset.echeance.split("|"); echeanceActions(rid,cle); }
  else if(t.dataset.env){ const v=D.enveloppes.find(x=>x.id===t.dataset.env); if(v) ficheEnv(v); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="moi"){ lsSet("moi",t.value); toast("Bonjour "+t.value+" !"); }
  else if(t.id==="taille-texte"){ lsSet("tailleTexte",t.value); appliquerTaille(); }
  else if(t.dataset.filtre && t.dataset.filtre!=="q"){ filtres[t.dataset.filtre]=t.value; rendu(); }
  else if(t.dataset.budget!==undefined){ const k=t.dataset.budget, v=t.value.trim()===""?"":r2(num(t.value)), m=mois;
    modifier(d=>{ if(!d.budgets[m]) d.budgets[m]={...budgetDu(m).b}; d.budgets[m][k]=v; }); }
  else if(t.id==="cal-filtre"){ calFiltre=t.value; rendu(); }
  else if(t.id==="tri-budget"){ lsSet("triBudget",t.value); rendu(); }
  else if(t.dataset.taux!==undefined){ const dv=t.dataset.taux||"CHF", v=num(t.value);
    if(v>0) modifier(d=>{ d.reglages.taux={...(d.reglages.taux||{CHF:d.reglages.tauxCHF}), [dv]:v}; if(dv==="CHF") d.reglages.tauxCHF=v; d.reglages.tauxLe=aujourdhui(); d.reglages.tauxSource="manuel"; },"Taux enregistré"); else rendu(); }
  else if(t.id==="devise-principale"){ lsSet("devisePrincipale",t.value); rendu(); toast("Totaux affichés en "+t.value); }
  else if(t.dataset.recevoir!==undefined && t.files[0]) recevoirFichier(t.files[0]);
});
let tq; document.addEventListener("input",e=>{ if(e.target.dataset.filtre==="q"){ filtres.q=e.target.value; clearTimeout(tq); tq=setTimeout(()=>{ const pos=e.target.selectionStart; rendu(); const s=document.querySelector('[data-filtre="q"]'); s.focus(); s.setSelectionRange(pos,pos); },250); } });
/* Accessibilité : les lignes et cases cliquables deviennent utilisables au clavier et annoncées comme des boutons. */
const SEL_CLIC="[data-act],[data-tab],[data-edit],[data-env],[data-fiche],[data-echeance],[data-compte],[data-reserve],[data-cat],[data-recur]";
function rendreAccessible(){
  document.querySelectorAll(SEL_CLIC).forEach(el=>{ if(/^(BUTTON|A|INPUT|SELECT|TEXTAREA|LABEL|OPTION)$/.test(el.tagName)||el.hasAttribute("tabindex")) return;
    el.setAttribute("tabindex","0"); el.setAttribute("role","button"); });
}
new MutationObserver(()=>{ clearTimeout(rendreAccessible.t); rendreAccessible.t=setTimeout(rendreAccessible,30); }).observe(document.body,{childList:true,subtree:true});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute?.("role")==="button"&&e.target.tagName!=="BUTTON"){ e.preventDefault(); e.target.click(); } });
const TAILLES_TEXTE=[["1","Normale"],["1.12","Grande"],["1.25","Très grande"]];
function appliquerTaille(){ const z=lsGet("tailleTexte")||"1"; document.body.style.zoom = z==="1" ? "" : z; }
appliquerTaille();
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fermerModal(); if(e.key==="Enter"&&e.target.classList?.contains("inl")){ e.target.blur(); } });
document.getElementById("fab").onclick=()=>formRapide();

try{ charger(); sauvegardeAuto(); fixerPrenoms(); rendu(); reclasserAnciennesCategories();
  verifierQui(); }
catch(e){ console.error(e); document.getElementById("main").innerHTML=`<div class="card empty"><h2>Erreur de lecture des données</h2><p>${h(e.message)}</p></div>`; }
// Fonctionnement hors connexion + demande de conservation durable des données
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(console.error);
if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
</script>
