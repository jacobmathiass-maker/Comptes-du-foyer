<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface2:#f0f2ee; --line:#e1e4dd; --text:#1d2420; --muted:#68736c;
  --accent:#1f6f5c; --accent-soft:#dcefe8; --accent-text:#ffffff;
  --good:#1e7a46; --good-soft:#e1f3e8; --bad:#b9382f; --bad-soft:#fbe6e3; --warn:#a86a00; --warn-soft:#fff1d6;

}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --surface:#1b201d; --surface2:#232a26; --line:#2e3631; --text:#e7ece8; --muted:#97a39b;
    --accent:#4fb596; --accent-soft:#1f3a31; --accent-text:#0d1512;
    --good:#5cc98a; --good-soft:#1b3326; --bad:#f07a6f; --bad-soft:#3a201d; --warn:#f0b54a; --warn-soft:#3a2e15;
    --p1:#6ea4ea; --p2:#ea8db1; --p3:#9aa89f; --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}

.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.err i{background:var(--bad)} .sync.wait i{background:var(--warn)}

main{max-width:1180px;margin:0 auto;padding:16px 16px 100px}
h2{font-size:20px;margin:0}

.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}

@media (max-width:640px){.g2,.g3{grid-template-columns:1fr} .g4{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}

@media (max-width:640px){.kpi .val{font-size:19px}.card{padding:12px} th,td{padding:6px 3px;font-size:12.5px} th{font-size:10.5px} main{padding:12px 10px 100px}}

table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}

.scroll{overflow-x:auto}

.list .day{font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize;padding:14px 4px 6px;display:flex;justify-content:space-between}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.calg .c.vide{visibility:hidden}
.calg .c.auj{border:2px solid var(--accent)}
.calg .c.sel{background:var(--surface2);box-shadow:0 0 0 2px var(--accent) inset}
.calg .c.neg{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.calg .c .d{font-size:12px;font-weight:700}
.calg .c .pts{display:flex;gap:2px;flex-wrap:wrap}
.calg .c .pts i{width:6px;height:6px;border-radius:50%;display:block}
.calg .c .mt{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.kcal{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff;vertical-align:1px}
.raccourci{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;font-size:12px;font-weight:600}
.raccourci span{font-size:20px;line-height:1}
.chips button{border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button.on{border-color:var(--accent);background:var(--surface2)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;font-size:18px;background:var(--surface2);display:grid;place-items:center;padding:0}
.swatches button.on{border-color:var(--text)}
.acc.clic{cursor:pointer}
svg text{fill:var(--muted);font-size:11px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:2px}
.welcome{max-width:560px;margin:10px auto}
.welcome h2{font-size:24px;margin-bottom:6px}
.steps{margin:0;padding-left:20px} .steps li{margin-bottom:8px}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:12px}
.choice b{display:block;font-size:15px} .choice span{font-size:13px;color:var(--muted);font-weight:400}
.btn.pri.choice span{color:inherit;opacity:.85}
/* ---- Version simplifiée ---- */
.top-in{padding:10px 16px}
main{padding-bottom:150px;max-width:720px}
main.large{max-width:1180px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;max-width:150px;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}

.fab{bottom:calc(78px + env(safe-area-inset-bottom))}
.hero-big{text-align:center;padding:22px 18px 18px;border:0;color:var(--accent-text);background:var(--accent)}
.hero-big.warn{background:var(--warn)} .hero-big.bad{background:var(--bad)}
.hero-big .lbl{font-size:15px;font-weight:600;opacity:.9}
.hero-big .val{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.hero-big .sub{font-size:14px;opacity:.9}
.gauge{height:12px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin:16px 0 6px}

.gauge-txt{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.gbar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}

.gbar i.warn{background:var(--warn)} .gbar i.bad{background:var(--bad)}
.lines .l{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lines .l:last-child{border-bottom:0} .lines .l.t{font-weight:800}
.stack>*+*{margin-top:14px}
.quick-amt{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.quick-amt input{flex:1;min-width:0;font-size:34px;font-weight:800;text-align:center;padding:8px;border:2px solid var(--accent);border-radius:14px;background:var(--surface)}

.quick-amt button{font-size:17px;font-weight:700;width:66px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.field-simple{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

<header class="top">
  <div class="top-in">
    <div class="brand"><img class="logo" src="icone-192.png" alt="">Budget Cocon</div>
    <button class="btn sm" id="btn-sync" data-act="sync">⇄ Synchroniser <span class="badge" id="badge" hidden></span></button>
  </div>
</header>
<main id="main"><div class="empty">Chargement…</div></main>
<button class="fab" id="fab" title="Ajouter une dépense ou une rentrée d'argent" aria-label="Ajouter une dépense ou une rentrée d'argent">+</button>
<nav class="bottom" id="tabs"></nav>
<div id="modal-root"></div>

<script>
"use strict";
/* ============================================================
   Données : enregistrées UNIQUEMENT sur cet appareil (téléphone / navigateur).
   Synchronisation : par fichier échangé entre les appareils, fusionné sans doublon.
   ============================================================ */
let D = null;
const CLE = "cdf_donnees";
const COLL = ["categories","comptes","reserves","recurrentes","operations","enveloppes"];
const TABS = [["accueil","🏠","Accueil"],["ops","🧾","Historique"],["monbudget","📋","Mon budget"],["plus","☰","Plus"]];
const SOUS_PLUS = {convert:"Convertisseur", bord:"Analyse détaillée", budgets:"Budgets", budget:"Plan mensuel par catégorie", comptes:"Comptes & épargne", credits:"Crédits", calendrier:"Calendrier", reglages:"Réglages", apropos:"Aide et confidentialité"};
let tab = "accueil";
let mois = moisCourant();
let filtres = {mois: moisCourant(), type:"", cat:"", pers:"", compte:"", q:""};

function lsGet(k){ try{ return localStorage.getItem("cdf_"+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem("cdf_"+k,v); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function moisCourant(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function aujourdhui(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function decaleMois(m,n){ let [y,mo]=m.split("-").map(Number); mo+=n; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return y+"-"+String(mo).padStart(2,"0"); }
function nomMois(m){ const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); }
function nomMoisCourt(m){ const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("fr-FR",{month:"short"}).replace(".",""); }
function joursDansMois(m){ const [y,mo]=m.split("-").map(Number); return new Date(y,mo,0).getDate(); }
const fmtE = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const fmtC = new Intl.NumberFormat("fr-CH",{style:"currency",currency:"CHF"});
function eur(v){ return fmtE.format(Math.round((v||0)*100)/100); }
function chf(v){ return fmtC.format(Math.round((v||0)*100)/100); }
/* ---------- Devises ----------
   Chaque montant est gardé dans sa devise d'origine (montantOrigine) ET en euros au taux du jour de la saisie (montant).
   Un compte a sa propre devise : son solde est calculé dans cette devise.
   Les totaux de plusieurs comptes sont toujours convertis avant d'être additionnés. */
const DEVISES=[["EUR","€ Euro","€"],["CHF","CHF Franc suisse","CHF"],["USD","$ Dollar américain","$"],["GBP","£ Livre sterling","£"]];
const DEVISES_OPT=DEVISES.map(d=>[d[0],d[1]]);
const FMT={};
function fmt(v,dev="EUR"){ dev ||= "EUR"; FMT[dev] ||= new Intl.NumberFormat(dev==="CHF"?"fr-CH":"fr-FR",{style:"currency",currency:dev}); return FMT[dev].format(Math.round((v||0)*100)/100); }
function symbole(dev){ return DEVISES.find(d=>d[0]===dev)?.[2]||"€"; }
function deviseSuivante(dev){ const i=DEVISES.findIndex(d=>d[0]===dev); return DEVISES[(i+1)%DEVISES.length][0]; }
// Valeur de 1 unité de la devise, en euros (taux de l'application, mis à jour depuis Internet ou à la main).
function tauxDe(dev){ if(!dev||dev==="EUR") return 1; const t=D.reglages.taux?.[dev] ?? (dev==="CHF"?D.reglages.tauxCHF:null); return t>0?t:1; }
function convertir(v,de,vers){ de ||= "EUR"; vers ||= "EUR"; return de===vers ? v : v*tauxDe(de)/tauxDe(vers); }
function deviseCompte(c){ return c?.devise||"EUR"; }
function fmtCompte(v,c){ return fmt(v,deviseCompte(c)); }
// Devise d'affichage des totaux, choisie sur chaque téléphone.
function dp(){ const d=lsGet("devisePrincipale"); return DEVISES.some(x=>x[0]===d)?d:"EUR"; }
function fmtP(v){ return fmt(v,dp()); }
function montantOp(o){ return o.devise&&o.devise!=="EUR" ? o.montantOrigine : o.montant; }
function fmtOp(o){ return fmt(montantOp(o),o.devise); }
// Montant d'une opération exprimé dans la devise d'un compte.
function enCompte(o,c){ const dc=deviseCompte(c), dop=o.devise||"EUR";
  if(o.type==="virement" && o.montantDest!=null && c && c.id===o.compteDestId) return num(o.montantDest); // change : montant reçu
  if(dop===dc) return dop==="EUR" ? o.montant : num(o.montantOrigine ?? o.montant);
  if(dc==="EUR") return o.montant;
  const k=o.conv?.[c.id]; if(k && k.dev===dc && k.de===o.montant) return k.v; // conversion figée le jour de la saisie
  return convertir(o.montant,"EUR",dc); }
// Une opération dans une autre devise que son compte : on fige sa valeur dans la devise du compte,
// pour que le solde ne bouge pas quand le taux change ensuite. (Pas pour les opérations prévues automatiquement.)
function figerConversions(d){
  for(const o of d.operations){ if(String(o.id).startsWith("auto_")&&o.maj===1) continue;
    for(const cid of [o.compteId, o.type==="virement"?o.compteDestId:""]){ const c=cid&&d.comptes.find(z=>z.id===cid); if(!c) continue;
      const dc=deviseCompte(c); if(dc==="EUR"||(o.devise||"EUR")===dc) continue;
      const k=o.conv?.[cid]; if(k && k.dev===dc && k.de===o.montant) continue;
      o.conv={...(o.conv||{}), [cid]:{dev:dc, de:o.montant, v:r2(convertir(o.montant,"EUR",dc))}}; } } }
function r2(v){ return Math.round((+v||0)*100)/100; }
function h(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(s){ if(typeof s==="number") return s; s=String(s||"").replace(/\s/g,"").replace(",","."); const v=parseFloat(s); return isNaN(v)?0:v; }

// Les prénoms du foyer sont saisis au premier lancement (ou reçus avec le fichier de l'autre téléphone) :
// ils sont dans les données (D.reglages.personnes), pas dans le code.
// Anciens fichiers : « Jacob », « Personne 1 », « Personne 2 » sont remplacés une seule fois par les vrais prénoms.
const ANCIENS_NOMS={"Jacob":0,"Personne 1":0,"Personne 2":1};
const FOYER_D_ORIGINE=["Mathias","Melina"]; // premier foyer utilisateur : sert seulement à corriger ses anciens fichiers
function fixerPrenoms(){
  const vieux=n=>Object.prototype.hasOwnProperty.call(ANCIENS_NOMS,n||"");
  const pers=D.reglages.personnes||[], ops=[...D.operations,...D.recurrentes];
  const ancien = pers.some(vieux) || ops.some(o=>vieux(o.personne)||/(^|[^\p{L}])Jacob(?![\p{L}\d])/u.test(o.libelle||"")) || D.comptes.some(c=>vieux(c.proprietaire)||/(^|[^\p{L}])Jacob(?![\p{L}\d])/u.test(c.nom||""));
  if(!ancien) return;
  const cible=[0,1].map(i=>pers[i]&&!vieux(pers[i])?pers[i]:FOYER_D_ORIGINE[i]);
  const corr={}; for(const [a,i] of Object.entries(ANCIENS_NOMS)) corr[a]=cible[i];
  const res=Object.keys(corr).map(a=>[new RegExp("(^|[^\\p{L}])"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\p{L}\\d])","gu"),corr[a]]);
  const tx=v0=>{ let v=v0; for(const [re,nv] of res) v=v.replace(re,"$1"+nv); return v; };
  modifier(d=>{
    d.reglages.personnes=cible;
    for(const o of [...d.operations,...d.recurrentes]){ if(corr[o.personne]) o.personne=corr[o.personne]; if(o.libelle) o.libelle=tx(o.libelle); }
    for(const c of d.comptes){ if(corr[c.proprietaire]) c.proprietaire=corr[c.proprietaire]; c.nom=tx(c.nom); }
  });
  if(corr[lsGet("moi")]) lsSet("moi",corr[lsGet("moi")]);
}

function catDefaut([id,nom,type,icone]){ return {id,nom,type,icone,maj:1}; }
// Ajoute les catégories par défaut manquantes (sauf si supprimées exprès) et range tout dans l'ordre ci-dessus.
// Pas de date de modification : c'est identique sur les deux téléphones, donc pas de conflit.
function completerCategories(){
  const parId=new Map(D.categories.map(c=>[c.id,c])), rang=new Map(CATS_DEFAUT.map((c,i)=>[c[0],i]));
  for(const c of CATS_DEFAUT){
    const x=parId.get(c[0]);
    if(!x){ if(!D.supprimes[c[0]]) D.categories.push(catDefaut(c)); }
    else if(x.maj===1 && (x.nom!==c[1]||x.icone!==c[3])){ x.nom=c[1]; x.icone=c[3]; } // jamais modifiée à la main : prend le nouveau nom
  }
  D.categories.sort((a,b)=>(rang.get(a.id)??999)-(rang.get(b.id)??999));
}
// Une seule fois par téléphone : range dans les nouvelles catégories ce qui était dans Logement / Abonnements.
function reclasserAnciennesCategories(){
  if(D.local.reclasse1 || !D.recurrentes.length) return;
  const regles=[[/eau/i,"logement","eau"],[/spotify|netflix|disney|canal|deezer|prime video/i,"abonnements","audiovisuel"],
                [/box internet|internet|t[ée]l[ée]phone|mobile|forfait/i,"abonnements","internet"],
                [/[ée]lectricit|edf|engie/i,"logement","electricite"]];
  const a_changer=D.recurrentes.filter(r=>regles.some(([re,de])=>r.categorieId===de&&re.test(r.libelle)));
  D.local.reclasse1=true;
  if(!a_changer.length){ enregistrer(); return; }
  modifier(d=>{
    for(const r of d.recurrentes){ const g=regles.find(([re,de])=>r.categorieId===de&&re.test(r.libelle)); if(g) r.categorieId=g[2]; }
    // Budget de départ repris de l'Excel : on répartit aussi les montants prévus, s'ils n'ont pas été modifiés.
    const b=d.budgets["2026-11"];
    if(b && b.logement===1650 && b.abonnements===116.1 && b.eau==null && b.internet==null){
      Object.assign(b,{logement:1590,eau:60,abonnements:23,internet:71.97,audiovisuel:21.13});
    }
  });
}
function donneesInitiales(){
  const categories=CATS_DEFAUT.map(catDefaut);
  const comptes=[
    {id:"commun",nom:"Compte commun",proprietaire:"Commun",soldeInitial:0}
  ];
  const reserves=[
    {id:"urgence",nom:"Fonds d'urgence",objectif:0,soldeInitial:0},
    {id:"vacances",nom:"Vacances",objectif:0,soldeInitial:0},
    {id:"gros",nom:"Gros achats",objectif:0,soldeInitial:0},
    {id:"autres_res",nom:"Autres réserves",objectif:0,soldeInitial:0}
  ];
  // Données par défaut, identiques sur tous les appareils (maj:1 = "plus ancien que tout").
  for(const arr of [comptes,reserves]) arr.forEach(r=>r.maj=1);
  return {
    format:2,
    reglages:{personnes:[], tauxCHF:1.08}, reglagesMaj:1,
    categories, comptes, reserves, recurrentes:[], operations:[],
    budgets:{}, budgetsMaj:{}, supprimes:{},
    local:{accueil:true, dernierEnvoi:0, modifs:0}
  };
}

function normaliser(x){
  x.reglages ||= {personnes:[],tauxCHF:1}; x.reglages.personnes ||= [];
  for(const k of COLL) x[k] ||= [];
  x.budgets ||= {}; x.budgetsMaj ||= {}; x.supprimes ||= {}; x.reglagesMaj ||= 0;
  return x;
}
function charger(){
  let s=null; try{ s=localStorage.getItem(CLE); }catch(e){}
  D = s ? JSON.parse(s) : donneesInitiales();
  normaliser(D); D.local ||= {dernierEnvoi:0, modifs:0};
  completerCategories();
  enregistrer();
}
/* ============================================================
   Sauvegardes automatiques (copies complètes gardées sur l'appareil)
   - une par jour, et une avant chaque mise à jour importante ou restauration
   - les 6 plus récentes sont gardées
   ============================================================ */
const CLE_SAUV="cdf_sauvegardes", NB_SAUV=6, VERSION_DONNEES=3;
function listeSauvegardes(){ try{ return JSON.parse(localStorage.getItem(CLE_SAUV)||"[]"); }catch(e){ return []; } }
function sauvegarder(raison){
  const {local,...donnees}=D;
  let l=listeSauvegardes(); l.unshift({le:new Date().toISOString(), raison, nb:D.operations.length, donnees:JSON.stringify(donnees)}); l=l.slice(0,NB_SAUV);
  while(l.length){ try{ localStorage.setItem(CLE_SAUV,JSON.stringify(l)); return true; }catch(e){ if(l.length===1) break; l.pop(); } }
  return false;
}
function sauvegardeAuto(){
  const l=listeSauvegardes();
  // Avant une mise à jour qui change la façon de lire les données
  if(+(lsGet("versionDonnees")||0)<VERSION_DONNEES){ if(D.operations.length||D.recurrentes.length) sauvegarder("Avant la mise à jour de l'application"); lsSet("versionDonnees",VERSION_DONNEES); return; }
  if(!l.length || l[0].le.slice(0,10)!==new Date().toISOString().slice(0,10)) if(D.operations.length||D.recurrentes.length) sauvegarder("Sauvegarde automatique du jour");
}
function restaurer(i){
  const sv=listeSauvegardes()[i]; if(!sv) return;
  const quand=new Date(sv.le).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"});
  if(!confirm(`Revenir aux comptes du ${quand} ?

Tout ce qui a été saisi depuis sera remplacé. (Une copie de l'état actuel est gardée avant, vous pourrez revenir en arrière.)`)) return;
  const x=normaliser(JSON.parse(sv.donnees));
  sauvegarder("Avant la restauration");
  // Un élément supprimé depuis la sauvegarde reçoit un nouvel identifiant,
  // sinon la suppression reviendrait à la prochaine synchronisation.
  const nv={};
  for(const k of COLL) for(const r of x[k]) if(D.supprimes[r.id] && !String(r.id).startsWith("auto_")){ nv[r.id]=uid(); r.id=nv[r.id]; }
  for(const k of COLL) x[k]=x[k].filter(r=>!D.supprimes[r.id]);
  const re=v=>nv[v]||v;
  for(const o of [...x.operations,...x.recurrentes]) ["recId","compteId","compteDestId","reserveId","categorieId"].forEach(f=>{ if(o[f]) o[f]=re(o[f]); });
  modifier(d=>{ for(const k of COLL) d[k]=x[k]; d.budgets=x.budgets; d.reglages=x.reglages; },"Comptes restaurés");
}
function enregistrer(){
  try{ localStorage.setItem(CLE, JSON.stringify(D)); }
  catch(e){ alert("Impossible d'enregistrer sur cet appareil (mémoire pleine ou navigation privée)."); }
  majBadge();
}
function majBadge(){ const b=document.getElementById("badge"); if(!b||!D) return; const n=D.local.modifs||0; b.hidden=!n; b.textContent=n; b.title=n+" modification(s) pas encore envoyée(s)"; }

/* Toute modification passe par modifier(fn). On compare avant/après pour dater
   précisément ce qui a changé (nécessaire pour fusionner deux appareils). */
function sansMaj(r){ const {maj,...x}=r; return JSON.stringify(x); }
function empreinte(){
  const e={budgets:new Map(), reglages:JSON.stringify(D.reglages)};
  for(const k of COLL) e[k]=new Map(D[k].map(r=>[r.id,sansMaj(r)]));
  for(const m in D.budgets) for(const k in D.budgets[m]) e.budgets.set(m+"|"+k, JSON.stringify(D.budgets[m][k]));
  return e;
}
function horodater(av){
  const t=Date.now(); let n=0;
  for(const k of COLL){
    const vus=new Set();
    for(const r of D[k]){ vus.add(r.id); if(av[k].get(r.id)!==sansMaj(r)){ r.maj=t; n++; } }
    av[k].forEach((_,id)=>{ if(!vus.has(id)){ D.supprimes[id]=t; n++; } });
  }
  for(const m in D.budgets) for(const k in D.budgets[m]){ const c=m+"|"+k; if(av.budgets.get(c)!==JSON.stringify(D.budgets[m][k])){ D.budgetsMaj[c]=t; n++; } }
  if(av.reglages!==JSON.stringify(D.reglages)){ D.reglagesMaj=t; n++; }
  return n;
}
function modifier(fn, msg){
  const avant=new Set(D.comptes.filter(c=>etatDecouvert(c)?.niv==="bad").map(c=>c.id));
  const envAv=pctEnveloppes();
  const av=empreinte(); fn(D); figerConversions(D);
  D.local.modifs=(D.local.modifs||0)+horodater(av);
  enregistrer(); rendu(); if(msg) toast(msg);
  const dep=D.comptes.filter(c=>!avant.has(c.id)&&etatDecouvert(c)?.niv==="bad");
  if(dep.length) setTimeout(()=>toast("🚨 "+dep.map(c=>c.nom).join(", ")+" : découvert autorisé dépassé"),msg?2300:0);
  const al=alertesEnveloppes(envAv);
  if(al.length) setTimeout(()=>toastLong(al.join("\n")),(msg?2300:0)+(dep.length?2300:0));
}

/* Fusion d'un fichier reçu : pour chaque élément, la version la plus récente gagne.
   Une suppression faite sur un appareil s'applique partout. */
function fusionner(x){
  normaliser(x); let n=0;
  for(const id in x.supprimes) if(!(D.supprimes[id]>=x.supprimes[id])){ if(!D.supprimes[id]) n++; D.supprimes[id]=x.supprimes[id]; }
  for(const k of COLL){
    const m=new Map(D[k].map(r=>[r.id,r]));
    for(const r of x[k]){ const a=m.get(r.id); if(!a || (r.maj||0)>(a.maj||0)){ if(!a||sansMaj(a)!==sansMaj(r)) n++; m.set(r.id,r); } }
    D[k]=[...m.values()].filter(r=>!D.supprimes[r.id]);
  }
  for(const c in x.budgetsMaj){
    if((x.budgetsMaj[c]||0)>(D.budgetsMaj[c]||0)){
      const i=c.indexOf("|"), m=c.slice(0,i), k=c.slice(i+1);
      (D.budgets[m] ||= {})[k]=x.budgets?.[m]?.[k] ?? ""; D.budgetsMaj[c]=x.budgetsMaj[c]; n++;
    }
  }
  if((x.reglagesMaj||0)>(D.reglagesMaj||0)){ D.reglages=x.reglages; D.reglagesMaj=x.reglagesMaj; n++; }
  D.local.accueil=false;
  completerCategories();
  enregistrer(); return n;
}
// Le fichier est préparé dès l'ouverture de la fenêtre « Synchroniser » : sur iPhone, le partage
// doit démarrer immédiatement au toucher du bouton, sans attente.
// Photos jointes : celles prises sur ce téléphone depuis le dernier envoi (ou toutes, si demandé).
let PREP=null;
async function preparerEnvoi(toutesLesPhotos){
  PREP=null;
  const photos=(await photoToutes().catch(()=>[])).filter(p=>toutesLesPhotos||(p.local&&p.cree>(D.local.dernierEnvoi||0))).map(({id,data,cree})=>({id,data,cree}));
  const {local,...donnees}=D;
  const contenu=JSON.stringify({app:"comptes-du-foyer",format:2,de:moi(),le:new Date().toISOString(),donnees,photos});
  const nom=`budget-cocon_${aujourdhui()}_${moi().replace(/[^\w-]/g,"")}.txt`; // .txt : accepté partout (WhatsApp, SMS, mail…)
  PREP={f:new File([contenu],nom,{type:"text/plain"}),contenu,nom,nbPhotos:photos.length,taille:contenu.length};
  return PREP;
}
async function envoyer(){
  if(!PREP) return;
  const {f,contenu,nom}=PREP;
  let ok=false;
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:"Budget Cocon"}); ok=true; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  if(!ok){ telecharger(nom,contenu,"text/plain"); ok=true; }
  D.local.dernierEnvoi=Date.now(); D.local.modifs=0; enregistrer(); fermerModal(); toast("Fichier prêt à être reçu par l'autre téléphone");
}
function recevoirFichier(fichier){
  const fr=new FileReader();
  fr.onload=async()=>{
    let x; try{ x=JSON.parse(fr.result); }catch(e){ alert("Ce fichier n'est pas un fichier « Budget Cocon »."); return; }
    const donnees = x.app==="comptes-du-foyer" ? x.donnees : (x.operations&&x.categories ? x : null);
    if(!donnees){ alert("Ce fichier n'est pas un fichier « Budget Cocon »."); return; }
    const n=fusionner(donnees); fermerModal(); fixerPrenoms(); rendu(); reclasserAnciennesCategories(); verifierQui();
    let np=0;
    for(const p of (Array.isArray(x.photos)?x.photos:[])){
      try{ if(p?.id && typeof p.data==="string" && p.data.startsWith("data:image/") && !(await photoGet(p.id))){ await photoPut({id:p.id,data:p.data,cree:p.cree||Date.now(),local:false}); np++; } }catch(e){}
    }
    const txt=[n?`${n} nouveauté(s)`:"", np?`${np} photo(s) de ticket`:""].filter(Boolean).join(" et ");
    toast(txt ? `Synchronisé : ${txt} reçue(s)${x.de?" de "+x.de:""}` : "Déjà à jour, rien de nouveau");
  };
  fr.readAsText(fichier);
}
function renommerPersonne(d,i,nv){
  const ancien=d.reglages.personnes[i]; d.reglages.personnes[i]=nv;
  for(const arr of [d.operations,d.recurrentes]) arr.forEach(o=>{ if(o.personne===ancien) o.personne=nv; });
  d.comptes.forEach(c=>{ if(c.proprietaire===ancien) c.proprietaire=nv; if(c.nom==="Compte de "+ancien) c.nom="Compte de "+nv; });
  if(lsGet("moi")===ancien) lsSet("moi",nv);
}

/* ============================================================
   Calculs
   ============================================================ */
const PERS_COMMUN="Commun";
function personnes(){ return D.reglages.personnes||[]; }
function persOptions(){ return [...personnes(), PERS_COMMUN]; }
function moi(){ const m=lsGet("moi"); return persOptions().includes(m)?m:personnes()[0]; }
function cat(id){ return D.categories.find(c=>c.id===id); }
function compte(id){ return D.comptes.find(c=>c.id===id); }
/* ---------- Comptes : type, couleur, icône, archivage, inclusion dans le reste à vivre ---------- */
const TYPES_COMPTE=[["courant","Compte courant","🏦"],["commun","Compte commun","👫"],["perso","Compte personnel","👤"],["epargne","Compte épargne","🐷"],["pro","Compte professionnel","💼"],["especes","Espèces","💵"],["autre","Autre compte","📁"]];
const COULEURS_COMPTE=["#2f6db5","#c2577f","#2f7d5b","#c2410c","#8b5cf6","#0e7490","#a16207","#64748b"];
const ICONES_COMPTE=["🏦","👫","👤","🐷","💼","💵","💳","🏠","🚗","🎓","✈️","⭐"];
function typeCompte(c){ return c?.typeCompte || (c?.proprietaire===PERS_COMMUN||c?.id==="commun" ? "commun" : "perso"); }
function nomTypeCompte(c){ return TYPES_COMPTE.find(t=>t[0]===typeCompte(c))?.[1]||"Compte"; }
function iconeCompte(c){ return c?.icone || TYPES_COMPTE.find(t=>t[0]===typeCompte(c))?.[2] || "🏦"; }
function couleurCompte(c){ const ps=personnes(); return c?.couleur || (c?.proprietaire&&c.proprietaire===ps[0]?"var(--p1)":c?.proprietaire&&c.proprietaire===ps[1]?"var(--p2)":"var(--p3)"); }
// Un compte épargne n'est pas compté dans le reste à vivre, sauf si on le demande.
function inclusTotal(c){ return !c.archive && (c.inclus ?? typeCompte(c)!=="epargne"); }
// Comptes proposés dans les formulaires (les archivés sont cachés, sauf celui déjà choisi).
function comptesVisibles(garder){ return D.comptes.filter(c=>!c.archive||c.id===garder); }
function optComptes(garder){ return comptesVisibles(garder).map(c=>[c.id,c.nom]); }
function pastille(c,taille){ return `<span class="pastille" style="background:${couleurCompte(c)}22;border:2px solid ${couleurCompte(c)}${taille?`;width:${taille}px;height:${taille}px;font-size:${taille/2}px`:""}">${iconeCompte(c)}</span>`; }
function reserve(id){ return D.reserves.find(c=>c.id===id); }
function catsDe(type){ return D.categories.filter(c=>type==="depense"?(c.type==="fixe"||c.type==="variable"):c.type===type); }
function versEur(montant,devise){ return r2(montant*tauxDe(devise)); }
function opsDuMois(m){ return D.operations.filter(o=>o.date.slice(0,7)===m); }
function persClasse(p){ const i=personnes().indexOf(p); return i===0?"p0":i===1?"p1":""; }

function budgetDu(m){
  if(D.budgets[m]) return {b:D.budgets[m], herite:null};
  const anterieurs=Object.keys(D.budgets).filter(k=>k<m).sort();
  if(anterieurs.length){ const k=anterieurs[anterieurs.length-1]; return {b:D.budgets[k], herite:k}; }
  const posterieurs=Object.keys(D.budgets).sort();
  if(posterieurs.length) return {b:D.budgets[posterieurs[0]], herite:posterieurs[0]};
  return {b:{}, herite:null};
}
function impactNet(o){ // effet sur le "reste à vivre"
  if(o.type==="revenu") return o.montant;
  if(o.type==="depense") return -o.montant;
  if(o.type==="epargne") return -o.montant;
  if(o.type==="retrait") return o.montant;
  return 0;
}
function report(m){ let s=0; for(const o of D.operations) if(o.date.slice(0,7)<m) s+=impactNet(o); return r2(s); }
function statsMois(m){
  const ops=opsDuMois(m), parCat={}, parRes={}, parPers={};
  let rev=0, dep=0, epa=0;
  for(const o of ops){
    if(estAVenir(o)||!opComptee(o)||enAttente(o)) continue; // pas encore réalisé : ne consomme aucun budget
    if(o.type==="revenu"){ rev+=o.montant; parCat[o.categorieId]=(parCat[o.categorieId]||0)+o.montant; }
    else if(o.type==="depense"){ dep+=o.montant; parCat[o.categorieId]=(parCat[o.categorieId]||0)+o.montant; parPers[o.personne||PERS_COMMUN]=(parPers[o.personne||PERS_COMMUN]||0)+o.montant; }
    else if(o.type==="epargne"){ epa+=o.montant; parRes[o.reserveId]=(parRes[o.reserveId]||0)+o.montant; }
    else if(o.type==="retrait"){ epa-=o.montant; parRes[o.reserveId]=(parRes[o.reserveId]||0)-o.montant; }
  }
  return {rev:r2(rev),dep:r2(dep),epa:r2(epa),parCat,parRes,parPers,nb:ops.length};
}
/* ---------- Solde RÉEL et solde PRÉVU ----------
   Règles :
   - une opération ne compte dans le solde réel que si sa date est passée (ou aujourd'hui) ;
     une charge ou un revenu à venir n'est PAS encore déduit ni ajouté ;
   - si un solde a été indiqué « à la date du … », les opérations jusqu'à cette date sont déjà
     comptées par la banque : elles ne sont pas déduites une deuxième fois ;
   - un budget n'est jamais une dépense : seul ce qui est noté compte. */
function finMois(m=moisCourant()){ return m+"-"+String(joursDansMois(m)).padStart(2,"0"); }
function effetSur(o,id){ let v=0;
  if(o.compteId!==id && !(o.type==="virement" && o.compteDestId===id)) return 0;
  if(!opComptee(o)) return 0; // échéance suspendue, refusée ou annulée : rien ne bouge
  const m=enCompte(o,compte(id));
  if(o.compteId===id) v+= (o.type==="revenu"||o.type==="retrait") ? m : -m;
  if(o.type==="virement" && o.compteDestId===id) v+=m;
  return v; }
// Effet d'une opération sur plusieurs comptes, dans la devise d'affichage.
function effetP(o,cs){ return cs.reduce((x,c)=>x+convertir(effetSur(o,c.id),deviseCompte(c),dp()),0); }
function apresSolde(c,o){ if(!c?.soldeDate) return true; return o.date>c.soldeDate || (o.date===c.soldeDate && (o.cree||"")>(c.soldeLe||"")); }
function estAVenir(o){ return o.date>aujourdhui(); }
function soldeCompte(id, jusqua=aujourdhui()){
  const c=compte(id); let s=num(c?.soldeInitial);
  for(const o of D.operations){ if(o.date>jusqua||enAttente(o)) continue; const v=effetSur(o,id); if(v && apresSolde(c,o)) s+=v; }
  return r2(s);
}
// Évolution prévue d'un compte jusqu'à une date : solde final et point le plus bas (jour par jour).
function projection(id, jusqua=finMois()){
  const c=compte(id), auj=aujourdhui(); let s=soldeCompte(id), min=s, dMin=null, cause=null;
  // les prélèvements « à confirmer » sont comptés dans le prévu, comme s'ils passaient aujourd'hui
  const parJour={}; for(const o of D.operations){ const att=enAttente(o); if(!att&&(o.date<=auj||o.date>jusqua)) continue; const v=effetSur(o,id); if(v&&apresSolde(c,o)) (parJour[att?auj+"~":o.date] ||= []).push([o,v]); }
  for(const d of Object.keys(parJour).sort()){ for(const [,v] of parJour[d]) s+=v;
    if(s<min-0.004){ min=s; dMin=d.slice(0,10); cause=parJour[d].filter(([,v])=>v<0).sort((a,b)=>a[1]-b[1])[0]?.[0]||null; } }
  return {fin:r2(s), min:r2(min), dateMin:dMin, cause};
}
// Les comptes pris en compte dans le reste à vivre (choisis dans Comptes ; les archivés et l'épargne sont exclus par défaut).
function comptesActifs(){ return D.comptes.filter(inclusTotal); }
function situation(){
  const cs=comptesActifs(), ids=new Set(cs.map(c=>c.id)), auj=aujourdhui(), fin=finMois();
  const enP=(v,c)=>convertir(v,deviseCompte(c),dp());
  const reel=r2(cs.reduce((a,c)=>a+enP(soldeCompte(c.id),c),0)), prevu=r2(cs.reduce((a,c)=>a+enP(projection(c.id,fin).fin,c),0));
  const plusieursDevises=new Set(cs.map(deviseCompte).concat(dp())).size>1;
  // à venir d'ici la fin du mois (les virements entre deux comptes suivis s'annulent)
  const venir=D.operations.filter(o=>((o.date>auj&&o.date<=fin)||enAttente(o))&&cs.some(c=>effetSur(o,c.id)&&apresSolde(c,o))&&!(o.type==="virement"&&ids.has(o.compteId)&&ids.has(o.compteDestId)))
    .sort((a,b)=>a.date.localeCompare(b.date));
  const entrees=r2(venir.reduce((a,o)=>a+Math.max(0,effetP(o,cs)),0));
  const sorties=r2(venir.reduce((a,o)=>a+Math.max(0,-effetP(o,cs)),0));
  const soldeIndique=cs.some(c=>c.soldeDate||num(c.soldeInitial)!==0);
  return {reel, prevu, venir, entrees, sorties, soldeIndique, plusieursDevises, prochainRevenu:prochainRevenu()};
}
function prochainRevenu(){
  const auj=aujourdhui();
  const o=D.operations.filter(o=>o.type==="revenu"&&o.date>auj&&opComptee(o)).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(o) return {libelle:libelleOp(o), date:o.date, montant:o.montant};
  // sinon : le premier revenu de Mon budget le mois prochain
  const l=D.recurrentes.filter(r=>r.actif&&r.type==="revenu").map(r=>[r,echeancesDe(r,2).find(x=>x.date>auj&&!STATUTS_EXCLUS.includes(x.statut))]).filter(x=>x[1]).sort((a,b)=>a[1].date.localeCompare(b[1].date));
  return l.length ? {libelle:l[0][0].libelle, date:l[0][1].date, montant:versEur(l[0][1].montant,l[0][0].devise)} : null;
}
function dateCourte(d){ return new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }
function soldeReserve(id){
  const r=reserve(id); let s=num(r?.soldeInitial);
  for(const o of D.operations){ if(o.reserveId===id){ if(o.type==="epargne") s+=o.montant; if(o.type==="retrait") s-=o.montant; } }
  return r2(s);
}

  </div>
  <div class="grid g2" style="margin-top:16px">

function iconeOp(o){
  if(o.type==="virement") return "🔁"; if(o.type==="epargne") return "🐷"; if(o.type==="retrait") return "💸";

}
function libelleOp(o){
  if(o.libelle) return o.libelle;
  if(o.type==="virement") return "Virement"; if(o.type==="epargne") return "Épargne → "+(reserve(o.reserveId)?.nom||""); if(o.type==="retrait") return "Retrait de "+(reserve(o.reserveId)?.nom||"");

}
function detailOp(o){

  else { if(cat(o.categorieId)&&o.libelle) parts.push(cat(o.categorieId).nom); if(o.type==="epargne"&&o.libelle) parts.push(reserve(o.reserveId)?.nom||""); parts.push(compte(o.compteId)?.nom||""); }

/* ---------- Revenus et charges fixes : comptés automatiquement ----------
   Chaque échéance a un identifiant fixe auto_<charge>_<clé> (clé = mois, ou date pour l'hebdomadaire) :
   les deux téléphones créent la même opération, jamais de doublon.
   maj:1 => une modification faite à la main sur l'opération gagne toujours.
   Une échéance peut avoir son propre statut, sa date ou son montant (r.exceptions[clé]) sans toucher aux autres. */
const FREQ=[["mensuel","Chaque mois"],["hebdo","Chaque semaine"],["trimestriel","Tous les 3 mois"],["semestriel","Tous les 6 mois"],["annuel","Chaque année"],["perso","Personnalisée (tous les … mois)"]];
const STATUTS={avenir:["À venir","⏳",""],attente:["À confirmer","❓","warn"],payee:["Payée","✅","good"],reportee:["Reportée","↪️","warn"],suspendue:["Suspendue ce mois-ci","⏸️",""],refusee:["Prélèvement refusé","⛔","bad"],annulee:["Annulée","🚫",""],reportee_fin:["Reportée en fin de crédit","⏭️","warn"]};
const STATUTS_EXCLUS=["suspendue","refusee","annulee","reportee_fin"];
const pad2=n=>String(n).padStart(2,"0");
function moisEntre(a,b){ const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); }
function rec(id){ return D.recurrentes.find(r=>r.id===id); }
function pasMois(r){ return ({mensuel:1,trimestriel:3,semestriel:6,annuel:12,perso:Math.max(1,Math.round(r.tousLes||1))})[r.frequence||"mensuel"]||1; }
function montantMensuel(r){ if(estCredit(r)&&etatCredit(r).termine) return 0; const e=versEur(r.montant,r.devise); return r.frequence==="hebdo" ? r2(e*52/12) : r2(e/pasMois(r)); }
function texteFrequence(r){
  if(r.frequence==="hebdo") return "chaque "+new Date((r.debut||aujourdhui())+"T12:00").toLocaleDateString("fr-FR",{weekday:"long"});
  const p=pasMois(r), j=`le ${r.jour||1}`;
  return p===1 ? `${j} du mois` : p===12 ? `chaque année, ${j} ${new Date((r.debut||aujourdhui())+"T12:00").toLocaleDateString("fr-FR",{month:"long"})}` : `tous les ${p} mois, ${j}`;
}
/* ---------- Crédits ----------
   Un crédit est une charge mensuelle avec r.credit = {organisme, nbRestantes, nbTotal, capital, restantDu, taux, derniere}.
   nbRestantes = mensualités restantes à partir de r.debut (date du prochain prélèvement au moment de la saisie).
   Une mensualité suspendue, refusée ou reportée en fin de crédit n'est pas une mensualité payée :
   elle décale toutes les suivantes, donc la date de fin recule d'un mois.
   Les mensualités restantes ne diminuent qu'après confirmation du paiement (statut « payée »). */
const SAUT_CREDIT=["suspendue","refusee","reportee_fin"];
function estCredit(r){ return !!r?.credit; }
function echeancierCredit(r){
  const c=r.credit||{}, res=[]; if(!r.debut) return res;
  const N=Math.max(0,Math.round(num(c.nbRestantes))); let n=0, frais=0, m=r.debut.slice(0,7);
  for(let k=0;k<600&&n<N;k++,m=decaleMois(m,1)){
    const date=m+"-"+pad2(Math.min(r.jour||1,joursDansMois(m))); if(date<r.debut) continue;
    const e=r.exceptions?.[m]||{};
    if(SAUT_CREDIT.includes(e.statut)){ frais+=num(e.frais); res.push({cle:m,date,montant:num(r.montant),n:null}); continue; }
    n++; const mt=r2(((n===N&&num(c.derniere)>0)?num(c.derniere):num(r.montant))+frais); frais=0;
    res.push({cle:m,date,montant:mt,n});
  }
  return res;
}
function etatCredit(r){
  const c=r.credit||{}, sch=echeancierCredit(r), inst=sch.filter(x=>x.n), paye=x=>r.exceptions?.[x.cle]?.statut==="payee";
  const payees=inst.filter(paye), restantes=inst.length-payees.length, total=Math.round(num(c.nbTotal))||0;
  const avant= total ? Math.max(0,total-Math.round(num(c.nbRestantes))) : null;
  const reste=r2(inst.filter(x=>!paye(x)).reduce((a,x)=>a+x.montant,0));
  const prochaine=inst.find(x=>!paye(x))||null, derniere=inst[inst.length-1]||null;
  const termine=inst.length>0 && restantes===0;
  return {sch, inst, payees:payees.length, restantes, total, nbPayees: avant!=null?avant+payees.length:null,
    pct: total ? Math.min(100,(total-restantes)/total*100) : (inst.length?payees.length/inst.length*100:0),
    reste, prochaine, fin:derniere?.date||null, termine, dateFin: termine?(r.exceptions?.[derniere.cle]?.date||derniere.date):null,
    reports:Object.values(r.exceptions||{}).filter(e=>e.statut==="reportee"||e.statut==="reportee_fin").length};
}
function creditActif(r){ return estCredit(r) && r.actif && !etatCredit(r).termine; }
// Une charge « en cours » : active, et pas un crédit terminé.
function enCours(r){ return r.actif && !(estCredit(r) && etatCredit(r).termine); }
// Capital restant estimé (pour le simulateur) : d'après le restant dû indiqué, sinon d'après le taux.
function capitalRestant(r){
  const c=r.credit, i=num(c.taux)/1200, M=num(r.montant), e=etatCredit(r);
  if(num(c.restantDu)>0){ let C=num(c.restantDu); for(let k=0;k<e.payees;k++) C=C*(1+i)-M; return Math.max(0,r2(C)); }
  if(i>0) return r2(M*(1-Math.pow(1+i,-e.restantes))/i);
  return null;
}
function simulerAnticipe(r,X,mode){
  const c=r.credit, i=num(c.taux)/1200, M=num(r.montant), e=etatCredit(r), C=capitalRestant(r);
  if(!(i>0)||C==null) return {impossible:true};
  // frais de report en attente : dus dans tous les cas, ils ne sont pas une économie
  const base=e.inst.filter(x=>r.exceptions?.[x.cle]?.statut!=="payee").reduce((a,x)=>a+((x.n===e.inst.length&&num(c.derniere)>0)?num(c.derniere):M),0);
  const frais=Math.max(0,r2(e.reste-base)), C2=Math.max(0,C-X), avant=e.reste;
  if(mode==="duree"){ let b=C2, tot=0, mois=0; while(b>0.005&&mois<1000){ const it=b*i, pay=Math.min(M,b+it); b=b+it-pay; tot+=pay; mois++; }
    return {C, C2, avant, apres:r2(X+tot+frais), economie:r2(avant-X-tot-frais), mois, moisGagnes:e.restantes-mois, mensualite:M}; }
  const n=e.restantes, M2= C2>0 ? C2*i/(1-Math.pow(1+i,-n)) : 0;
  return {C, C2, avant, apres:r2(X+M2*n+frais), economie:r2(avant-X-M2*n-frais), mois:n, moisGagnes:0, mensualite:r2(M2)};
}
// Échéances « de base » d'une charge dans un mois : [{cle, date}]
function occurrencesMois(r,m){
  if(estCredit(r)) return echeancierCredit(r).filter(x=>x.cle===m).map(x=>({cle:x.cle,date:x.date,montant:x.montant}));
  const deb=r.debut||"", fin=r.fin||"", res=[], dans=d=>(!deb||d>=deb)&&(!fin||d<=fin);
  if(r.frequence==="hebdo"){
    const a=new Date((deb||aujourdhui())+"T12:00");
    for(let j=1;j<=joursDansMois(m);j++){ const d=m+"-"+pad2(j), diff=Math.round((new Date(d+"T12:00")-a)/864e5); if(diff>=0&&diff%7===0&&dans(d)) res.push({cle:d,date:d}); }
    return res;
  }
  const p=pasMois(r);
  if(p>1){ const ref=(deb||m).slice(0,7), diff=moisEntre(ref,m); if(diff<0||diff%p) return res; }
  const d=m+"-"+pad2(Math.min(r.jour||1,joursDansMois(m)));

function moisDeCle(id){ return String(id).split("_").pop().slice(0,7); }
function opDeRec(r,oc,id){
  const e=r.exceptions?.[oc.cle]||{}, mt=e.montant!=null?e.montant:oc.montant!=null?oc.montant:r.montant;
  const x={id,cree:oc.cle.slice(0,7)+"-01",recId:r.id,type:r.type,date:e.date||oc.date,libelle:r.libelle,devise:r.devise,
    montant:versEur(mt,r.devise),montantOrigine:r.devise&&r.devise!=="EUR"?mt:null,
    categorieId:r.type==="epargne"?"":r.categorieId,compteId:r.compteId,compteDestId:"",
    reserveId:r.type==="epargne"?r.reserveId:"",personne:r.personne,note:"",pointe:false,maj:1};
  if(e.statut) x.statut=e.statut;
  return x;
}
// Crée (ou met à jour) les échéances du mois en cours.
function autoRecurrentes(){
  const m=moisCourant(), recs=new Map(D.recurrentes.map(r=>[r.id,r])); let ch=false;
  const attendues=new Map();
  for(const r of D.recurrentes){ if(!r.actif) continue; for(const oc of occurrencesMois(r,m)){ const id=`auto_${r.id}_${oc.cle}`; attendues.set(id,opDeRec(r,oc,id)); } }
  D.operations=D.operations.filter(o=>{
    if(!String(o.id).startsWith("auto_")||o.maj!==1||moisDeCle(o.id)!==m) return true; // les mois passés ne bougent plus
    const x=attendues.get(o.id); if(!x){ ch=true; return false; }
    if(sansMaj(x)!==sansMaj(o)){ Object.keys(o).forEach(k=>delete o[k]); Object.assign(o,x); ch=true; }
    return true;
  });
  const ids=new Set(D.operations.map(o=>o.id));
  // Ancien fonctionnement : une opération de la charge déjà notée à la main ce mois-ci vaut pour l'échéance mensuelle.
  const faitesMain=new Set(D.operations.filter(o=>o.recId&&!String(o.id).startsWith("auto_")&&o.date.slice(0,7)===m).map(o=>o.recId));
  for(const [id,x] of attendues){
    if(ids.has(id)||D.supprimes[id]) continue;
    if(recs.get(x.recId).frequence!=="hebdo" && faitesMain.has(x.recId)) continue;
    D.operations.push(x); ch=true;
  }
  if(ch) enregistrer();
}
// Statut affiché d'une opération (échéance) : payée, à venir, à confirmer, reportée, suspendue, refusée, annulée.
function enAttente(o){ return !!o.recId && (!o.statut||o.statut==="reportee") && o.date<=aujourdhui() && !!rec(o.recId)?.confirmer; }
function opComptee(o){ return !STATUTS_EXCLUS.includes(o.statut); }
function statutOp(o){
  if(STATUTS_EXCLUS.includes(o.statut)||o.statut==="payee") return o.statut;
  if(o.date>aujourdhui()) return o.statut==="reportee"?"reportee":"avenir";
  return enAttente(o)?"attente":"payee";
}
function tagStatut(st){ const x=STATUTS[st]; return x?`<span class="tag" style="${x[2]?`color:var(--${x[2]});`:""}">${x[1]} ${x[0]}</span>`:""; }
// Toutes les échéances d'une charge : celles déjà créées (mois en cours, à confirmer) puis les suivantes.
function echeancesDe(r,nbFutures=6){
  const res=[], auj=aujourdhui(), m0=moisCourant(), vus=new Set();
  for(const o of D.operations.filter(o=>o.recId===r.id&&String(o.id).startsWith("auto_")&&(moisDeCle(o.id)===m0||enAttente(o))).sort((a,b)=>a.date.localeCompare(b.date))){
    const cle=o.id.slice(`auto_${r.id}_`.length); vus.add(cle);
    res.push({cle, date:o.date, montant:num(montantOp(o)), devise:o.devise||"EUR", statut:statutOp(o), op:o});
  }
  let futures=0;
  for(let i=0;i<36&&futures<nbFutures;i++){ const m=decaleMois(m0,i);
    for(const oc of occurrencesMois(r,m)){ if(vus.has(oc.cle)) continue; if(futures>=nbFutures) break; const e=r.exceptions?.[oc.cle]||{}, d=e.date||oc.date;
      if(m===m0 && !r.actif) continue;
      res.push({cle:oc.cle, date:d, montant:e.montant!=null?e.montant:oc.montant!=null?oc.montant:r.montant, devise:r.devise||"EUR", statut:e.statut&&e.statut!=="payee"?e.statut:(d>auj?"avenir":"payee"), op:null});
      if(d>auj) futures++; } }
  return res;
}
function prochaineEcheance(r){ return echeancesDe(r,1).find(x=>x.date>=aujourdhui()&&!STATUTS_EXCLUS.includes(x.statut)) || null; }
function echeanceCourante(r){ const l=echeancesDe(r,1); return l.find(x=>x.statut==="attente")||l.find(x=>x.cle.slice(0,7)===moisCourant())||l[0]||null; }
// Le calcul « façon Pilote » : revenus − charges fixes − épargne = pour vivre ; moins les dépenses du quotidien = reste.
function planMois(m){
  const ops=opsDuMois(m), aRec=ops.some(o=>o.recId);
  let rev=0, fixes=0, epa=0, quot=0; const parCat={}, parPers={}, quotOps=[];
  for(const o of ops){
    if(!opComptee(o)) continue; // échéance suspendue, refusée ou annulée
    if(o.type==="revenu") rev+=o.montant;
    else if(o.type==="depense"){
      if(o.recId) fixes+=o.montant;
      else if(estAVenir(o)) continue; // dépense prévue : pas encore dépensée
      else { quot+=o.montant; parCat[o.categorieId]=(parCat[o.categorieId]||0)+o.montant; const p=o.personne||PERS_COMMUN; parPers[p]=(parPers[p]||0)+o.montant; quotOps.push(o); }
    }
    else if(o.type==="epargne") epa+=o.montant;
    else if(o.type==="retrait") epa-=o.montant;
  }
  if(!aRec) for(const r of D.recurrentes.filter(r=>r.actif)) for(const oc of occurrencesMois(r,m)){ const e0=r.exceptions?.[oc.cle]||{}; if(STATUTS_EXCLUS.includes(e0.statut)) continue;
    const e=versEur(e0.montant!=null?e0.montant:oc.montant!=null?oc.montant:r.montant,r.devise); if(r.type==="revenu") rev+=e; else if(r.type==="depense") fixes+=e; else if(r.type==="epargne") epa+=e; }
  const dispo=r2(rev-fixes-epa);
  return {rev:r2(rev),fixes:r2(fixes),epa:r2(epa),quot:r2(quot),dispo,reste:r2(dispo-quot),parCat,parPers,quotOps};
}
function etat(depense,budget){ if(budget<=0) return depense>0?"bad":""; const p=depense/budget; return p>=1?"bad":p>=.8?"warn":""; }

/* ---------- Accueil personnalisable ----------
   Chaque téléphone garde son propre choix (chaque personne du foyer peut avoir un accueil différent).
   Les alertes importantes (découvert, échéances à confirmer) restent toujours affichées. */
const BLOCS_ACCUEIL=[["reel","💰 Reste à vivre réel, prévu et prochain revenu"],["raccourcis","⚡ Raccourcis : dépense, rentrée, ticket, voix"],["comptes","🏦 Solde de chaque compte"],["chiffres","📈 Le mois en chiffres (revenus, dépenses, charges fixes)"],
  ["credits","💳 Crédits en cours"],["budgets","🎯 Budgets par catégorie"],["vivre","🛒 Budget pour vivre ce mois"],["venir","⏳ Prélèvements et revenus à venir"],["semaine","📅 Cette semaine"],
  ["calcul","🧮 Le calcul du mois"],["categories","📊 Où part l'argent"],["qui","👫 Qui a dépensé"],["derniers","🕐 Derniers mouvements"]];
const CACHES_DEFAUT=[];
function prefsAccueil(){
  let x={}; try{ x=JSON.parse(lsGet("accueilBlocs")||"{}")||{}; }catch(e){}
  const ids=BLOCS_ACCUEIL.map(b=>b[0]), ordre=(x.ordre||[]).filter(i=>ids.includes(i));
  // un bloc ajouté dans une nouvelle version se place après son voisin habituel
  ids.forEach((id,k)=>{ if(!ordre.includes(id)){ const av=ids.slice(0,k).reverse().find(z=>ordre.includes(z)); ordre.splice(av?ordre.indexOf(av)+1:0,0,id); } });

/* ---------- Saisie à la voix ----------
   On reconnaît le montant, la devise, le type et la catégorie, puis on ouvre le formulaire pré-rempli :
   rien n'est enregistré sans que vous touchiez « Ajouter ». */
function sansAccents(t){ return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
const MOTS_CAT={alimentation:"courses supermarche lidl aldi leclerc carrefour intermarche auchan monoprix casino franprix coop migros denner epicerie boulangerie marche",
  carburant:"essence gasoil diesel carburant plein station total esso",restaurants:"restaurant resto mcdo mcdonald burger pizza kebab sushi brasserie cafe",
  sante:"pharmacie medecin docteur dentiste sante ordonnance",transport:"parking peage train bus metro uber taxi garage",vetements:"vetement vetements habits chaussures zara kiabi",
  enfants:"enfant enfants creche nounou ecole jouet",animaux:"veterinaire croquettes chien chat animaux",maison:"bricolage ikea leroy castorama maison",loisirs:"cinema concert loisirs sortie jeu",
  shopping:"shopping amazon",cadeaux:"cadeau cadeaux",beaute:"coiffeur coiffure beaute",sport:"sport salle piscine",voyages:"hotel avion vacances voyage"};
function analyserDictee(texte){
  texte=texte.replace(/(\d)[\s  ](?=\d{3}\b)/g,"$1"); // « 1 800 » → 1800
  const t=sansAccents(texte), res={type:"depense"};
  if(/\b(recu|rentree|salaire|paie|paye moi|rembourse|remboursement|gagne|vire sur|virement recu|prime)\b/.test(t)) res.type="revenu";
  if(/francs?\b|chf/.test(t)) res.devise="CHF"; else if(/dollars?/.test(t)) res.devise="USD"; else if(/livres?( sterling)?\b/.test(t)) res.devise="GBP"; else res.devise="EUR";
  const m=t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?|francs?|chf|dollars?|\$|livres?|£)?(?:\s*(?:et\s*)?(\d{1,2})(?!\d)(?:\s*centimes?)?)?/);
  if(m){ let v=parseFloat(m[1].replace(",",".")); if(m[2]&&!/[.,]/.test(m[1])) v+=parseInt(m[2],10)/100; res.montant=r2(v); }
  const cats=catsDe(res.type==="revenu"?"revenu":"depense");
  // 1) un libellé déjà utilisé, 2) le nom d'une catégorie, 3) des mots connus
  const ops=[...D.operations].reverse().filter(o=>o.type===res.type&&o.libelle&&o.libelle.length>=3&&!o.recId);
  const deja=ops.find(o=>t.includes(sansAccents(o.libelle)));
  if(deja){ res.categorieId=deja.categorieId; res.libelle=deja.libelle; }
  if(!res.categorieId){ const c=cats.find(c=>t.includes(sansAccents(c.nom))); if(c) res.categorieId=c.id; }
  if(!res.categorieId){ for(const [id,mots] of Object.entries(MOTS_CAT)) if(cats.some(c=>c.id===id)&&mots.split(" ").some(w=>new RegExp("\\b"+w+"\\b").test(t))){ res.categorieId=id; break; } }
  if(!res.libelle){ const ch=texte.match(/(?:chez|à|au|a)\s+([A-Za-zÀ-ÿ'’\- ]{2,30})$/i);
    res.libelle=(ch?ch[1]:texte.replace(/(\d+(?:[.,]\d{1,2})?)\s*(€|euros?|francs?|chf|dollars?|livres?)?(\s*(et\s*)?\d{1,2}\s*(centimes?)?)?/i,"")).trim().replace(/^(j'ai\s+)?(recu|reçu|rentree|rentrée|de|d'|pour|en)\s+/i,"").replace(/\s{2,}/g," ").slice(0,40);
    res.libelle=res.libelle?res.libelle[0].toUpperCase()+res.libelle.slice(1):""; }
  return res;
}

/* ---------- Calendrier financier ----------
   Montre, jour par jour, ce qui est passé (opérations notées) et ce qui est prévu :
   - le mois en cours : les opérations notées et les échéances déjà créées (pas de doublon) ;
   - les mois suivants : les échéances des charges, revenus et crédits, calculées comme celles du mois en cours
     (mêmes reports, montants et statuts), mais pas enregistrées tant que leur mois n'est pas arrivé.
   Le solde prévu part du reste à vivre réel d'aujourd'hui (comptes comptés dans le total) ;
   seul ce qui est après aujourd'hui (ou à confirmer) s'y ajoute. Un budget n'y figure jamais comme une dépense. */
let calVue=lsGet("calVue")||"mois", calHorizon=lsGet("calHorizon")||"30", calMois=moisCourant(), calJour=aujourdhui(), calFiltre="";
const HORIZONS=[["7","7 jours"],["15","15 jours"],["30","30 jours"],["60","60 jours"],["90","90 jours"],["6m","6 mois"]];
const KIND_CAL={revenu:["Revenu","var(--good)"],fixe:["Charge fixe","#c2410c"],credit:["Crédit","#8b5cf6"],epargne:["Épargne","#0e7490"],prevue:["Dépense prévue","#2f6db5"],
  exceptionnelle:["Exceptionnelle","#be185d"],depense:["Dépense","#64748b"],virement:["Virement","#64748b"],exclu:["Non prélevée","#94a3b8"]};
const FILTRES_CAL=[["","Tout"],["revenu","Revenus"],["fixe","Charges fixes et crédits"],["prevue","Dépenses prévues et exceptionnelles"]];
function finHorizon(hz){ const auj=aujourdhui(); if(hz==="6m"){ const m=decaleMois(auj.slice(0,7),6), j=Math.min(+auj.slice(8),joursDansMois(m)); return m+"-"+pad2(j); } return ajJours(auj,+hz); }
function evenementsCal(deb,fin){
  const ev=D.operations.filter(o=>o.date>=deb&&o.date<=fin||enAttente(o)&&aujourdhui()>=deb&&aujourdhui()<=fin);
  const ids=new Set(D.operations.map(o=>o.id)), mc=moisCourant();
  for(let m=decaleMois(mc,1); m<=decaleMois(fin.slice(0,7),1); m=decaleMois(m,1)) // un report peut faire entrer une échéance du mois suivant
    for(const r of D.recurrentes){ if(!r.actif) continue;
      for(const oc of occurrencesMois(r,m)){ const id=`auto_${r.id}_${oc.cle}`; if(ids.has(id)||D.supprimes[id]) continue;
        const o=opDeRec(r,oc,id); if(o.date>=deb&&o.date<=fin){ o.virtuel=true; ev.push(o); } } }
  return ev.sort((a,b)=>a.date.localeCompare(b.date)||(signeOp(b)-signeOp(a)));
}
function genreCal(o){
  const r=o.recId?rec(o.recId):null;
  if(!opComptee(o)||o.statut==="reportee_fin") return "exclu";
  if(o.type==="revenu") return "revenu";
  if(o.type==="virement") return "virement";
  if(o.type==="epargne"||o.type==="retrait") return "epargne";
  if(r&&estCredit(r)) return "credit";
  if(o.recId) return "fixe";
  if(o.exceptionnelle) return "exceptionnelle";
  return o.date>aujourdhui()?"prevue":"depense";
}
function passeFiltre(g){ return !calFiltre || g===calFiltre || (calFiltre==="fixe"&&g==="credit") || (calFiltre==="prevue"&&g==="exceptionnelle"); }
// Solde prévu jour par jour (en devise d'affichage), à partir d'aujourd'hui.
function soldesPrevus(fin){
  const cs=comptesActifs(), auj=aujourdhui(), enP=(v,c)=>convertir(v,deviseCompte(c),dp());
  let s=r2(cs.reduce((a,c)=>a+enP(soldeCompte(c.id),c),0)); const reel=s, parJour={};
  const eff=o=>cs.reduce((a,c)=>a+(apresSolde(c,o)?enP(effetSur(o,c.id),c):0),0);
  const ev=evenementsCal(auj,fin).filter(o=>o.date>auj||enAttente(o));
  for(const o of ev){ const d=enAttente(o)?auj:o.date; parJour[d]=r2((parJour[d]||0)+eff(o)); }
  const res={}; let min=s, dMin=auj, entrees=0, sorties=0;
  for(const o of ev){ const v=eff(o); if(v>0) entrees+=v; else sorties-=v; }
  for(let d=auj; d<=fin; d=ajJours(d,1)){ s=r2(s+(parJour[d]||0)); res[d]=s; if(s<min-0.004){ min=s; dMin=d; } }
  return {reel, jours:res, fin:s, min:r2(min), dMin, entrees:r2(entrees), sorties:r2(sorties), eff};
}
function ligneCal(o){
  const g=genreCal(o), k=KIND_CAL[g], sg=signeOp(o), r=o.recId?rec(o.recId):null;
  const cle=o.recId&&String(o.id).startsWith("auto_")?o.id.slice(("auto_"+o.recId+"_").length):null;
  const tags=[`<span class="kcal" style="background:${k[1]}">${k[0]}</span>`];
  if(o.statut==="reportee"||(r&&r.exceptions?.[cle]?.date)) tags.push(tagStatut("reportee"));

/* ---------- Budgets (enveloppes) ----------
   Un budget est une limite que l'on se fixe, PAS une dépense : il ne change jamais le solde réel.
   Seules les dépenses réellement notées (date passée, non suspendues, non en attente) le consomment.
   Une dépense est notée une seule fois : elle baisse le solde du compte ET consomme le budget de sa catégorie.
   Ce qui n'est pas dépensé reste sur les comptes : ce n'est pas une épargne tant qu'on ne l'a pas mis de côté. */
const PERIODES_ENV=[["mensuel","Chaque mois"],["hebdo","Chaque semaine"],["annuel","Chaque année"],["ponctuel","Une seule fois (dates choisies)"]];
const NOM_PER={mensuel:"mensuel",hebdo:"de la semaine",annuel:"annuel",ponctuel:"ponctuel"};
const SEUILS_ENV=[50,80,90,100,120,150];
function isoJ(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function ajJours(s,n){ const d=new Date(s+"T12:00"); d.setDate(d.getDate()+n); return isoJ(d); }
function jc(s){ return new Date(s+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function periodeEnv(v,ref){
  ref ||= aujourdhui();
  if(v.periode==="hebdo"){ const d=new Date(ref+"T12:00"), deb=ajJours(ref,-((d.getDay()+6)%7)), fin=ajJours(deb,6); return {deb,fin,lbl:`semaine du ${jc(deb)} au ${jc(fin)}`}; }
  if(v.periode==="annuel"){ const y=ref.slice(0,4); return {deb:y+"-01-01",fin:y+"-12-31",lbl:"année "+y}; }
  if(v.periode==="ponctuel"){ const deb=v.debut||ref, fin=v.fin||deb; return {deb,fin,lbl:`du ${jc(deb)} au ${jc(fin)} ${fin.slice(0,4)}`}; }
  const m=ref.slice(0,7); return {deb:m+"-01",fin:m+"-"+pad2(joursDansMois(m)),lbl:nomMois(m)};
}
function iconeEnv(v){ return v.icone || cat(v.categories?.[0])?.icone || "🎯"; }
// Montant d'une dépense dans la devise du budget (le montant d'origine si c'est la même devise).
function dansDevise(o,dev){ const od=o.devise||"EUR"; return od===dev && o.montantOrigine!=null ? num(o.montantOrigine) : convertir(o.montant,"EUR",dev); }
function etatEnv(v,ref){
  const per=periodeEnv(v,ref), dev=v.devise||"EUR", budget=r2(num(v.montant)), cats=v.categories||[];
  const ops=D.operations.filter(o=>o.type==="depense"&&cats.includes(o.categorieId)&&o.date>=per.deb&&o.date<=per.fin&&opComptee(o)&&(!v.personne||(o.personne||PERS_COMMUN)===v.personne));
  const reels=ops.filter(o=>!estAVenir(o)&&!enAttente(o)), prevus=ops.filter(o=>estAVenir(o)||enAttente(o));
  const depense=r2(reels.reduce((a,o)=>a+dansDevise(o,dev),0)), prevu=r2(prevus.reduce((a,o)=>a+dansDevise(o,dev),0));
  const pct=budget>0?depense/budget*100:(depense?100:0), seuils=[...(v.alertes||[80,100])].sort((a,b)=>a-b);
  const warnA=seuils.filter(t=>t<100).pop()??80;
  const niv=pct>=100&&depense>budget?"bad":pct>=100?"bad":pct>=warnA?"warn":"";
  const auj=aujourdhui(), statut=auj<per.deb?"avant":auj>per.fin?"fini":"encours";
  return {per,dev,budget,depense,prevu,reste:r2(budget-depense),pct,niv,reels:reels.sort((a,b)=>b.date.localeCompare(a.date)),prevus,statut,depassement:r2(Math.max(0,depense-budget))};
}
function envActifs(){ return D.enveloppes.filter(v=>v.actif!==false && !(v.periode==="ponctuel"&&(v.fin||"")<aujourdhui())); }
function pctEnveloppes(){ const m=new Map(); for(const v of D.enveloppes||[]) if(v.actif!==false) m.set(v.id,etatEnv(v).pct); return m; }
// Seuils franchis par la dernière modification (ex. 80 %, 100 %) : simple message, l'enregistrement n'est jamais bloqué.
function alertesEnveloppes(av){

    const e=etatEnv(v), b=av.get(v.id), a=e.pct; if(e.statut!=="encours"||a<=b) continue;

// Bilan du mois écoulé : ce qui n'a pas été utilisé reste sur les comptes (ce n'est pas une épargne réelle).
function bilanMoisEnv(m){

function enveloppesDepuisPlan(){

function vueCredits(){

      <div class="lines num" style="margin-top:6px">
        <div class="l"><span>Reste à payer (estimé)</span><span>${fmt(e.reste,r.devise)}</span></div>
        ${p?`<div class="l"><span>Prochain prélèvement</span><span>${h(dateCourte(p.date))} · ${fmt(p.montant,r.devise)} ${stP&&stP!=="avenir"?tagStatut(stP):""}</span></div>`:""}
        <div class="l"><span>Fin prévue</span><span>${e.fin?new Date(e.fin+"T12:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}):"?"}</span></div>

  return `<div class="stack">
    <div class="grid g3">
      <div class="card kpi"><div class="lbl">Mensualités en cours</div><div class="val num">${eur(totM)}</div><div class="note">${enC.length} crédit(s)</div></div>

    </div>
    <div class="bar" style="margin:4px 0 0"><h3 style="margin:0">💳 Crédits en cours</h3><div class="grow"></div><button class="btn sm pri" data-act="credit-new">+ Nouveau crédit</button></div>

    ${aSuivre.length?`<div class="card"><h3>Charges « Crédit » pas encore suivies</h3>${aSuivre.map(r=>`<div class="mline" style="cursor:default"><div class="mid"><div class="t">${h(r.libelle)}${r.actif?"":" (en pause)"}</div><div class="s">${fmt(r.montant,r.devise)} par mois</div></div><button class="btn sm" data-act="credit-suivre:${r.id}">Suivre comme crédit</button></div>`).join("")}<p class="note" style="margin:6px 0 0">En la suivant comme crédit : nombre de mensualités, date de fin, confirmation des prélèvements, reports.</p></div>`:""}
    ${pause.length?`<details class="more"><summary>Crédits en pause (${pause.length})</summary>${pause.map(carte).join("")}</details>`:""}
    ${finis.length?`<div class="card"><h3>🎉 Crédits terminés</h3>${finis.map(r=>{ const e=etatCredit(r); return `<div class="mline" data-fiche="${r.id}"><div class="mid"><div class="t">${h(r.libelle)}</div><div class="s">terminé le ${h(dateCourte(e.dateFin))}${r.credit.organisme?" · "+h(r.credit.organisme):""}</div></div><div style="text-align:right"><b class="num pos">+ ${fmt(r.montant,r.devise)}</b><div class="s">par mois libérés</div></div></div>`; }).join("")}</div>`:""}
    <p class="note">Chaque mensualité est prévue automatiquement à sa date. Confirmez-la quand elle est passée : le nombre de mensualités restantes ne baisse qu'à ce moment-là.</p>

function ficheCredit(r){
  const e=etatCredit(r), c=r.credit, hist=(r.historique||[]).slice(-12).reverse(), auj=aujourdhui();
  const lignes=e.sch.filter(x=>x.date>=decaleMois(moisCourant(),-1)+"-01" || r.exceptions?.[x.cle]?.statut!=="payee");
  const statutDe=x=>{ const ex=r.exceptions?.[x.cle]||{}; if(ex.statut) return ex.statut==="reportee"&&(ex.date||x.date)<=auj&&r.confirmer?"attente":ex.statut; return x.date>auj?"avenir":"attente"; };
  ouvrirModal(`<h2>${h(r.libelle)}</h2>
    <p class="note" style="margin-top:-6px">${[c.organisme, compte(r.compteId)?.nom, fmt(r.montant,r.devise)+" par mois"].filter(Boolean).map(h).join(" · ")}</p>
    ${e.termine?`<div class="card" style="border-color:var(--good)"><b class="pos">🎉 Crédit terminé le ${h(dateCourte(e.dateFin))}</b><div class="note">${fmt(r.montant,r.devise)} par mois libérés.</div></div>`:`
    <div class="gbar"><i style="width:${e.pct}%;background:var(--accent)"></i></div>

      <div class="l"><span>Mensualités restantes</span><b>${e.restantes}</b></div>
      <div class="l"><span>Reste à payer (estimé)</span><span>${fmt(e.reste,r.devise)}</span></div>
      <div class="l"><span>Fin prévue</span><span>${e.fin?h(dateCourte(e.fin)):"?"}</span></div>
      ${num(c.capital)?`<div class="l"><span>Montant emprunté</span><span>${fmt(c.capital,r.devise)}</span></div>`:""}
      ${num(c.taux)?`<div class="l"><span>Taux</span><span>${String(c.taux).replace(".",",")} %</span></div>`:""}
      <div class="l"><span>Reports effectués</span><span>${e.reports}</span></div>
    </div>`}
    <h3 style="margin:12px 0 4px">Échéancier</h3>
    <div style="max-height:260px;overflow:auto">${lignes.map(x=>`<div class="mline" data-echeance="${r.id}|${x.cle}"><div class="mid"><div class="t">${x.n?`N° ${e.total?e.total-Math.round(num(c.nbRestantes))+x.n:x.n} · `:""}${h(dateCourte(r.exceptions?.[x.cle]?.date||x.date))}</div><div class="s">${tagStatut(statutDe(x))}</div></div><b class="num">${fmt(x.montant,r.devise)}</b><span style="color:var(--muted)">›</span></div>`).join("")}</div>

    <div class="actions">${e.termine?"":`<button type="button" class="btn left" id="fc-sim">🧮 Remboursement anticipé</button>`}<button type="button" class="btn" id="fc-fermer">Fermer</button><button type="button" class="btn pri" id="fc-modif">✏️ Modifier</button></div>`, m=>{

      m.querySelector("#fc-sim")?.addEventListener("click",()=>{ fermerModal(); simulateurCredit(rec(r.id)); });

function formCredit(r,depuis){

  ouvrirModal(`<h2>${r?"Modifier le crédit":"Nouveau crédit"}</h2>

        <div class="row2"><div class="fld"><label>Nombre total de mensualités</label><input name="nbTotal" inputmode="numeric" value="${fx(c.nbTotal)}"></div>
          <div class="fld"><label>Dernière mensualité (si différente)</label><input name="derniere" inputmode="decimal" value="${fx(c.derniere)}"></div></div>

      </details>
      <div class="actions">${r?`<button type="button" class="btn danger left" id="cr-del">Supprimer</button>`:""}<button type="button" class="btn" id="cr-cancel">Annuler</button><button class="btn pri">Enregistrer</button></div>
    </form>`, m=>{

        if(!(n>0)||!d){ m.querySelector("#cr-fin").textContent=""; return; }
        const fin=decaleMois(d.slice(0,7),n-1+(r?Math.max(0,etatCredit(r).sch.length-etatCredit(r).inst.length):0));
        m.querySelector("#cr-fin").textContent="📅 Fin prévue : "+nomMois(fin); };
      f.restantes.oninput=majFin; f.prochain.onchange=majFin; majFin();
      f.compteId.onchange=()=>{ if(!num(f.montant.value)) f.devise.value=deviseCompte(compte(f.compteId.value)); };
      m.querySelector("#cr-cancel").onclick=fermerModal;
      f.onsubmit=ev=>{ ev.preventDefault();

        if(!M){ f.montant.focus(); return; } if(!(N>0)){ f.restantes.focus(); return; } if(!d){ f.prochain.focus(); return; }
        const opt=k=>{ const x=r2(Math.abs(num(f[k].value))); return x||undefined; };
        const credit={organisme:f.organisme.value.trim(), nbTotal:opt("nbTotal")?Math.round(opt("nbTotal")):undefined, derniere:opt("derniere"), capital:opt("capital"), restantDu:opt("restantDu"), taux:opt("taux")};
        Object.keys(credit).forEach(k=>credit[k]===undefined&&delete credit[k]);
        const x={libelle:f.libelle.value.trim(), type:"depense", montant:M, devise:f.devise.value, categorieId:"credit", reserveId:"", compteId:f.compteId.value, personne:f.personne.value,
          frequence:"mensuel", confirmer:true, actif:true, fin:""};
        // Prochain prélèvement changé (ou nouveau crédit) : l'échéancier repart de cette date.
        if(!r || d!==(e.prochaine?.date)){ x.debut=d; x.jour=new Date(d+"T12:00").getDate(); credit.nbRestantes=N;

        fermerModal();

function simulateurCredit(r){

    ${hist.length?`<details class="more"><summary>Historique des modifications (${(r.historique||[]).length})</summary>${hist.map(x=>`<div class="note" style="padding:4px 0;border-bottom:1px solid var(--line)">${new Date(x.le).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})} — ${h(x.txt)}</div>`).join("")}</details>`:""}
    <div class="actions"><button type="button" class="btn" id="fr-fermer">Fermer</button><button type="button" class="btn pri" id="fr-modif">✏️ Modifier la charge</button></div>`, m=>{

// Change une seule échéance (statut, date, montant) ; patch=null => revenir à la normale.
function definirEcheance(rid,cle,patch,txt,msg){
  const id=`auto_${rid}_${cle}`, courant=moisDeCle(id)>=moisCourant(), r0=rec(rid), etaitEnCours=r0&&estCredit(r0)&&!etatCredit(r0).termine;
  modifier(d=>{ const r=d.recurrentes.find(z=>z.id===rid); if(!r) return;
    const ex={...(r.exceptions||{})};
    if(patch===null) delete ex[cle]; else { const e={...(ex[cle]||{}),...patch}; Object.keys(e).forEach(k=>{ if(e[k]===undefined||e[k]==="") delete e[k]; }); if(Object.keys(e).length) ex[cle]=e; else delete ex[cle]; }
    r.exceptions=ex;
    r.historique=[...(r.historique||[]), {le:new Date().toISOString(), txt}].slice(-40);
    // Opération déjà créée : celles du mois en cours restées automatiques seront recalculées juste après ;
    // les autres (modifiées à la main, ou d'un mois passé) sont mises à jour ici.
    const o=d.operations.find(z=>z.id===id);
    if(o && !(courant && o.maj===1)){
      const oc=occurrencesMois(r,cle.slice(0,7)).find(z=>z.cle===cle), e=ex[cle]||{};
      if(e.statut) o.statut=e.statut; else delete o.statut;
      o.date=e.date||oc?.date||o.date;
      if(patch===null||patch.montant!==undefined){ const mt=e.montant!=null?e.montant:oc?.montant!=null?oc.montant:r.montant; o.montant=versEur(mt,r.devise); o.montantOrigine=r.devise&&r.devise!=="EUR"?mt:null; }
    }
  },msg);
  autoRecurrentes(); rendu();
  const r1=rec(rid);
  if(etaitEnCours && etatCredit(r1).termine){
    modifier(d=>{ const z=d.recurrentes.find(x=>x.id===rid); z.historique=[...(z.historique||[]),{le:new Date().toISOString(),txt:"Crédit terminé : dernière mensualité payée"}].slice(-40); });
    setTimeout(()=>alert(`🎉 Crédit « ${r1.libelle} » terminé !\n\n${fmt(r1.montant,r1.devise)} par mois sont maintenant libérés. Il est rangé dans les crédits terminés et ne sera plus prévu.`),300);
  }
}
function echeanceActions(rid,cle){
  const r=rec(rid); if(!r) return;
  const x=echeancesDe(r,24).find(z=>z.cle===cle) || (()=>{ const oc=occurrencesMois(r,cle.slice(0,7)).find(z=>z.cle===cle); return oc&&{cle,date:oc.date,montant:r.montant,devise:r.devise||"EUR",statut:oc.date>aujourdhui()?"avenir":"payee"}; })();
  if(!x) return;
  const passe=x.date<=aujourdhui(), dl=dateCourte(x.date), aExc=!!r.exceptions?.[cle] || (x.op && x.op.statut);
  const dev=symbole(x.devise), cr=estCredit(r), num_=cr?echeancierCredit(r).find(z=>z.cle===cle)?.n:null, ec=cr?etatCredit(r):null;
  ouvrirModal(`<h2>${h(r.libelle)}</h2><p class="note" style="margin-top:-6px">${cr?(num_?`Mensualité ${ec.total?`n° ${ec.total-Math.round(num(r.credit.nbRestantes))+num_} sur ${ec.total}`:`${num_} sur ${ec.inst.length} restantes`} · `:"Mensualité non prélevée · "):""}Échéance du ${h(dl)} · ${fmt(x.montant,x.devise)} · ${tagStatut(x.statut)}</p>
    <div class="stack" style="gap:8px">
      ${passe&&x.statut!=="payee"&&!(cr&&!num_)?`<button class="btn pri" data-ech="payee">✅ C'est passé : marquer comme payée</button>`:""}
      ${cr&&x.statut!=="payee"?`<div class="card" style="padding:10px"><b>⏭️ Reporter en fin de crédit</b><p class="hint" style="margin:4px 0 6px">La banque ne prélève pas cette mensualité : elle est ajoutée à la fin, le crédit se termine un mois plus tard.</p>
        <div style="display:flex;gap:8px"><input id="e-frais" class="field-simple" inputmode="decimal" placeholder="Frais de report (facultatif)" style="flex:1;width:auto"><span style="align-self:center">${dev}</span><button class="btn" data-ech="reportfin">Reporter</button></div>
        <span class="hint">Frais éventuels ajoutés à la mensualité suivante. N'indiquez que ce que la banque vous a annoncé.</span></div>`:""}
      <div class="card" style="padding:10px"><b>↪️ ${cr?"Payée plus tard, à une autre date":"Reporter cette échéance"}</b><div style="display:flex;gap:8px;margin-top:6px"><input type="date" id="e-date" class="field-simple" value="${h(x.date)}" style="flex:1;width:auto"><button class="btn" data-ech="reporter">Reporter</button></div>
        <span class="hint">Seule cette échéance change de date. Les suivantes restent prévues normalement${cr?", la date de fin ne change pas":""}.</span></div>
      <div class="card" style="padding:10px"><b>✏️ Montant de cette échéance seulement</b><div style="display:flex;gap:8px;margin-top:6px"><input id="e-mt" class="field-simple" inputmode="decimal" value="${String(x.montant).replace(".",",")}" style="flex:1;width:auto"><span style="align-self:center">${dev}</span><button class="btn" data-ech="montant">OK</button></div></div>
      <button class="btn" data-ech="suspendue">⏸️ Suspendre uniquement ${r.frequence==="hebdo"?"cette semaine":"ce mois-ci"}</button>
      ${passe?`<button class="btn" data-ech="refusee">⛔ Le prélèvement a été refusé</button>`:""}
      ${cr?"":`<button class="btn" data-ech="annulee">🚫 Annuler cette échéance</button>`}
      ${aExc?`<button class="btn ghost" data-ech="retablir">↺ Remettre comme prévu</button>`:""}
    </div>
    <p class="hint">${cr?"Suspendre ou refuser : la mensualité n'est pas déduite de vos comptes et reste due ; le crédit se termine un mois plus tard. Les mensualités restantes ne baissent qu'avec « payée ».":"Suspendre, refuser ou annuler : cette échéance n'est pas déduite de vos comptes. La charge reprend normalement ensuite."}</p>
    <div class="actions"><button type="button" class="btn" id="e-fermer">Fermer</button></div>`, m=>{
      m.querySelector("#e-fermer").onclick=fermerModal;
      m.querySelectorAll("[data-ech]").forEach(b=>b.onclick=()=>{ const a=b.dataset.ech; fermerModal();
        if(a==="payee") definirEcheance(rid,cle,{statut:"payee"},`Échéance du ${dl} confirmée payée`,"Échéance marquée payée");
        else if(a==="reporter"){ const nd=m.querySelector("#e-date").value; if(!nd||nd===x.date) return;
          definirEcheance(rid,cle,{statut:"reportee",date:nd},`Échéance du ${dl} reportée au ${dateCourte(nd)}`,"Échéance reportée au "+dateCourte(nd)); }
        else if(a==="montant"){ const v=r2(Math.abs(num(m.querySelector("#e-mt").value))); if(!v) return;
          definirEcheance(rid,cle,{montant:v===r2(r.montant)?undefined:v},`Montant de l'échéance du ${dl} : ${fmt(x.montant,x.devise)} → ${fmt(v,x.devise)}`,"Montant de cette échéance modifié"); }
        else if(a==="reportfin"){ const fr_=r2(Math.abs(num(m.querySelector("#e-frais").value)));
          definirEcheance(rid,cle,{statut:"reportee_fin",frais:fr_||undefined,date:undefined},`Mensualité du ${dl} reportée en fin de crédit${fr_?` (frais ${fmt(fr_,x.devise)})`:""}`,"Mensualité reportée : le crédit finit un mois plus tard"); }
        else if(a==="suspendue") definirEcheance(rid,cle,{statut:"suspendue"},`Échéance du ${dl} suspendue`,"Suspendue pour cette fois, elle reprendra ensuite");
        else if(a==="refusee") definirEcheance(rid,cle,{statut:"refusee"},`Prélèvement du ${dl} refusé`,"Noté : prélèvement refusé");
        else if(a==="annulee") definirEcheance(rid,cle,{statut:"annulee"},`Échéance du ${dl} annulée`,"Échéance annulée");
        else if(a==="retablir") definirEcheance(rid,cle,null,`Échéance du ${dl} remise comme prévu`,"Échéance remise comme prévu");
      });
  });
}
